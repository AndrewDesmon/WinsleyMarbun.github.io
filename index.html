<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>COLREGs: Jaga Anjungan</title>
<meta name="description" content="Belajar COLREGs untuk taruna dan perwira: materi Aturan 1–41, Annex, latihan, simulasi, dan jaga anjungan. Bisa dipakai tanpa internet.">
<meta name="theme-color" content="#0E2742">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="favicon-32.png" sizes="32x32" type="image/png">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Jaga Anjungan">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#E7EEF0; --card:#FFFFFF; --ink:#0F2A40; --muted:#4F6676; --line:#C9D6DC;
  --band:#0E2742; --bandInk:#F2F6F8; --bandMuted:#B3C4D0; --port:#C8202F; --stbd:#11875A;
  --sea:#D8E7ED; --enbg:#F1F6F7; --ok:#11875A; --bad:#C8202F; --amber:#C98A00; --focus:#E0A100;
  --onInk:#FFFFFF;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#08141E; --card:#10202D; --ink:#E1EAF0; --muted:#8FA6B6; --line:#22384A;
    --band:#0B1E30; --sea:#15303F; --enbg:#0C1A25; --ok:#2FC47F; --bad:#FF5A5A; --amber:#F2B624; --onInk:#08141E;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#08141E; --card:#10202D; --ink:#E1EAF0; --muted:#8FA6B6; --line:#22384A;
  --band:#0B1E30; --sea:#15303F; --enbg:#0C1A25; --ok:#2FC47F; --bad:#FF5A5A; --amber:#F2B624; --onInk:#08141E;
  color-scheme:dark;
}
/* Bridge night mode: red only, to keep night vision */
:root[data-mode="bridge"]{
  --paper:#0A0101; --card:#150303; --ink:#FF6250; --muted:#B4473B; --line:#3D0F0B;
  --band:#120202; --bandInk:#FF6A58; --bandMuted:#A8443A; --port:#FF5544; --stbd:#B03A2E;
  --sea:#230605; --enbg:#1B0403; --ok:#FF8A78; --bad:#FF3B2A; --amber:#FF7A66; --focus:#FF8A78; --onInk:#150303;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 70px);scroll-padding-bottom:calc(env(safe-area-inset-bottom,0px) + 80px)}
body{margin:0;background:var(--paper);color:var(--ink);font:400 17px/1.55 Barlow,"Segoe UI",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:"Barlow Condensed","Arial Narrow",Barlow,system-ui,sans-serif;font-weight:700;line-height:1.1;margin:0}
a{color:inherit}
button,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.wrap{max-width:780px;margin:0 auto;padding:0 16px}
.muted{color:var(--muted)}
.fine{font-size:14px;color:var(--muted);margin:8px 0 0}

/* Header */
.top{background:var(--band);color:var(--bandInk);position:sticky;top:0;z-index:20}
.top::after{content:"";position:absolute;left:0;right:0;bottom:0;height:4px;background:linear-gradient(90deg,var(--port) 50%,var(--stbd) 50%)}
.top .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-top:10px;padding-bottom:14px}
.brand{text-decoration:none;display:flex;align-items:baseline;gap:8px}
.brand b{font-family:"Barlow Condensed",sans-serif;font-size:28px;letter-spacing:.3px}
.brand span{color:var(--bandMuted);font-size:15px}
@media (max-width:420px){.brand span{display:none}}
.modebtn{white-space:nowrap;flex:none;display:inline-flex;align-items:center;gap:6px;background:none;border:1.5px solid rgba(255,255,255,.25);color:var(--bandInk);border-radius:20px;padding:5px 12px;font-size:14px;font-weight:600;cursor:pointer}
.modebtn[aria-pressed="true"]{border-color:var(--bandInk)}
.modebtn svg{width:16px;height:16px}

main.wrap{padding:18px 16px calc(96px + env(safe-area-inset-bottom,0px))}
main:focus{outline:none}
h1.pg{font-size:34px;margin:4px 0 6px}
.lead{color:var(--muted);margin:0 0 16px;max-width:62ch}

/* Bottom tabs */
.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);z-index:20}
.tabs .wrap{display:grid;grid-template-columns:repeat(5,1fr);padding:0 2px}
.tabs a{display:flex;flex-direction:column;align-items:center;gap:1px;padding:8px 2px 9px;font-size:12.5px;font-weight:600;color:var(--muted);text-decoration:none;border-top:3px solid transparent}
.tabs a[aria-current="page"]{color:var(--ink);border-top-color:var(--ink)}
.tabs svg{width:23px;height:23px}

/* Common */
.btn{border:0;background:var(--ink);color:var(--onInk);border-radius:10px;padding:11px 16px;font-weight:600;cursor:pointer;text-decoration:none;display:inline-block;line-height:1.3}
.btn.ghost{background:none;color:var(--ink);border:1.5px solid var(--line)}
.btn:disabled{opacity:.5;cursor:default}
.linkbtn{background:none;border:0;padding:0;color:var(--ink);text-decoration:underline;text-underline-offset:3px;cursor:pointer;font-weight:600;font-size:15px}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.panel{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:12px}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--ok);border-radius:3px;transition:width .3s}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--card);max-width:100%;overflow-x:auto}
.seg button{border:0;background:none;padding:8px 14px;font-weight:600;font-size:15px;cursor:pointer;white-space:nowrap}
.seg button[aria-pressed="true"],.seg button[aria-selected="true"]{background:var(--ink);color:var(--onInk)}
.chip{border:1px solid var(--line);background:var(--card);border-radius:18px;padding:6px 12px;font-size:14.5px;font-weight:600;cursor:pointer;text-decoration:none;display:inline-block}
.search{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:var(--card);margin-bottom:12px}
.callout{background:var(--sea);border-radius:10px;padding:12px 14px}
.callout p{margin:6px 0 0}
.back{display:inline-block;margin-bottom:8px;font-weight:600;color:var(--muted);text-decoration:none}

/* Home */
.route{display:block;width:100%;max-width:520px;height:auto;margin:6px 0 10px}
.route .trk{fill:none;stroke:var(--muted);stroke-width:2;stroke-dasharray:4 6;opacity:.6}
.route a circle{fill:var(--card);stroke:var(--line);stroke-width:2.5}
.route a text{fill:var(--ink);font:700 13px "Barlow Condensed",sans-serif;text-anchor:middle;dominant-baseline:central}
.route a.part circle{fill:var(--sea);stroke:var(--amber)}
.route a.full circle{fill:var(--ok);stroke:var(--ok)}
.route a.full text{fill:var(--onInk)}
.route a:focus-visible circle{stroke:var(--focus);stroke-width:4}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:14px;color:var(--muted);margin-bottom:14px}
.legend i{display:inline-block;width:11px;height:11px;border-radius:50%;margin-right:5px;vertical-align:-1px;border:2px solid var(--line);background:var(--card)}
.legend i.p{background:var(--sea);border-color:var(--amber)}.legend i.f{background:var(--ok);border-color:var(--ok)}
.big{font-family:"Barlow Condensed",sans-serif;font-size:44px;font-weight:700;line-height:1}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 18px}
.partrow{display:grid;grid-template-columns:1fr 70px;gap:4px 12px;align-items:center;padding:10px 0;border-top:1px solid var(--line);text-decoration:none}
.partrow:first-of-type{border-top:0}
.partrow span{font-weight:600}
.partrow small{color:var(--muted);text-align:right}
.partrow .bar{grid-column:1/-1}
.soon li{margin:4px 0}
h2.sec{font-size:24px;margin:22px 0 8px}

/* Materi list */
.part{margin:22px 0 8px}
.part h2{font-size:22px}
.part p{margin:2px 0 0;color:var(--muted);font-size:15px}
.rrow{display:grid;grid-template-columns:52px 1fr 54px;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:6px;text-decoration:none}
.rrow .num{font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:28px;line-height:1}
.rrow .tt{font-weight:600;line-height:1.25}
.rrow .tt small{display:block;color:var(--muted);font-weight:400;font-size:14px}
.rrow .pc{font-size:14px;color:var(--muted);text-align:right}
.rrow.full .pc{color:var(--ok);font-weight:600}
.soonrow{opacity:.6;border-style:dashed}
.hit{display:block;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:6px;text-decoration:none}
.hit b{display:block}
.hit span{color:var(--muted);font-size:15px}
mark{background:var(--sea);color:inherit;border-radius:3px;padding:0 2px}

/* Rule page */
.rhead{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;align-items:end;margin-bottom:12px}
.rhead .n{font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:64px;line-height:.85;grid-row:span 2}
.rhead h1{font-size:30px}
.rhead .en-t{color:var(--muted);font-size:16px}
.rmeta{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:0 0 14px}
.rmeta .bar{flex:1;min-width:120px}
.leadbox{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:12px}
.sub{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:12px;scroll-margin-top:84px}
.sub.done{border-left:5px solid var(--ok)}
.sub.flash{animation:fl 1.2s ease-out}
@keyframes fl{0%{box-shadow:0 0 0 4px var(--focus)}100%{box-shadow:0 0 0 0 transparent}}
@media (prefers-reduced-motion:reduce){.sub.flash{animation:none}}
.subhead{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:8px}
.subhead h3{font-size:26px}
.help{width:40px;height:40px;border-radius:50%;border:1.5px solid var(--ink);background:var(--card);font:700 20px "Barlow Condensed",sans-serif;cursor:pointer;flex:none}
.lbl{font-size:13.5px;font-weight:600;color:var(--muted);margin-bottom:2px}
.en{background:var(--enbg);border-left:3px solid var(--ink);border-radius:0 8px 8px 0;padding:10px 12px;margin-bottom:12px}
.en p,.leadbox .enp{font-family:Georgia,"Iowan Old Style","Times New Roman",serif;font-size:16.5px;line-height:1.6;margin:0 0 6px}
.en.collapsed .entext{display:none}
.en.collapsed{padding:8px 12px}
.sub p{margin:0 0 6px;max-width:68ch}
.sub p.li,.leadbox p.li{padding-left:22px}
.tr,.ex,.eg{margin-bottom:12px}
.eg{background:var(--sea);border-radius:8px;padding:10px 12px}
.subfoot{display:flex;gap:8px;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:12px;margin-top:4px}
.mark,.notebtn{border:1.5px solid var(--line);background:none;border-radius:8px;padding:8px 12px;font-weight:600;font-size:15px;cursor:pointer}
.mark[aria-pressed="true"]{background:var(--ok);border-color:var(--ok);color:var(--onInk)}
.term{background:none;border:0;padding:0;font:inherit;color:inherit;text-decoration:underline dotted;text-decoration-thickness:1.5px;text-underline-offset:3px;cursor:help}
.endsec{margin-top:24px}
.endsec h2{font-size:24px;margin-bottom:8px}
.mn{border-left:4px solid var(--amber);background:var(--sea);border-radius:0 8px 8px 0;padding:10px 12px;margin:10px 0}
.rel{display:flex;gap:8px;flex-wrap:wrap}
.rel .chip.off{opacity:.55;cursor:default}
.chk{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:10px}
.chk .qtext{font-size:18px}
.pager{display:flex;justify-content:space-between;gap:10px;margin-top:20px}
.pager a{flex:1}
.pager a:last-child{text-align:right}

/* Quiz */
.qtext{font-size:19px;font-weight:600;line-height:1.35;margin:6px 0 0}
.opts{display:grid;gap:8px;margin-top:12px}
.opt{text-align:left;border:1.5px solid var(--line);background:var(--paper);border-radius:10px;padding:11px 14px;cursor:pointer;font-weight:500;line-height:1.3}
.opt:hover:not(:disabled){border-color:var(--ink)}
.opt.right{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 15%,var(--card))}
.opt.wrong{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 12%,var(--card))}
.opt:disabled{cursor:default}
.fb p{margin:12px 0 10px}
.prog{height:4px;background:var(--line);border-radius:2px;margin:10px 0 4px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--ink)}
.score{font-family:"Barlow Condensed",sans-serif;font-size:20px;font-weight:700;color:var(--muted)}
.review div{border-top:1px solid var(--line);padding:10px 0;font-size:15px}
.review .x{color:var(--ok);font-weight:600}

/* Sheet */
.sheet{position:fixed;inset:0;z-index:50;display:flex;align-items:flex-end;justify-content:center}
.sheet[hidden]{display:none}
.sheet-back{position:absolute;inset:0;background:rgba(0,0,0,.45)}
.sheet-panel{position:relative;background:var(--card);width:100%;max-width:680px;max-height:88%;border-radius:16px 16px 0 0;display:flex;flex-direction:column;padding-bottom:env(safe-area-inset-bottom,0px)}
.sheet-head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 16px 10px;border-bottom:1px solid var(--line)}
.sheet-head h2{font-size:24px}
.xbtn{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:none;font-size:22px;line-height:1;cursor:pointer}
.sheet-body{overflow-y:auto;padding:14px 16px 18px}
.htabs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
.htabs button{border:1.5px solid var(--line);background:none;border-radius:18px;padding:6px 12px;font-weight:600;font-size:14.5px;cursor:pointer}
.htabs button[aria-selected="true"]{background:var(--ink);color:var(--onInk);border-color:var(--ink)}
.sheet-body p{margin:0 0 10px}
dl.gl dt{font-weight:600;margin-top:12px}
dl.gl dd{margin:2px 0 0;color:var(--ink)}
.chat{display:flex;flex-direction:column;gap:10px;margin-bottom:12px}
.b{border-radius:12px;padding:10px 12px;max-width:92%}
.b.u{align-self:flex-end;background:var(--ink);color:var(--onInk)}
.b.a{align-self:flex-start;background:var(--sea)}
.b.a p{margin:0 0 8px}
.b.a .linkbtn{font-size:14px}
.b.err{background:none;border:1px dashed var(--bad);color:var(--bad);font-size:15px}
.sugg{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
textarea{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--paper);resize:vertical;margin-bottom:8px}
.note{border-top:1px solid var(--line);padding:10px 0}
.note small{color:var(--muted);display:block;margin-bottom:4px}
.note p{white-space:pre-wrap}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.toggle:first-of-type{border-top:0}

/* Tools */
.night{display:block;width:100%;height:auto;border-radius:10px;background:#05101B}
.day{display:block;width:100%;height:auto;border-radius:10px}
.vis{max-width:420px}
.vis .day{max-width:200px}
.flash{animation:blink .5s steps(2,start) infinite}
@keyframes blink{to{opacity:.15}}
@media (prefers-reduced-motion:reduce){.flash{animation:none}}
.sel{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--paper);margin-bottom:12px}
.range{width:100%;accent-color:var(--ink)}
.grid360{display:grid;grid-template-columns:2fr 1fr;gap:10px;align-items:center;margin-bottom:12px}
@media (max-width:480px){.grid360{grid-template-columns:1fr}.topv{max-width:180px;margin:0 auto}}
.topv{display:block;width:100%;height:auto}
.pctl{margin-top:14px}
.chip.on{background:var(--ink);color:var(--onInk);border-color:var(--ink)}
.slot{min-width:84px;padding:8px 10px;border-radius:18px;border:2px dashed var(--line);background:none;font-weight:600;cursor:pointer}
.slot.w{background:#FFF8E6;color:#222;border:2px solid #ccc}.slot.r{background:#E02A2A;color:#fff;border:2px solid #E02A2A}.slot.g{background:#1BA35E;color:#fff;border:2px solid #1BA35E}
.sig{display:grid;grid-template-columns:48px 1fr;gap:12px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.play{width:44px;height:44px;border-radius:50%;border:1.5px solid var(--line);background:var(--paper);cursor:pointer;display:grid;place-items:center}
.sig.playing .play{background:var(--ink);color:var(--onInk);border-color:var(--ink)}
.pat{display:flex;gap:5px;align-items:center;flex-wrap:wrap;margin-bottom:3px;min-height:14px}
.bl{height:10px;border-radius:5px;background:var(--ink);display:inline-block}.bl.s{width:14px}.bl.l{width:50px}
.bell{font-size:12px;font-weight:600;border:1.5px solid var(--ink);border-radius:10px;padding:0 7px;line-height:16px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--ink);display:inline-block}
.sig .m small{color:var(--muted);display:block;font-size:14px}
.subh{font-size:20px;margin:6px 0 2px}
.fog{background:linear-gradient(180deg,#b9c2c8,#dfe4e7);color:#1b2a35;border-color:#aab4bb}
:root[data-mode="bridge"] .fog{background:linear-gradient(180deg,#2a0806,#160303);color:var(--ink)}
.fog .opt{background:rgba(255,255,255,.55)}
.foglbl{font-size:16px}
.hk{display:grid;grid-template-columns:30px 1fr auto;gap:10px;align-items:center;padding:10px 6px;border-top:1px solid var(--line)}
.hk:first-child{border-top:0}
.hk .xbtn{margin-left:4px}
.hkn{font:700 22px "Barlow Condensed",sans-serif}
.hk.okk{background:color-mix(in srgb,var(--ok) 14%,transparent)}.hk.nok{background:color-mix(in srgb,var(--bad) 12%,transparent)}
.boxes{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin:12px 0 4px;text-align:center}
.boxes div{background:var(--sea);border-radius:8px;padding:8px 2px}
.boxes span{display:block;font:700 22px "Barlow Condensed",sans-serif}
.boxes small{color:var(--muted);font-size:12.5px}
.card{border:1.5px solid var(--line);border-radius:12px;padding:16px;margin:12px 0;min-height:120px;background:var(--paper)}
.card hr{border:0;border-top:1px solid var(--line);margin:12px 0}
.a1in{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.a1in .search{margin:4px 0 10px;font-size:17px;color:var(--ink)}
.a1t div{display:grid;grid-template-columns:1fr;gap:1px;padding:9px 0;border-top:1px solid var(--line)}
.a1t div:first-child{border-top:0}
.a1t span{font-size:15px;color:var(--muted)}
.a1t small{color:var(--muted);font-size:13px}

/* ---------- Simulasi (Tahap 3) ---------- */
[hidden]{display:none !important}
:root{--rbg:#06171D;--rrim:#0E2730;--recho:#8CF5C0;--rline:#2A5452;--rtxt:#86BFAC;--rhl:#D2FAE8}
:root[data-mode="bridge"]{--rbg:#120202;--rrim:#1F0504;--recho:#FF6250;--rline:#4A120D;--rtxt:#B4473B;--rhl:#FF9A88}
.smstage{display:grid;gap:10px;margin:10px 0 4px}
@media (min-width:640px){.smstage.fog2{grid-template-columns:minmax(0,3fr) minmax(0,2fr);align-items:center}}
.smv{background:var(--sea);border-radius:10px;overflow:hidden;line-height:0}
.smv svg.smsvg{display:block;width:100%;height:auto;max-height:58vh}
.smr{line-height:1.3}
.ppi{display:block;width:100%;max-width:280px;height:auto;margin:0 auto}
.pp-cap{font-size:13px;color:var(--muted);text-align:center;margin:4px 0 0;line-height:1.3}
.pp-rim{fill:var(--rrim)}.pp-bg{fill:var(--rbg)}.pp-ring{fill:none;stroke:var(--rline);stroke-width:1}.pp-tick{stroke:var(--rtxt);stroke-width:1}
.pp-txt{fill:var(--rtxt);font:600 10px Barlow,sans-serif}.pp-hl{stroke:var(--rhl);stroke-width:1.2;opacity:.7}

ex:`Otoritas setempat (misalnya otoritas pelabuhan) boleh membuat aturan lokal, seperti batas kecepatan di alur pelabuhan. Aturan lokal itu didahulukan di wilayahnya, tetapi isinya harus semirip mungkin dengan COLREGs. Contoh yang terkenal adalah Inland Navigation Rules di perairan pedalaman Amerika Serikat.`,
pm:`Seperti aturan khusus di kompleks perumahan (misalnya batas kecepatan 20 km/jam) yang tetap tidak boleh bertentangan jauh dengan aturan lalu lintas nasional.`,
uj:`Jika aturan lokal dan COLREGs berbeda, di wilayah itu yang dipakai adalah aturan lokal. Selalu baca peraturan pelabuhan setempat sebelum masuk.`},
{k:'c',en:`Nothing in these Rules shall interfere with the operation of any special rules made by the Government of any State with respect to additional station or signal lights, shapes or whistle signals for ships of war and vessels proceeding under convoy, or with respect to additional station or signal lights or shapes for fishing vessels engaged in fishing as a fleet. These additional station or signal lights, shapes or whistle signals shall, so far as possible, be such that they cannot be mistaken for any light, shape or signal authorized elsewhere under these Rules.`,
id:`Tidak ada satu pun dalam aturan-aturan ini yang menghalangi berlakunya aturan khusus yang dibuat oleh Pemerintah suatu Negara mengenai lampu kedudukan atau lampu isyarat tambahan, sosok, atau isyarat suling bagi kapal perang dan kapal yang berlayar dalam konvoi, atau mengenai lampu kedudukan atau lampu isyarat tambahan maupun sosok bagi kapal-kapal ikan yang sedang menangkap ikan sebagai satu armada. Lampu, sosok, atau isyarat suling tambahan tersebut, sedapat mungkin, harus sedemikian rupa sehingga tidak dapat dikira sebagai lampu, sosok, atau isyarat lain yang diatur dalam aturan-aturan ini.`,
ex:`Negara boleh memberi lampu atau isyarat tambahan untuk kapal perang, kapal dalam konvoi, dan armada kapal ikan. Syaratnya: tidak boleh membingungkan, artinya tidak boleh mirip dengan lampu atau isyarat COLREGs lainnya.`,
eg:`Kapal perang yang berlayar dalam formasi di malam hari mungkin menyalakan lampu tambahan khusus. Jika Anda melihat susunan lampu yang tidak dikenal, jangan berasumsi, dan tetap jaga jarak aman.`,
uj:`Tiga kelompok yang disebut: kapal perang, kapal dalam konvoi, dan kapal ikan yang menangkap ikan sebagai armada. Untuk armada kapal ikan, yang boleh ditambah hanya lampu dan sosok, bukan isyarat suling.`},
{k:'d',en:`Traffic separation schemes may be adopted by the Organization for the purpose of these Rules.`,
id:`Bagan pemisah lalu lintas (TSS) dapat ditetapkan oleh Organisasi untuk keperluan aturan-aturan ini.`,
ex:`"Organisasi" yang dimaksud adalah IMO. IMO yang menetapkan TSS yang berlaku menurut COLREGs, sedangkan cara berlayar di dalam TSS diatur di Aturan 10. Contohnya TSS di Selat Malaka dan Selat Singapura, serta di Selat Sunda dan Selat Lombok.`,
uj:`"The Organization" dalam COLREGs selalu berarti IMO (dulu bernama IMCO). Aturan 10 hanya berlaku untuk TSS yang ditetapkan IMO.`},
{k:'e',en:`Whenever the Government concerned shall have determined that a vessel of special construction or purpose cannot comply fully with the provisions of any of these Rules with respect to the number, position, range or arc of visibility of lights or shapes, as well as to the disposition and characteristics of sound-signalling appliances, such vessel shall comply with such other provisions in regard to the number, position, range or arc of visibility of lights or shapes, as well as to the disposition and characteristics of sound-signalling appliances, as her Government shall have determined to be the closest possible compliance with these Rules in respect to that vessel.`,
id:`Apabila Pemerintah yang bersangkutan telah menetapkan bahwa suatu kapal dengan konstruksi atau tujuan khusus tidak dapat sepenuhnya memenuhi ketentuan aturan-aturan ini mengenai jumlah, posisi, jarak tampak, atau busur penyinaran lampu atau sosok, serta penempatan dan karakteristik alat isyarat suara, maka kapal tersebut harus memenuhi ketentuan lain mengenai hal-hal tersebut yang ditetapkan oleh Pemerintahnya sebagai pemenuhan yang sedekat mungkin dengan aturan-aturan ini bagi kapal itu.`,
ex:`Kapal berbentuk khusus (misalnya kapal perang tertentu, kapal cepat, atau kapal dengan bangunan atas yang unik) kadang tidak bisa memasang lampu persis sesuai aturan. Negara bendera boleh menetapkan susunan pengganti yang paling mendekati aturan. Dokumen sumber mencantumkan rujukan MSC/Circ.1144 pada bagian ini.`,
uj:`Yang boleh disesuaikan hanya hal teknis: lampu, sosok, dan alat isyarat suara. Aturan olah gerak di Bagian B tidak bisa dikecualikan dengan dasar ini.`}
],
q:[
[`COLREGs berlaku untuk…`,[`Semua kapal di laut lepas dan perairan terhubung yang dapat dilayari kapal laut`,`Hanya kapal dengan panjang lebih dari 12 m`,`Hanya di laut lepas di luar laut teritorial`,`Hanya kapal niaga`],`Aturan 1(a) berlaku untuk semua kapal, tanpa batas ukuran, di laut lepas dan semua perairan terhubung yang dapat dilayari kapal laut.`],
[`Di pelabuhan yang punya aturan lokal berbeda dengan COLREGs, yang berlaku adalah…`,[`Aturan lokal, yang harus semirip mungkin dengan COLREGs`,`Selalu COLREGs`,`Bebas memilih salah satu`,`Aturan negara bendera kapal`],`Aturan 1(b): aturan khusus otoritas setempat tetap berlaku di wilayahnya, tetapi harus sedekat mungkin dengan COLREGs.`],
[`Siapa yang menetapkan TSS menurut Aturan 1(d)?`,[`IMO`,`Otoritas pelabuhan`,`Negara bendera kapal`,`Perusahaan pelayaran`],`"The Organization" dalam COLREGs adalah IMO.`]
]});

rule({n:2,p:'A',t:`Tanggung jawab`,en:`Responsibility`,
sum:`Mematuhi aturan saja tidak cukup; Anda juga wajib bertindak sesuai praktik pelaut yang baik. Menyimpang dari aturan hanya dibenarkan bila memang perlu untuk menghindari bahaya yang mendesak.`,
mn:`"Patuhi aturan dan jadilah pelaut yang baik. Menyimpang hanya saat bahaya mendesak."`,
rel:[8,17],
subs:[
{k:'a',en:`Nothing in these Rules shall exonerate any vessel, or the owner, master or crew thereof, from the consequences of any neglect to comply with these Rules or of the neglect of any precaution which may be required by the ordinary practice of seamen, or by the special circumstances of the case.`,
id:`Tidak ada satu pun dalam aturan-aturan ini yang membebaskan kapal, pemilik, nakhoda, atau awak kapalnya dari akibat kelalaian dalam mematuhi aturan-aturan ini, atau kelalaian dalam melakukan tindakan berjaga-jaga yang diperlukan menurut kebiasaan pelaut yang baik atau menurut keadaan khusus dari kasus tersebut.`,
ex:`Mematuhi COLREGs saja tidak cukup. Anda juga wajib bertindak seperti pelaut yang baik (good seamanship). "Saya kan kapal stand-on" bukan alasan untuk diam saja jika Anda melihat tubrukan akan terjadi.`,
pm:`Seperti pengemudi yang lampunya hijau tetapi tetap menabrak pejalan kaki: punya hak jalan tidak membebaskan Anda dari tanggung jawab.`,
uj:`Dua jenis kelalaian: (1) lalai mematuhi aturan, dan (2) lalai melakukan tindakan berjaga-jaga menurut "ordinary practice of seamen" atau "special circumstances". Yang bertanggung jawab: kapal, pemilik, nakhoda, dan awak.`},
{k:'b',en:`In construing and complying with these Rules due regard shall be had to all dangers of navigation and collision and to any special circumstances, including the limitations of the vessels involved, which may make a departure from these Rules necessary to avoid immediate danger.`,
id:`Dalam menafsirkan dan mematuhi aturan-aturan ini, harus diperhatikan dengan saksama semua bahaya navigasi dan tubrukan serta setiap keadaan khusus, termasuk keterbatasan kapal-kapal yang bersangkutan, yang mungkin mengharuskan penyimpangan dari aturan-aturan ini untuk menghindari bahaya yang mendesak.`,
ex:`Ini sering disebut "klausul darurat". Anda boleh menyimpang dari aturan hanya jika memang diperlukan untuk menghindari bahaya langsung (immediate danger), bukan demi kenyamanan atau menghemat waktu.`,
eg:`Tiga kapal bertemu sekaligus. Aturan untuk kapal A dan B menyuruh berbelok ke kanan, tetapi di sisi kanan ada kapal C yang sangat dekat. Berbelok ke kanan justru berbahaya, sehingga penyimpangan bisa dibenarkan.`,
uj:`Syarat penyimpangan: ada bahaya yang mendesak dan penyimpangan itu memang perlu. Jika tidak ada bahaya mendesak, aturan wajib diikuti.`}
],
q:[
[`Kapal Anda stand-on, dan kapal give-way tidak bertindak sampai sangat dekat. Bolehkah Anda diam saja karena "punya hak jalan"?`,[`Tidak; Aturan 2 mewajibkan tindakan menurut praktik pelaut yang baik`,`Ya, kapal stand-on selalu bertahan apa pun yang terjadi`,`Ya, asalkan sudah membunyikan suling`,`Hanya boleh diam jika siang hari`],`Aturan 2(a) tidak membebaskan siapa pun dari akibat kelalaian, termasuk kelalaian bertindak saat bahaya terlihat.`],
[`Penyimpangan dari COLREGs dibenarkan Aturan 2(b) jika…`,[`Perlu untuk menghindari bahaya yang mendesak`,`Menghemat bahan bakar`,`Diperintahkan oleh pencharter`,`Kapal lain lebih kecil`],`Penyimpangan hanya untuk menghindari "immediate danger".`],
[`Siapa saja yang disebut tidak dibebaskan dari akibat kelalaian?`,[`Kapal, pemilik, nakhoda, dan awak`,`Hanya nakhoda`,`Hanya mualim jaga`,`Hanya pemilik kapal`],`Aturan 2(a) menyebut kapal, pemilik, nakhoda, dan awak kapal.`]
]});

rule({n:3,p:'A',t:`Definisi umum`,en:`General Definitions`,
lead:{en:`For the purpose of these Rules, except where the context otherwise requires:`,id:`Untuk keperluan aturan-aturan ini, kecuali jika konteksnya menentukan lain:`},
sum:`Aturan 3 adalah "kamus" COLREGs. Definisi yang paling sering diuji: kapal tenaga vs kapal layar, kapal yang sedang menangkap ikan, NUC, RAM, CBD, underway, saling melihat, dan tampak terbatas.`,
mn:`"NUC = rusak, RAM = sedang bekerja, CBD = terkendala sarat."`,
rel:[18,19,13],
subs:[
{k:'a',en:`The word "vessel" includes every description of water craft, including non-displacement craft, WIG craft and seaplanes, used or capable of being used as a means of transportation on water.`,
id:`Kata "kapal" mencakup setiap jenis wahana air, termasuk wahana tanpa benaman (non-displacement craft), wahana WIG, dan pesawat laut, yang digunakan atau dapat digunakan sebagai sarana transportasi di air.`,
ex:`Definisinya sangat luas: kapal tanker, perahu dayung, jet ski, hovercraft, sampai pesawat yang mendarat di air semuanya termasuk "vessel".`,
uj:`Non-displacement craft adalah wahana yang saat melaju tidak ditopang oleh daya apung lambungnya, misalnya hovercraft. WIG dan pesawat laut disebut secara tegas.`},
{k:'b',en:`The term "power-driven vessel" means any vessel propelled by machinery.`,
id:`Istilah "kapal tenaga" berarti setiap kapal yang digerakkan oleh mesin.`,
ex:`Asal digerakkan mesin, termasuk motor tempel kecil, kapal itu adalah kapal tenaga.`,
uj:`Kapal layar yang menyalakan mesinnya untuk bergerak dianggap kapal tenaga (lihat 3(c)).`},
{k:'c',en:`The term "sailing vessel" means any vessel under sail provided that propelling machinery, if fitted, is not being used.`,
id:`Istilah "kapal layar" berarti setiap kapal yang berlayar dengan layar, asalkan mesin penggeraknya, jika ada, tidak sedang digunakan.`,
ex:`Begitu mesin dipakai, walaupun layar tetap terkembang, statusnya berubah menjadi kapal tenaga dan ia kehilangan "hak" sebagai kapal layar. Siang hari ia memasang kerucut dengan puncak ke bawah (Aturan 25(e)).`,
pm:`Kapal layar hanya "kapal layar" selama ia murni ditiup angin.`,
uj:`Jebakan klasik di ujian: kapal layar dengan mesin menyala = kapal tenaga.`},
{k:'d',en:`The term "vessel engaged in fishing" means any vessel fishing with nets, lines, trawls or other fishing apparatus which restrict manoeuvrability, but does not include a vessel fishing with trolling lines or other fishing apparatus which do not restrict manoeuvrability.`,
id:`Istilah "kapal yang sedang menangkap ikan" berarti setiap kapal yang menangkap ikan dengan jaring, tali pancing, pukat, atau alat penangkap ikan lain yang membatasi kemampuan olah geraknya, tetapi tidak termasuk kapal yang menangkap ikan dengan pancing tonda atau alat penangkap ikan lain yang tidak membatasi kemampuan olah geraknya.`,
ex:`Yang menentukan bukan jenis kapalnya, melainkan apakah alat tangkapnya sedang membatasi olah gerak. Kapal ikan yang sedang menuju daerah penangkapan tanpa alat terpasang hanyalah kapal tenaga biasa.`,
eg:`Kapal pukat yang sedang menarik jaring termasuk "engaged in fishing". Perahu yang menarik pancing tonda di belakangnya tidak termasuk.`,
uj:`Pancing tonda (trolling lines) tidak termasuk. Kata kuncinya: "restrict manoeuvrability".`},
{k:'e',en:`The word "seaplane" includes any aircraft designed to manoeuvre on the water.`,
id:`Kata "pesawat laut" mencakup setiap pesawat udara yang dirancang untuk berolah gerak di atas air.`,
ex:`Saat berada di air, pesawat laut pada umumnya harus menjauhi semua kapal (Aturan 18(e)).`},
{k:'f',en:`The term "vessel not under command" means a vessel which through some exceptional circumstance is unable to manoeuvre as required by these Rules and is therefore unable to keep out of the way of another vessel.`,
id:`Istilah "kapal yang tidak dapat diolah gerak" (NUC) berarti kapal yang karena suatu keadaan luar biasa tidak mampu berolah gerak sebagaimana disyaratkan aturan-aturan ini, sehingga tidak dapat menyingkir dari kapal lain.`,
ex:`Penyebabnya keadaan luar biasa, misalnya mesin mati, kemudi rusak, atau baling-baling terlilit tali. NUC bukan kapal dalam bahaya; isyarat bahaya diatur terpisah di Annex IV.`,
pm:`NUC itu seperti mobil yang mogok di tengah jalan: ia tidak bisa minggir walaupun ingin.`,
eg:`Kapal kargo yang mesin induknya mati dan hanyut di jalur pelayaran menyalakan dua lampu merah keliling (malam) atau memasang dua bola (siang).`,
uj:`Dua unsur: (1) keadaan luar biasa (exceptional circumstance), (2) akibatnya tidak dapat menyingkir. Kapal yang berlabuh jangkar bukan NUC.`},
{k:'g',en:`The term "vessel restricted in her ability to manoeuvre" means a vessel which from the nature of her work is restricted in her ability to manoeuvre as required by these Rules and therefore is unable to keep out of the way of another vessel. The term "vessels restricted in their ability to manoeuvre" shall include but not be limited to:
(i) a vessel engaged in laying, servicing or picking up a navigation mark, submarine cable or pipeline;
(ii) a vessel engaged in dredging, surveying or underwater operations;
(iii) a vessel engaged in replenishment or transferring persons, provisions or cargo while underway;
(iv) a vessel engaged in the launching or recovery of aircraft;
(v) a vessel engaged in mineclearance operations;
(vi) a vessel engaged in a towing operation such as severely restricts the towing vessel and her tow in their ability to deviate from their course.`,
id:`Istilah "kapal yang terbatas kemampuan olah geraknya" (RAM) berarti kapal yang karena sifat pekerjaannya terbatas kemampuannya untuk berolah gerak sebagaimana disyaratkan aturan-aturan ini, sehingga tidak dapat menyingkir dari kapal lain. Istilah ini mencakup, tetapi tidak terbatas pada:
(i) kapal yang sedang memasang, merawat, atau mengangkat tanda navigasi, kabel bawah laut, atau pipa;
(ii) kapal yang sedang mengeruk, melakukan survei, atau pekerjaan bawah air;
(iii) kapal yang sedang mengisi perbekalan atau memindahkan orang, perbekalan, atau muatan sambil berlayar;
(iv) kapal yang sedang meluncurkan atau menerima kembali pesawat udara;
(v) kapal yang sedang melakukan pembersihan ranjau;
(vi) kapal yang sedang menunda sedemikian rupa sehingga kapal penunda dan tundaannya sangat terbatas kemampuannya untuk menyimpang dari haluan.`,
ex:`Bedanya dengan NUC: RAM terbatas karena pekerjaannya (disengaja), sedangkan NUC karena kerusakan atau keadaan luar biasa (tidak disengaja). Daftar (i) sampai (vi) hanyalah contoh; kata "include but not be limited to" berarti bisa ada jenis pekerjaan lain.`,
pm:`NUC itu mobil mogok. RAM itu truk derek yang sedang bekerja: mesinnya sehat, tetapi pekerjaannya membuat ia tidak bisa minggir.`,
uj:`Hafalkan enam contoh RAM. Kapal tunda biasa bukan RAM; hanya kegiatan menunda yang "severely restricts" kemampuan menyimpang dari haluan.`},
{k:'h',en:`The term "vessel constrained by her draught" means a power-driven vessel which because of her draught in relation to the available depth and width of navigable water, is severely restricted in her ability to deviate from the course she is following.`,
id:`Istilah "kapal yang terkendala oleh saratnya" (CBD) berarti kapal tenaga yang, karena saratnya dibandingkan dengan kedalaman dan lebar perairan yang dapat dilayari, sangat terbatas kemampuannya untuk menyimpang dari haluan yang sedang diikutinya.`,
ex:`Hanya kapal tenaga yang bisa berstatus CBD, biasanya kapal sangat besar (misalnya tanker raksasa) di perairan dangkal atau sempit. Yang dipertimbangkan adalah kedalaman DAN lebar perairan.`,
uj:`Kapal layar tidak bisa berstatus CBD. Kapal lain wajib "tidak menghalangi" CBD (Aturan 18(d)), bukan "menyingkir dari" CBD.`},
{k:'i',en:`The word "underway" means that a vessel is not at anchor, or made fast to the shore, or aground.`,
id:`Kata "sedang berlayar" (underway) berarti kapal tidak sedang berlabuh jangkar, tidak terikat ke darat, dan tidak kandas.`,
ex:`Kapal yang mesinnya mati dan hanyut tetap "underway". Underway berbeda dengan "making way" (bergerak di air karena tenaganya sendiri): kapal bisa underway tetapi tidak making way.`,
pm:`Underway artinya "tidak terikat apa pun ke dasar laut atau ke darat".`,
uj:`Soal favorit: kapal hanyut dengan mesin mati = underway, not making way.`},
{k:'j',en:`The words "length" and "breadth" of a vessel mean her length overall and greatest breadth.`,
id:`Kata "panjang" dan "lebar" kapal berarti panjang keseluruhan dan lebar terbesarnya.`,
ex:`Semua batas ukuran di COLREGs (7 m, 12 m, 20 m, 50 m, 100 m) memakai panjang keseluruhan (LOA), bukan panjang antara garis tegak.`},
{k:'k',en:`Vessels shall be deemed to be in sight of one another only when one can be observed visually from the other.`,
id:`Kapal-kapal dianggap saling melihat hanya jika kapal yang satu dapat diamati secara visual dari kapal lainnya.`,
ex:`Terdeteksi di radar atau AIS belum berarti "saling melihat". Definisi ini menentukan apakah berlaku Seksi II (kapal saling melihat) atau Aturan 19 (tidak saling melihat).`,
uj:`Kata kunci: "visually". Kontak radar tidak sama dengan "in sight".`},
{k:'l',en:`The term "restricted visibility" means any condition in which visibility is restricted by fog, mist, falling snow, heavy rainstorms, sandstorms or any other similar causes.`,
id:`Istilah "tampak terbatas" berarti setiap keadaan di mana jarak penglihatan terbatas karena kabut, halimun, hujan salju, hujan badai lebat, badai pasir, atau sebab-sebab lain yang serupa.`,
ex:`Di perairan Indonesia, yang paling sering adalah hujan badai lebat dan kabut asap. Kabut asap termasuk "sebab lain yang serupa".`},
{k:'m',en:`The term "Wing-In-Ground (WIG) craft" means a multimodal craft which, in its main operational mode, flies in close proximity to the surface by utilizing surface-effect action.`,
id:`Istilah "wahana Wing-In-Ground (WIG)" berarti wahana multimoda yang, dalam mode operasi utamanya, terbang sangat dekat dengan permukaan dengan memanfaatkan efek permukaan.`,
ex:`WIG terbang beberapa meter di atas air dengan memanfaatkan bantalan udara di bawah sayapnya. Saat lepas landas, mendarat, dan terbang dekat permukaan ia harus menjauhi semua kapal; saat berada di permukaan air ia diperlakukan sebagai kapal tenaga (Aturan 18(f)).`}
],
q:[
[`Kapal layar dengan layar terkembang dan mesin menyala termasuk…`,[`Kapal tenaga`,`Kapal layar`,`Kapal RAM`,`Kapal CBD`],`Aturan 3(c): kapal layar hanya jika mesin penggeraknya tidak digunakan.`],
[`Kapal dengan mesin mati yang hanyut, tidak berlabuh dan tidak kandas, statusnya…`,[`Underway (sedang berlayar)`,`Tidak underway`,`Dianggap berlabuh`,`Dianggap kandas`],`Aturan 3(i): underway berarti tidak berlabuh, tidak terikat ke darat, dan tidak kandas.`],
[`Manakah yang termasuk RAM?`,[`Kapal yang sedang mengeruk alur`,`Kapal yang mesinnya rusak`,`Kapal tanker besar di perairan dangkal`,`Kapal yang memancing dengan pancing tonda`],`Pengerukan ada di daftar 3(g)(ii). Mesin rusak = NUC; tanker di perairan dangkal = CBD.`]
]});

rule({n:4,p:'B1',t:`Penerapan`,en:`Application`,
sum:`Aturan 4 sampai 10 berlaku dalam setiap kondisi penglihatan: terang, malam, hujan, maupun kabut.`,
mn:`"Seksi I: selalu berlaku."`,
rel:[11,19],
subs:[
{k:'',en:`Rules in this Section apply in any condition of visibility.`,
id:`Aturan-aturan dalam Seksi ini berlaku dalam setiap kondisi penglihatan.`,
ex:`Pengamatan, kecepatan aman, risiko tubrukan, tindakan menghindar, alur sempit, dan TSS berlaku kapan saja, baik saat cerah maupun berkabut.`,
uj:`Bandingkan: Seksi II (Aturan 11–18) hanya berlaku bagi kapal yang saling melihat; Seksi III (Aturan 19) hanya bagi kapal yang tidak saling melihat di dalam atau dekat area tampak terbatas.`}
],
q:[
[`Aturan 4–10 berlaku…`,[`Dalam setiap kondisi penglihatan`,`Hanya saat cuaca terang`,`Hanya saat kabut`,`Hanya pada malam hari`],`Aturan 4: "in any condition of visibility".`],
[`Aturan manakah yang hanya berlaku bagi kapal yang saling melihat?`,[`Aturan 11–18`,`Aturan 4–10`,`Aturan 19`,`Aturan 1–3`],`Seksi II (Aturan 11–18) berlaku bagi kapal yang saling melihat.`],
[`Aturan 19 berlaku untuk…`,[`Kapal yang tidak saling melihat di dalam atau dekat area tampak terbatas`,`Semua kapal setiap saat`,`Kapal yang saling melihat di dalam kabut`,`Hanya kapal yang memiliki radar`],`Aturan 19(a).`]
]});

rule({n:5,p:'B1',t:`Pengamatan`,en:`Look-out`,
sum:`Setiap kapal wajib selalu menjaga pengamatan yang layak dengan mata, telinga, dan semua sarana yang tersedia, agar dapat menilai situasi dan risiko tubrukan secara penuh.`,
mn:`"Mata, telinga, dan semua alat. Setiap saat."`,
rel:[6,7,19],
subs:[
{k:'',en:`Every vessel shall at all times maintain a proper look-out by sight and hearing as well as by all available means appropriate in the prevailing circumstances and conditions so as to make a full appraisal of the situation and of the risk of collision.`,
id:`Setiap kapal harus selalu menjaga pengamatan yang layak dengan penglihatan dan pendengaran, serta dengan semua sarana yang tersedia yang sesuai dengan keadaan dan kondisi yang ada, sehingga dapat membuat penilaian penuh terhadap situasi dan risiko tubrukan.`,
ex:`Alat utamanya mata dan telinga, ditambah semua sarana lain yang sesuai (radar, ARPA, AIS, VHF). "At all times" berarti termasuk saat berlabuh dan saat siang cerah. Tujuannya menilai situasi dan risiko tubrukan secara penuh, bukan sekadar "melihat ada kapal".`,
pm:`Mengemudi sambil bermain HP itu berbahaya. Di anjungan, mualim jaga yang sibuk dengan dokumen atau hanya menatap layar radar juga tidak sedang menjaga pengamatan yang layak.`,
eg:`Rekomendasi IMO tentang Tugas Jaga Navigasi (ada di dokumen sumber) menegaskan bahwa pengamat harus bisa memberi perhatian penuh, dan juru mudi yang sedang mengemudi tidak dianggap sebagai pengamat, kecuali di kapal kecil yang pandangannya bebas ke segala arah dari posisi kemudi.`,
uj:`Banyak putusan kecelakaan tubrukan menyebut pelanggaran Aturan 5. Kata kunci: "at all times", "sight and hearing", "all available means", "full appraisal".`}
],
q:[
[`Pengamatan menurut Aturan 5 dilakukan dengan…`,[`Penglihatan, pendengaran, dan semua sarana yang tersedia`,`Radar saja`,`AIS saja`,`Penglihatan saja`],`Aturan 5: "by sight and hearing as well as by all available means".`],
[`Kapan pengamatan wajib dijaga?`,[`Setiap saat`,`Hanya malam hari`,`Hanya saat kabut`,`Hanya di dalam TSS`],`"At all times".`],
[`Menurut Rekomendasi Tugas Jaga IMO, juru mudi yang sedang mengemudi…`,[`Umumnya tidak dianggap sebagai pengamat`,`Selalu dianggap sebagai pengamat`,`Boleh menggantikan mualim jaga`,`Boleh merangkap pengamat di kapal besar`],`Tugas pengamat dan juru mudi terpisah, kecuali di kapal kecil dengan pandangan bebas ke segala arah.`]
]});

rule({n:6,p:'B1',t:`Kecepatan aman`,en:`Safe Speed`,
sum:`Kecepatan aman adalah kecepatan yang membuat Anda sempat bertindak efektif dan bisa berhenti dalam jarak yang sesuai. Faktornya dibagi dua: untuk semua kapal (a) dan tambahan untuk kapal ber-radar (b).`,
mn:`Faktor (a) disingkat "VeLOCAS", mirip kata velocity: Visibilitas, Lalu lintas, Olah gerak, Cahaya latar, Angin/arus/bahaya, Sarat.`,
rel:[5,7,19],
subs:[
{k:'',en:`Every vessel shall at all times proceed at a safe speed so that she can take proper and effective action to avoid collision and be stopped within a distance appropriate to the prevailing circumstances and conditions. In determining a safe speed the following factors shall be among those taken into account:`,
id:`Setiap kapal harus selalu bergerak dengan kecepatan aman sehingga dapat mengambil tindakan yang tepat dan efektif untuk menghindari tubrukan, dan dapat dihentikan dalam jarak yang sesuai dengan keadaan dan kondisi yang ada. Dalam menentukan kecepatan aman, faktor-faktor berikut harus termasuk yang dipertimbangkan:`,
ex:`Tidak ada angka "kecepatan aman" yang pasti. Kecepatan aman adalah kecepatan yang membuat Anda (1) sempat bertindak efektif dan (2) bisa berhenti dalam jarak yang sesuai dengan keadaan.`,
pm:`Seperti mengemudi saat hujan deras di jalan ramai: tidak ada rambu angka, tetapi Anda tahu harus pelan agar bisa mengerem tepat waktu.`,
uj:`Kecepatan aman berlaku setiap saat, bukan hanya saat kabut. Frasa "among those" berarti daftar faktornya tidak tertutup; faktor lain boleh dipertimbangkan.`},
{k:'a',en:`By all vessels:
(i) the state of visibility;
(ii) the traffic density including concentrations of fishing vessels or any other vessels;
(iii) the manoeuvrability of the vessel with special reference to stopping distance and turning ability in the prevailing conditions;
(iv) at night the presence of background light such as from shore lights or from back scatter of her own lights;
(v) the state of wind, sea and current, and the proximity of navigational hazards;
(vi) the draught in relation to the available depth of water.`,
id:`Oleh semua kapal:
(i) keadaan jarak penglihatan;
(ii) kepadatan lalu lintas, termasuk konsentrasi kapal ikan atau kapal lain;
(iii) kemampuan olah gerak kapal, terutama jarak henti dan kemampuan berputar dalam kondisi yang ada;
(iv) pada malam hari, adanya cahaya latar seperti dari lampu di darat atau pantulan balik cahaya lampu kapal sendiri;
(v) keadaan angin, laut, dan arus, serta dekatnya bahaya navigasi;
(vi) sarat kapal dibandingkan kedalaman air yang tersedia.`,
ex:`Enam faktor untuk semua kapal. Faktor (iv) sering terlupa: lampu kota di darat atau pantulan lampu geladak sendiri bisa "menyembunyikan" lampu kapal lain.`,
eg:`Mendekati pelabuhan besar di malam hari, lampu kota di belakang membuat lampu lambung perahu kecil sulit terlihat. Kurangi kecepatan.`,
uj:`Hafalkan enam faktor (a). Faktor (iii) menekankan jarak henti dan kemampuan berputar "in the prevailing conditions", misalnya saat kapal dalam keadaan muatan penuh.`},
{k:'b',en:`Additionally, by vessels with operational radar:
(i) the characteristics, efficiency and limitations of the radar equipment;
(ii) any constraints imposed by the radar range scale in use;
(iii) the effect on radar detection of the sea state, weather and other sources of interference;
(iv) the possibility that small vessels, ice and other floating objects may not be detected by radar at an adequate range;
(v) the number, location and movement of vessels detected by radar;
(vi) the more exact assessment of the visibility that may be possible when radar is used to determine the range of vessels or other objects in the vicinity.`,
id:`Sebagai tambahan, oleh kapal dengan radar yang berfungsi:
(i) karakteristik, efisiensi, dan keterbatasan peralatan radar;
(ii) batasan yang timbul dari skala jarak radar yang sedang digunakan;
(iii) pengaruh keadaan laut, cuaca, dan sumber gangguan lain terhadap deteksi radar;
(iv) kemungkinan kapal kecil, es, dan benda terapung lain tidak terdeteksi radar pada jarak yang memadai;
(v) jumlah, lokasi, dan pergerakan kapal yang terdeteksi radar;
(vi) penilaian jarak penglihatan yang lebih tepat yang mungkin dilakukan saat radar dipakai untuk menentukan jarak kapal atau benda lain di sekitarnya.`,
ex:`Radar membantu, tetapi punya keterbatasan. Perahu kayu atau fiber kecil sering tidak tampak di radar saat ombak tinggi atau hujan lebat (sea clutter dan rain clutter). Jangan merasa aman melaju cepat hanya karena layar radar tampak "kosong".`,
eg:`Perahu nelayan kayu tanpa reflektor radar di tengah hujan lebat mungkin baru terlihat, baik di radar maupun dengan mata, saat jaraknya kurang dari setengah mil.`,
uj:`Faktor (b)(vi) satu-satunya yang "membantu": radar memungkinkan penilaian jarak tampak lebih tepat. Misalnya kapal terlihat di radar pada 2 mil tetapi belum tampak oleh mata, berarti jarak tampak kurang dari 2 mil.`}
],
q:[
[`Manakah yang termasuk faktor kecepatan aman untuk semua kapal?`,[`Cahaya latar pada malam hari`,`Jadwal tiba di pelabuhan`,`Biaya bahan bakar`,`Jumlah awak kapal`],`Aturan 6(a)(iv).`],
[`Kecepatan aman wajib dijaga…`,[`Setiap saat`,`Hanya saat kabut`,`Hanya di alur sempit`,`Hanya pada malam hari`],`"At all times proceed at a safe speed".`],
[`Mengapa layar radar yang "kosong" tidak boleh membuat Anda melaju cepat?`,[`Kapal kecil dan benda terapung bisa tidak terdeteksi pada jarak memadai`,`Radar selalu memberi informasi salah`,`Radar hanya berfungsi siang hari`,`Radar dilarang dipakai di TSS`],`Aturan 6(b)(iv).`]
]});

rule({n:7,p:'B1',t:`Risiko tubrukan`,en:`Risk of Collision`,
sum:`Gunakan semua sarana untuk menilai risiko tubrukan. Jika ragu, anggap risiko ada. Radar harus dipakai dengan benar, jangan menyimpulkan dari informasi minim, dan baringan kompas yang tidak berubah berarti risiko tubrukan.`,
mn:`"Baringan tetap, jarak mendekat: bahaya."`,
rel:[5,8,19],
subs:[
{k:'a',en:`Every vessel shall use all available means appropriate to the prevailing circumstances and conditions to determine if risk of collision exists. If there is any doubt such risk shall be deemed to exist.`,
id:`Setiap kapal harus menggunakan semua sarana yang tersedia yang sesuai dengan keadaan dan kondisi yang ada untuk menentukan apakah ada risiko tubrukan. Jika ada keraguan, risiko tersebut harus dianggap ada.`,
ex:`Prinsipnya: jika ragu, anggap berbahaya. Lebih baik bertindak untuk risiko yang ternyata tidak ada, daripada diam untuk risiko yang ternyata nyata.`,
uj:`Kalimat penting: "If there is any doubt such risk shall be deemed to exist."`},
{k:'b',en:`Proper use shall be made of radar equipment if fitted and operational, including long-range scanning to obtain early warning of risk of collision and radar plotting or equivalent systematic observation of detected objects.`,
id:`Peralatan radar, jika terpasang dan berfungsi, harus digunakan dengan semestinya, termasuk pemindaian jarak jauh untuk mendapat peringatan dini risiko tubrukan, serta plotting radar atau pengamatan sistematis yang setara terhadap objek yang terdeteksi.`,
ex:`Radar tidak cukup hanya dinyalakan. Sesekali gunakan skala jarak jauh agar kapal terdeteksi sejak dini, lalu lakukan plotting (manual atau dengan ARPA) untuk mengetahui CPA dan TCPA.`,
pm:`CPA (Closest Point of Approach) adalah jarak terdekat yang akan terjadi jika kedua kapal tidak mengubah apa pun. TCPA adalah berapa menit lagi jarak terdekat itu tercapai.`,
uj:`Kata kunci: "long-range scanning" dan "radar plotting or equivalent systematic observation".`},
{k:'c',en:`Assumptions shall not be made on the basis of scanty information, especially scanty radar information.`,
id:`Asumsi tidak boleh dibuat berdasarkan informasi yang minim, terutama informasi radar yang minim.`,
ex:`Satu kali melihat posisi target di radar tidak cukup untuk menyimpulkan arah dan kecepatannya. Perlu beberapa pengamatan dalam selang waktu tertentu.`,
eg:`Target muncul di radar pada baringan 045°, jarak 6 mil. Tanpa plotting, Anda belum tahu apakah ia menjauh, bersilangan, atau menuju Anda.`},
{k:'d',en:`In determining if risk of collision exists the following considerations shall be among those taken into account:
(i) such risk shall be deemed to exist if the compass bearing of an approaching vessel does not appreciably change;
(ii) such risk may sometimes exist even when an appreciable bearing change is evident, particularly when approaching a very large vessel or a tow or when approaching a vessel at close range.`,
id:`Dalam menentukan ada tidaknya risiko tubrukan, pertimbangan berikut harus termasuk di antaranya:
(i) risiko tersebut harus dianggap ada jika baringan kompas kapal yang mendekat tidak berubah secara berarti;
(ii) risiko tersebut kadang-kadang dapat ada walaupun perubahan baringan terlihat jelas, terutama saat mendekati kapal yang sangat besar, kapal yang menunda, atau saat mendekati kapal pada jarak dekat.`,
ex:`Cara paling klasik: ambil baringan kompas kapal lain beberapa kali. Jika baringannya tetap sementara jaraknya makin dekat, kedua kapal akan bertubrukan. Namun untuk kapal sangat panjang atau tundaan, baringan ke haluannya bisa berubah sementara bagian tengah atau buritannya tetap berada di jalur tubrukan.`,
pm:`Saat menyeberang jalan, jika sebuah mobil terlihat "diam di posisi yang sama" di sudut mata Anda tetapi tampak makin besar, mobil itu sedang menuju Anda.`,
eg:`Kapal tunda dengan tongkang 400 m di belakangnya: baringan ke kapal tunda berubah, tetapi tongkangnya tetap berada di jalur tubrukan dengan Anda.`,
uj:`"Does not appreciably change" berarti risiko pasti dianggap ada. Sebaliknya, perubahan baringan belum tentu berarti aman.`}
],
q:[
[`Baringan kompas kapal yang mendekat tidak berubah secara berarti. Artinya…`,[`Risiko tubrukan dianggap ada`,`Kapal itu sedang menjauh`,`Aman, tidak perlu tindakan`,`Kapal itu sedang berlabuh`],`Aturan 7(d)(i).`],
[`Jika ragu apakah ada risiko tubrukan…`,[`Anggap risiko itu ada`,`Anggap risiko tidak ada`,`Tunggu sampai lebih dekat`,`Tunggu kapal lain bertindak`],`Aturan 7(a).`],
[`Saat mendekati kapal yang sedang menunda, perubahan baringan yang jelas…`,[`Belum tentu berarti aman`,`Selalu berarti aman`,`Berarti kapal itu NUC`,`Tidak perlu diperhatikan`],`Aturan 7(d)(ii).`]
]});

rule({n:8,p:'B1',t:`Tindakan untuk menghindari tubrukan`,en:`Action to avoid Collision`,
sum:`Tindakan menghindar harus tegas, sedini mungkin, cukup besar agar terlihat, menghasilkan jarak lewat yang aman, dan terus diperiksa. Mengurangi kecepatan atau berhenti juga tindakan yang sah. Kewajiban "tidak menghalangi" berlaku sejak awal.`,
mn:`"Dini, besar, jelas, periksa."`,
rel:[16,17,9,10,18],
subs:[
{k:'a',en:`Any action to avoid collision shall be taken in accordance with the Rules of this Part and shall, if the circumstances of the case admit, be positive, made in ample time and with due regard to the observance of good seamanship.`,
id:`Setiap tindakan untuk menghindari tubrukan harus diambil sesuai aturan-aturan dalam Bagian ini dan, jika keadaan memungkinkan, harus tegas, dilakukan dalam waktu yang cukup lapang, dan dengan memperhatikan kebiasaan pelaut yang baik.`,
ex:`Tiga syarat tindakan yang baik: tegas (positive), sedini mungkin (ample time), dan sesuai praktik pelaut yang baik (good seamanship). Sejak amandemen 2003 ditegaskan pula bahwa tindakan harus sesuai aturan Bagian B.`,
uj:`Kata kunci: "positive", "ample time", "good seamanship".`},
{k:'b',en:`Any alteration of course and/or speed to avoid collision shall, if the circumstances of the case admit, be large enough to be readily apparent to another vessel observing visually or by radar; a succession of small alterations of course and/or speed should be avoided.`,
id:`Setiap perubahan haluan dan/atau kecepatan untuk menghindari tubrukan, jika keadaan memungkinkan, harus cukup besar sehingga mudah terlihat oleh kapal lain yang mengamati secara visual atau dengan radar; serangkaian perubahan kecil haluan dan/atau kecepatan harus dihindari.`,
ex:`Perubahan 5° hampir tidak terlihat oleh kapal lain, apalagi di radar. Dalam praktik, perubahan haluan yang besar (sering disebut sekitar 30° atau lebih) jauh lebih mudah dikenali.`,
pm:`Seperti berpindah lajur di jalan: bergeser sedikit-sedikit membingungkan pengemudi lain, sedangkan pindah lajur dengan jelas membuat semua orang paham maksud Anda.`,
uj:`Yang dihindari: "a succession of small alterations".`},
{k:'c',en:`If there is sufficient sea room, alteration of course alone may be the most effective action to avoid a close-quarters situation provided that it is made in good time, is substantial and does not result in another close-quarters situation.`,
id:`Jika ruang laut cukup, perubahan haluan saja dapat menjadi tindakan paling efektif untuk menghindari situasi berdekatan, asalkan dilakukan tepat waktu, cukup besar, dan tidak menimbulkan situasi berdekatan yang lain.`,
ex:`Di laut terbuka, berbelok biasanya lebih cepat terlihat dan lebih efektif daripada mengurangi kecepatan. Tetapi pastikan belokan Anda tidak membawa Anda ke situasi berbahaya dengan kapal lain.`,
uj:`Tiga syarat: "in good time", "substantial", dan tidak menimbulkan "another close-quarters situation".`},
{k:'d',en:`Action taken to avoid collision with another vessel shall be such as to result in passing at a safe distance. The effectiveness of the action shall be carefully checked until the other vessel is finally past and clear.`,
id:`Tindakan yang diambil untuk menghindari tubrukan dengan kapal lain harus menghasilkan pelewatan pada jarak yang aman. Efektivitas tindakan itu harus diperiksa dengan cermat sampai kapal lain akhirnya lewat dan bebas.`,
ex:`Setelah bertindak, jangan langsung lega. Terus pantau baringan dan CPA sampai kapal lain benar-benar lewat dan menjauh.`,
uj:`Kata kunci: "safe distance" dan "until the other vessel is finally past and clear".`},
{k:'e',en:`If necessary to avoid collision or allow more time to assess the situation, a vessel shall slacken her speed or take all way off by stopping or reversing her means of propulsion.`,
id:`Jika perlu untuk menghindari tubrukan atau untuk memberi lebih banyak waktu dalam menilai situasi, kapal harus mengurangi kecepatannya atau menghentikan seluruh lajunya dengan menghentikan atau memundurkan mesin penggeraknya.`,
ex:`Mengurangi kecepatan berarti "membeli waktu" untuk berpikir. Ini juga tindakan yang sah, terutama di perairan sempit ketika berbelok tidak memungkinkan.`,
uj:`Dokumen sumber tertulis "allow more to assess"; teks resmi berbunyi "allow more time to assess".`},
{k:'f',en:`(i) A vessel which, by any of these Rules, is required not to impede the passage or safe passage of another vessel shall, when required by the circumstances of the case, take early action to allow sufficient sea room for the safe passage of the other vessel.
(ii) A vessel required not to impede the passage or safe passage of another vessel is not relieved of this obligation if approaching the other vessel so as to involve risk of collision and shall, when taking action, have full regard to the action which may be required by the Rules of this Part.
(iii) A vessel the passage of which is not to be impeded remains fully obliged to comply with the Rules of this Part when the two vessels are approaching one another so as to involve risk of collision.`,
id:`(i) Kapal yang menurut aturan diharuskan tidak menghalangi lintasan atau lintasan aman kapal lain, jika keadaan mengharuskan, harus bertindak sedini mungkin untuk memberi ruang laut yang cukup bagi lintasan aman kapal lain itu.
(ii) Kapal yang diharuskan tidak menghalangi lintasan kapal lain tidak dibebaskan dari kewajiban ini jika ia mendekati kapal lain sehingga menimbulkan risiko tubrukan, dan saat bertindak harus memperhatikan sepenuhnya tindakan yang mungkin disyaratkan oleh aturan-aturan dalam Bagian ini.
(iii) Kapal yang lintasannya tidak boleh dihalangi tetap wajib sepenuhnya mematuhi aturan-aturan dalam Bagian ini jika kedua kapal saling mendekat sehingga menimbulkan risiko tubrukan.`,
ex:`"Tidak menghalangi" (not impede) berbeda dengan "menyingkir" (keep out of the way). Kewajiban tidak menghalangi berlaku sejak awal, bahkan sebelum ada risiko tubrukan. Jika risiko tubrukan sudah terjadi, kedua kapal harus mengikuti aturan olah gerak biasa juga.`,
pm:`Seperti sepeda motor di jalan sempit yang sejak jauh sudah minggir agar truk besar bisa lewat, bukan baru minggir ketika truk sudah tepat di depannya.`,
uj:`Kewajiban "not impede" muncul di Aturan 9(b), 9(c), 9(d), 10(i), 10(j), dan 18(d). Kapal yang "dilindungi" (misalnya kapal besar di alur) tidak otomatis menjadi stand-on; ia tetap wajib mematuhi aturan jika ada risiko tubrukan.`}
],
q:[
[`Perubahan haluan untuk menghindari tubrukan sebaiknya…`,[`Cukup besar agar mudah terlihat kapal lain`,`Berupa serangkaian perubahan kecil`,`Dilakukan saat sudah sangat dekat`,`Selalu disertai menambah kecepatan`],`Aturan 8(b).`],
[`Setelah mengambil tindakan menghindar, Anda harus…`,[`Terus memeriksa efektivitasnya sampai kapal lain lewat dan bebas`,`Segera kembali ke haluan semula`,`Mematikan radar`,`Menunggu kapal lain membunyikan suling`],`Aturan 8(d).`],
[`Kapan kewajiban "tidak menghalangi" mulai berlaku?`,[`Sejak awal, sebelum ada risiko tubrukan`,`Hanya setelah ada risiko tubrukan`,`Hanya pada malam hari`,`Hanya di dalam TSS`],`Aturan 8(f)(i): "take early action".`]
]});

rule({n:9,p:'B1',t:`Alur pelayaran sempit`,en:`Narrow Channels`,
sum:`Di alur sempit: jaga sisi kanan, kapal kecil, kapal layar, dan kapal ikan tidak boleh menghalangi kapal besar, jangan memotong bila menghalangi, gunakan isyarat untuk menyusul dan di tikungan, serta hindari berlabuh di alur.`,
mn:`"Jaga kanan, jangan menghalangi, minta izin saat menyusul, bunyikan suling di tikungan."`,
rel:[8,13,34],
subs:[
{k:'a',en:`A vessel proceeding along the course of a narrow channel or fairway shall keep as near to the outer limit of the channel or fairway which lies on her starboard side as is safe and practicable.`,
id:`Kapal yang berlayar menyusuri alur pelayaran sempit atau alur masuk harus berlayar sedekat mungkin dengan batas luar alur yang berada di sisi kanannya, sejauh hal itu aman dan dapat dilaksanakan.`,
ex:`"Jaga kanan." Kapal yang berlawanan arah akan berpapasan sisi kiri dengan sisi kiri.`,
pm:`Di Indonesia kita berkendara di sisi kiri jalan, tetapi di laut semua kapal "berkendara di kanan". Jangan terbawa kebiasaan di darat!`,
uj:`"As near ... as is safe and practicable": kapal besar yang terlalu dekat ke tepi bisa kandas, jadi keselamatan tetap dipertimbangkan.`},
{k:'b',en:`A vessel of less than 20 metres in length or a sailing vessel shall not impede the passage of a vessel which can safely navigate only within a narrow channel or fairway.`,
id:`Kapal dengan panjang kurang dari 20 meter atau kapal layar tidak boleh menghalangi lintasan kapal yang hanya dapat berlayar dengan aman di dalam alur pelayaran sempit atau alur masuk.`,
ex:`Kapal kecil dan kapal layar biasanya bisa berlayar di luar alur yang dalam, jadi merekalah yang memberi jalan kepada kapal besar yang "terkurung" di alur.`},
{k:'c',en:`A vessel engaged in fishing shall not impede the passage of any other vessel navigating within a narrow channel or fairway.`,
id:`Kapal yang sedang menangkap ikan tidak boleh menghalangi lintasan kapal lain mana pun yang berlayar di dalam alur pelayaran sempit atau alur masuk.`,
ex:`Untuk kapal ikan, yang tidak boleh dihalangi adalah kapal apa pun di dalam alur, lebih luas daripada 9(b).`,
uj:`Bandingkan: 9(b) melindungi kapal yang hanya bisa aman di dalam alur; 9(c) melindungi kapal apa pun di dalam alur.`},
{k:'d',en:`A vessel shall not cross a narrow channel or fairway if such crossing impedes the passage of a vessel which can safely navigate only within such channel or fairway. The latter vessel may use the sound signal prescribed in Rule 34(d) if in doubt as to the intention of the crossing vessel.`,
id:`Kapal tidak boleh memotong alur pelayaran sempit atau alur masuk jika pemotongan itu menghalangi lintasan kapal yang hanya dapat berlayar dengan aman di dalam alur tersebut. Kapal yang disebut terakhir boleh menggunakan isyarat suara dalam Aturan 34(d) jika ragu terhadap maksud kapal yang memotong.`,
ex:`Memotong alur boleh, asalkan tidak menghalangi kapal besar di alur. Kapal besar yang ragu dapat membunyikan sedikitnya lima tiupan pendek dan cepat.`},
{k:'e',en:`(i) In a narrow channel or fairway when overtaking can take place only if the vessel to be overtaken has to take action to permit safe passing, the vessel intending to overtake shall indicate her intention by sounding the appropriate signal prescribed in Rule 34(c)(i). The vessel to be overtaken shall, if in agreement, sound the appropriate signal prescribed in Rule 34(c)(ii) and take steps to permit safe passing. If in doubt she may sound the signals prescribed in Rule 34(d).
(ii) This Rule does not relieve the overtaking vessel of her obligation under Rule 13.`,
id:`(i) Di alur pelayaran sempit atau alur masuk, jika penyusulan hanya dapat dilakukan apabila kapal yang disusul harus bertindak untuk memungkinkan pelewatan yang aman, kapal yang bermaksud menyusul harus menyatakan maksudnya dengan membunyikan isyarat yang sesuai dalam Aturan 34(c)(i). Kapal yang akan disusul, jika setuju, harus membunyikan isyarat yang sesuai dalam Aturan 34(c)(ii) dan mengambil langkah untuk memungkinkan pelewatan yang aman. Jika ragu, ia boleh membunyikan isyarat dalam Aturan 34(d).
(ii) Aturan ini tidak membebaskan kapal yang menyusul dari kewajibannya menurut Aturan 13.`,
ex:`Di alur sempit, menyusul butuh "izin". Penyusul membunyikan 2 panjang + 1 pendek (akan menyusul di sisi kanan Anda) atau 2 panjang + 2 pendek (di sisi kiri Anda). Yang disusul menjawab panjang-pendek-panjang-pendek jika setuju, atau minimal 5 pendek jika ragu. Walaupun sudah disetujui, penyusul tetap wajib menyingkir (Aturan 13).`,
uj:`Isyarat ini hanya dipakai jika kapal yang disusul perlu bertindak agar penyusulan aman. Kapal yang disusul tidak wajib setuju.`},
{k:'f',en:`A vessel nearing a bend or an area of a narrow channel or fairway where other vessels may be obscured by an intervening obstruction shall navigate with particular alertness and caution and shall sound the appropriate signal prescribed in Rule 34(e).`,
id:`Kapal yang mendekati tikungan atau bagian alur pelayaran sempit atau alur masuk di mana kapal lain mungkin tidak terlihat karena terhalang rintangan di antaranya, harus berlayar dengan kewaspadaan dan kehati-hatian khusus dan harus membunyikan isyarat yang sesuai dalam Aturan 34(e).`,
ex:`Di tikungan "buta", bunyikan satu tiupan panjang. Kapal di balik tikungan yang mendengarnya menjawab dengan satu tiupan panjang.`},
{k:'g',en:`Any vessel shall, if the circumstances of the case admit, avoid anchoring in a narrow channel.`,
id:`Setiap kapal, jika keadaan memungkinkan, harus menghindari berlabuh jangkar di alur pelayaran sempit.`,
ex:`Kapal yang berlabuh di alur sempit menjadi rintangan bagi semua kapal lain. Berlabuh di alur hanya jika terpaksa, misalnya mesin mati dan harus mencegah kandas.`}
],
q:[
[`Di alur sempit, kapal harus berlayar sedekat mungkin dengan batas alur di sisi…`,[`Kanan (starboard)`,`Kiri (port)`,`Tengah alur`,`Mana saja yang lebih dalam`],`Aturan 9(a).`],
[`Kapal 15 m di alur sempit bertemu tanker yang hanya bisa berlayar aman di dalam alur. Kewajiban kapal 15 m?`,[`Tidak menghalangi lintasan tanker`,`Menunggu tanker menyingkir`,`Berbelok ke kiri bersama tanker`,`Bertahan sebagai kapal stand-on`],`Aturan 9(b).`],
[`Setelah kapal yang disusul menyatakan setuju lewat isyarat, kapal yang menyusul…`,[`Tetap wajib menyingkir menurut Aturan 13`,`Menjadi kapal stand-on`,`Bebas dari semua kewajiban`,`Harus berhenti dahulu`],`Aturan 9(e)(ii).`]
]});

rule({n:10,p:'B1',t:`Bagan pemisah lalu lintas`,en:`Traffic Separation Schemes`,
sum:`Di TSS: ikuti arah jalur, jauhi garis dan zona pemisah, masuk dan keluar dengan sudut kecil, seberangi tegak lurus, hormati zona lalu lintas pedalaman, dan jangan berlabuh di dalamnya. Aturan lain tetap berlaku penuh.`,
mn:`"Ikuti arah, jauhi garis, masuk landai, seberang tegak lurus."`,
rel:[1,8,18],
subs:[
{k:'a',en:`This Rule applies to traffic separation schemes adopted by the Organization and does not relieve any vessel of her obligation under any other rule.`,
id:`Aturan ini berlaku untuk bagan pemisah lalu lintas yang ditetapkan oleh Organisasi dan tidak membebaskan kapal mana pun dari kewajibannya menurut aturan lain.`,
ex:`Di dalam TSS, aturan lain (misalnya Aturan 13, 14, 15, dan 19) tetap berlaku penuh. Kapal yang mengikuti jalur TSS tidak otomatis punya hak jalan.`,
uj:`Jebakan: kapal tenaga di jalur TSS yang bersilangan dengan kapal tenaga yang menyeberang tetap memakai Aturan 15, kecuali ada kewajiban "tidak menghalangi" seperti 10(i) atau 10(j).`},
{k:'b',en:`A vessel using a traffic separation scheme shall:
(i) proceed in the appropriate traffic lane in the general direction of traffic flow for that lane;
(ii) so far as practicable keep clear of a traffic separation line or separation zone;
(iii) normally join or leave a traffic lane at the termination of the lane, but when joining or leaving from either side shall do so at as small an angle to the general direction of traffic flow as practicable.`,
id:`Kapal yang menggunakan bagan pemisah lalu lintas harus:
(i) berlayar di jalur lalu lintas yang sesuai menurut arah umum arus lalu lintas jalur itu;
(ii) sedapat mungkin menjauhi garis pemisah atau zona pemisah lalu lintas;
(iii) biasanya masuk atau keluar jalur di ujung jalur, tetapi jika masuk atau keluar dari samping, harus dilakukan dengan sudut sekecil mungkin terhadap arah umum arus lalu lintas.`,
ex:`Seperti jalan tol: ikuti arah lajur, jangan berjalan di atas garis atau median, dan masuk-keluar lewat ujung atau dengan sudut landai seperti di lajur percepatan.`},
{k:'c',en:`A vessel shall so far as practicable avoid crossing traffic lanes, but if obliged to do so shall cross on a heading as nearly as practicable at right angles to the general direction of traffic flow.`,
id:`Kapal sedapat mungkin harus menghindari memotong jalur lalu lintas, tetapi jika terpaksa, harus memotong dengan haluan yang sedapat mungkin tegak lurus terhadap arah umum arus lalu lintas.`,
ex:`Yang harus tegak lurus adalah haluan kapal (heading), bukan lintasan di atas dasar laut. Dengan haluan tegak lurus, waktu Anda di jalur paling singkat dan kapal lain langsung mengenali bahwa Anda sedang menyeberang.`,
uj:`Kata kunci: "heading", bukan "course over ground". Jika ada arus, lintasan sebenarnya akan miring; itu tidak masalah.`},
{k:'d',en:`(i) A vessel shall not use an inshore traffic zone when she can safely use the appropriate traffic lane within the adjacent traffic separation scheme. However, vessels of less than 20 metres in length, sailing vessels and vessels engaged in fishing may use the inshore traffic zone.
(ii) Notwithstanding subparagraph (d)(i), a vessel may use an inshore traffic zone when en route to or from a port, offshore installation or structure, pilot station or any other place situated within the inshore traffic zone, or to avoid immediate danger.`,
id:`(i) Kapal tidak boleh menggunakan zona lalu lintas pedalaman jika ia dapat menggunakan dengan aman jalur lalu lintas yang sesuai di dalam bagan pemisah lalu lintas yang berdekatan. Namun, kapal dengan panjang kurang dari 20 meter, kapal layar, dan kapal yang sedang menangkap ikan boleh menggunakan zona lalu lintas pedalaman.
(ii) Walaupun ada ketentuan (d)(i), kapal boleh menggunakan zona lalu lintas pedalaman jika sedang menuju atau dari pelabuhan, instalasi atau bangunan lepas pantai, stasiun pandu, atau tempat lain di dalam zona tersebut, atau untuk menghindari bahaya yang mendesak.`,
ex:`Zona lalu lintas pedalaman (antara TSS dan pantai) disediakan untuk lalu lintas lokal dan kapal kecil. Kapal besar yang hanya melintas harus memakai jalur TSS.`},
{k:'e',en:`A vessel, other than a crossing vessel, or a vessel joining or leaving a lane shall not normally enter a separation zone or cross a separation line except:
(i) in cases of emergency to avoid immediate danger;
(ii) to engage in fishing within a separation zone.`,
id:`Kapal, selain kapal yang sedang memotong atau kapal yang sedang masuk atau keluar jalur, biasanya tidak boleh memasuki zona pemisah atau memotong garis pemisah, kecuali:
(i) dalam keadaan darurat untuk menghindari bahaya yang mendesak;
(ii) untuk menangkap ikan di dalam zona pemisah.`,
ex:`Zona pemisah ibarat median jalan tol. Hanya boleh dimasuki saat darurat, atau oleh kapal yang menangkap ikan di sana.`},
{k:'f',en:`A vessel navigating in areas near the terminations of traffic separation schemes shall do so with particular caution.`,
id:`Kapal yang berlayar di area dekat ujung-ujung bagan pemisah lalu lintas harus melakukannya dengan kehati-hatian khusus.`,
ex:`Di ujung TSS, kapal-kapal masuk, keluar, dan berubah haluan, sehingga lalu lintas paling padat dan paling sulit ditebak.`},
{k:'g',en:`A vessel shall so far as practicable avoid anchoring in a traffic separation scheme or in areas near its terminations.`,
id:`Kapal sedapat mungkin harus menghindari berlabuh jangkar di dalam bagan pemisah lalu lintas atau di area dekat ujung-ujungnya.`,
ex:`Kapal yang berlabuh di TSS menjadi rintangan di jalur yang padat.`},
{k:'h',en:`A vessel not using a traffic separation scheme shall avoid it by as wide a margin as is practicable.`,
id:`Kapal yang tidak menggunakan bagan pemisah lalu lintas harus menghindarinya dengan jarak selebar mungkin.`,
ex:`Jika tidak memakai TSS, jangan berlayar mepet di pinggirnya. Beri jarak lebar agar tidak membingungkan kapal yang berada di jalur.`},
{k:'i',en:`A vessel engaged in fishing shall not impede the passage of any vessel following a traffic lane.`,
id:`Kapal yang sedang menangkap ikan tidak boleh menghalangi lintasan kapal mana pun yang mengikuti jalur lalu lintas.`,
ex:`Kapal ikan boleh menangkap ikan di sekitar TSS, tetapi tidak boleh menghalangi kapal apa pun yang mengikuti jalur.`},
{k:'j',en:`A vessel of less than 20 metres in length or a sailing vessel shall not impede the safe passage of a power-driven vessel following a traffic lane.`,
id:`Kapal dengan panjang kurang dari 20 meter atau kapal layar tidak boleh menghalangi lintasan aman kapal tenaga yang mengikuti jalur lalu lintas.`,
ex:`Bandingkan 10(i) dan 10(j): kapal ikan tidak boleh menghalangi kapal apa pun di jalur, sedangkan kapal di bawah 20 m dan kapal layar tidak boleh menghalangi kapal tenaga di jalur.`},
{k:'k',en:`A vessel restricted in her ability to manoeuvre when engaged in an operation for the maintenance of safety of navigation in a traffic separation scheme is exempted from complying with this Rule to the extent necessary to carry out the operation.`,
id:`Kapal yang terbatas kemampuan olah geraknya yang sedang melakukan pekerjaan pemeliharaan keselamatan navigasi di dalam bagan pemisah lalu lintas dikecualikan dari aturan ini sejauh diperlukan untuk melaksanakan pekerjaan itu.`,
ex:`Contohnya kapal yang memperbaiki atau memasang pelampung suar di dalam TSS.`},
{k:'l',en:`A vessel restricted in her ability to manoeuvre when engaged in an operation for the laying, servicing or picking up of a submarine cable, within a traffic separation scheme, is exempted from complying with this Rule to the extent necessary to carry out the operation.`,
id:`Kapal yang terbatas kemampuan olah geraknya yang sedang memasang, merawat, atau mengangkat kabel bawah laut di dalam bagan pemisah lalu lintas dikecualikan dari aturan ini sejauh diperlukan untuk melaksanakan pekerjaan itu.`,
ex:`Pekerjaan kabel bawah laut sering memaksa kapal bergerak melawan arah jalur atau berhenti di jalur, sehingga dikecualikan sejauh perlu.`,
uj:`Hanya kapal RAM dalam 10(k) dan 10(l) yang dikecualikan dari Aturan 10, dan hanya sejauh diperlukan untuk pekerjaannya.`}
],
q:[
[`Jika terpaksa memotong jalur TSS, haluan kapal harus…`,[`Sedapat mungkin tegak lurus terhadap arah arus lalu lintas`,`Sejajar dengan arah lalu lintas`,`Membentuk sudut 45° terhadap jalur`,`Mengikuti garis pemisah`],`Aturan 10(c).`],
[`Masuk ke jalur TSS dari samping dilakukan dengan…`,[`Sudut sekecil mungkin terhadap arah lalu lintas`,`Sudut tegak lurus`,`Kecepatan maksimum`,`Membunyikan lima tiupan pendek`],`Aturan 10(b)(iii).`],
[`Kapal layar di area TSS bersilangan dengan kapal tenaga yang mengikuti jalur. Kewajiban kapal layar?`,[`Tidak menghalangi lintasan aman kapal tenaga`,`Bertahan, karena kapal tenaga wajib menyingkir dari kapal layar`,`Berbelok ke kiri`,`Menunggu isyarat dari kapal tenaga`],`Aturan 10(j), yang didahulukan oleh Aturan 18 ("except where Rules 9, 10 and 13 otherwise require").`]
]});

rule({n:11,p:'B2',t:`Penerapan`,en:`Application`,
sum:`Aturan 12 sampai 18 hanya berlaku bagi kapal yang saling melihat secara visual.`,
mn:`"Tidak saling melihat, tidak ada stand-on."`,
rel:[3,19],
subs:[
{k:'',en:`Rules in this Section apply to vessels in sight of one another.`,
id:`Aturan-aturan dalam Seksi ini berlaku bagi kapal-kapal yang saling melihat.`,
ex:`Aturan kapal layar, menyusul, berhadapan, bersilangan, give-way, stand-on, dan hierarki hanya berlaku jika kapal saling melihat secara visual (Aturan 3(k)). Di kabut tanpa kontak visual, gunakan Aturan 19.`,
uj:`Tidak ada kapal "stand-on" atau "give-way" dalam kabut tanpa kontak visual.`}
],
q:[
[`Aturan 15 (bersilangan) berlaku jika…`,[`Kedua kapal saling melihat secara visual`,`Kapal hanya terdeteksi di radar`,`Kapal hanya terdeteksi di AIS`,`Ada kabut tebal`],`Aturan 11 dan 3(k).`],
[`Dua kapal hanya saling terdeteksi lewat radar dalam kabut. Aturan olah gerak yang berlaku?`,[`Aturan 19`,`Aturan 15`,`Aturan 14`,`Aturan 17`],`Kapal yang tidak saling melihat di tampak terbatas memakai Aturan 19.`],
[`"Saling melihat" menurut Aturan 3(k) berarti…`,[`Satu kapal dapat diamati secara visual dari kapal lainnya`,`Keduanya tampak di layar AIS`,`Keduanya terdengar di VHF`,`Keduanya tampak di radar`],`Kata kuncinya "visually".`]
]});

rule({n:12,p:'B2',t:`Kapal layar`,en:`Sailing Vessels`,
lead:{en:`(a) When two sailing vessels are approaching one another, so as to involve risk of collision, one of them shall keep out of the way of the other as follows:`,id:`(a) Jika dua kapal layar saling mendekat sehingga menimbulkan risiko tubrukan, salah satunya harus menyingkir dari yang lain sebagai berikut:`},
sum:`Antara dua kapal layar: angin dari sisi berbeda, kapal port tack menyingkir; angin dari sisi sama, kapal di atas angin menyingkir; port tack yang ragu menyingkir. Sisi atas angin ditentukan dari sisi layar utama.`,
mn:`"Layar utama di kanan? Anda yang mengalah." (Layar utama di kanan berarti angin dari kiri.)`,
rel:[13,18],
subs:[
{k:'a-i',en:`when each has the wind on a different side, the vessel which has the wind on the port side shall keep out of the way of the other;`,
id:`jika masing-masing menerima angin dari sisi yang berbeda, kapal yang menerima angin di sisi kirinya harus menyingkir dari kapal lainnya;`,
ex:`Kapal "port tack" (angin dari kiri, layar utama di sisi kanan) menyingkir dari kapal "starboard tack".`,
pm:`Cara cepat: lihat di sisi mana layar utama Anda. Layar utama di kanan berarti angin datang dari kiri, jadi Anda yang menyingkir.`},
{k:'a-ii',en:`when both have the wind on the same side, the vessel which is to windward shall keep out of the way of the vessel which is to leeward;`,
id:`jika keduanya menerima angin dari sisi yang sama, kapal yang berada di atas angin harus menyingkir dari kapal yang berada di bawah angin;`,
ex:`Kapal di atas angin (windward) lebih leluasa bermanuver dan juga "mencuri" angin kapal di bawahnya, jadi ia yang menyingkir.`},
{k:'a-iii',en:`if a vessel with the wind on the port side sees a vessel to windward and cannot determine with certainty whether the other vessel has the wind on the port or on the starboard side, she shall keep out of the way of the other.`,
id:`jika kapal yang menerima angin di sisi kirinya melihat kapal di atas anginnya dan tidak dapat memastikan apakah kapal lain itu menerima angin di sisi kiri atau kanan, ia harus menyingkir dari kapal lain itu.`,
