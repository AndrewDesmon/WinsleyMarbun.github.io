{k:'1f',l:`1(f)`,en:`Fitting of more than one whistle. If whistles are fitted at a distance apart of more than 100 metres, it shall be so arranged that they are not sounded simultaneously.`,id:`Pemasangan lebih dari satu suling. Bila suling dipasang berjarak lebih dari 100 meter, harus diatur agar tidak berbunyi bersamaan.`,ex:`Sejalan dengan Aturan 34(f).`},
{k:'1g',l:`1(g)`,en:`Combined whistle systems. If due to the presence of obstructions the sound field of a single whistle or of one of the whistles referred to in paragraph 1(f) above is likely to have a zone of greatly reduced signal level, it is recommended that a combined whistle system be fitted so as to overcome this reduction. For the purposes of the Rules a combined whistle system is to be regarded as a single whistle. The whistles of a combined system shall be located at a distance apart of not more than 100 metres and arranged to be sounded simultaneously. The frequency of any one whistle shall differ from those of the others by at least 10 Hz.`,id:`Sistem suling gabungan. Bila karena rintangan medan suara satu suling kemungkinan memiliki zona dengan tingkat isyarat sangat rendah, dianjurkan memasang sistem suling gabungan. Untuk keperluan aturan, sistem gabungan dianggap satu suling. Suling-suling dalam sistem gabungan berjarak tidak lebih dari 100 meter, dibunyikan bersamaan, dan frekuensinya berbeda sekurang-kurangnya 10 Hz.`,ex:`Suling gabungan berbunyi bersamaan dan dianggap satu suling.`},
{k:'2',l:`2`,en:`Bell or gong.
(a) Intensity of signal. A bell or gong, or other device having similar sound characteristics shall produce a sound pressure level of not less than 110 dB at a distance of 1 metre from it.
(b) Construction. Bells and gongs shall be made of corrosion-resistant material and designed to give a clear tone. The diameter of the mouth of the bell shall be not less than 300 mm for vessels of 20 metres or more in length. Where practicable, a power-driven bell striker is recommended to ensure constant force but manual operation shall be possible. The mass of the striker shall be not less than 3 per cent of the mass of the bell.`,
id:`Bel atau gong.
(a) Kekuatan isyarat. Bel atau gong, atau alat lain dengan karakter suara serupa, harus menghasilkan tingkat tekanan suara tidak kurang dari 110 dB pada jarak 1 meter.
(b) Konstruksi. Bel dan gong dibuat dari bahan tahan karat dan dirancang memberi nada jernih. Diameter mulut bel tidak kurang dari 300 mm untuk kapal 20 meter atau lebih. Bila memungkinkan dianjurkan pemukul bel bertenaga agar kekuatannya tetap, tetapi harus bisa dioperasikan manual. Massa pemukul tidak kurang dari 3 persen massa bel.`,ex:`110 dB pada 1 m; mulut bel minimal 300 mm; pemukul minimal 3% massa bel.`},
{k:'3',l:`3`,en:`Approvals. The construction of sound signal appliances, their performance and their installation on board the vessel shall be to the satisfaction of the appropriate authority of the State whose flag the vessel is entitled to fly.`,id:`Persetujuan. Konstruksi, kinerja, dan pemasangan alat isyarat suara di kapal harus memenuhi persyaratan otoritas yang berwenang dari Negara bendera kapal.`,ex:`Sama seperti Annex I bagian 14.`}
],
q:[
[`Jarak dengar suling kapal ≥200 m adalah…`,[`2 mil`,`1,5 mil`,`1 mil`,`0,5 mil`],`Annex III 1(c).`],
[`Frekuensi dasar suling kapal ≥200 m berada pada…`,[`70–200 Hz`,`130–350 Hz`,`250–700 Hz`,`700–2100 Hz`],`Annex III 1(b)(i).`],
[`Bel dan gong harus menghasilkan suara minimal… pada jarak 1 m`,[`110 dB`,`143 dB`,`100 dB(A)`,`130 dB`],`Annex III 2(a).`]
]});

AX({n:'A4',lbl:`Annex IV`,short:`IV`,enl:`Annex IV`,pre:`Annex IV `,t:`Isyarat bahaya`,en:`Distress Signals`,tool:[['bahaya','Bahaya atau bukan?']],
sum:`Lima belas isyarat bahaya, dari tembakan tiap menit, suling kabut terus-menerus, roket merah, SOS, Mayday, bendera N di atas C, sampai DSC, Inmarsat, EPIRB, dan SART. Memakai isyarat ini tanpa keadaan bahaya dilarang.`,
mn:`"Bunyi terus, merah terbang, oranye mengepul, lengan naik turun."`,
rel:[37,27,36],
subs:[
{k:'1',l:`1`,en:`The following signals, used or exhibited either together or separately, indicate distress and need of assistance:
(a) a gun or other explosive signal fired at intervals of about a minute;
(b) a continuous sounding with any fog-signalling apparatus;
(c) rockets or shells, throwing red stars fired one at a time at short intervals;
(d) a signal made by any signalling method consisting of the group ... --- ... (SOS) in the Morse Code;
(e) a signal sent by radiotelephony consisting of the spoken word "MAYDAY";
(f) the International Code Signal of distress indicated by N.C.;
(g) a signal consisting of a square flag having above or below it a ball or anything resembling a ball;
(h) flames on the vessel (as from a burning tar barrel, oil barrel, etc.);
(i) a rocket parachute flare or a hand-flare showing a red light;
(j) a smoke signal giving off orange-coloured smoke;
(k) slowly and repeatedly raising and lowering arms outstretched to each side;
(l) a distress alert by means of digital selective calling (DSC) transmitted on: (i) VHF channel 70, or (ii) MF/HF on the frequencies 2187.5 kHz, 8414.5 kHz, 4207.5 kHz, 6312 kHz, 12577 kHz or 16804.5 kHz;
(m) a ship-to-shore distress alert transmitted by the ship's Inmarsat or other mobile satellite service provider ship earth station;
(n) signals transmitted by emergency position-indicating radio beacons;
(o) approved signals transmitted by radiocommunications systems, including survival craft radar transponders.`,
id:`Isyarat berikut, digunakan atau ditunjukkan bersama-sama atau terpisah, menandakan bahaya dan butuh pertolongan:
(a) tembakan senjata atau isyarat ledakan lain dengan selang sekitar satu menit;
(b) bunyi terus-menerus dengan alat isyarat kabut apa pun;
(c) roket atau peluru yang memancarkan bintang merah, ditembakkan satu per satu dengan selang singkat;
(d) isyarat dengan cara apa pun berupa kelompok ... --- ... (SOS) dalam Kode Morse;
(e) isyarat radiotelefoni berupa kata yang diucapkan "MAYDAY";
(f) isyarat bahaya Kode Internasional N.C.;
(g) isyarat berupa bendera persegi dengan bola atau benda menyerupai bola di atas atau di bawahnya;
(h) nyala api di kapal (misalnya dari tong ter atau tong minyak yang dibakar);
(i) suar parasut roket atau suar tangan yang menyala merah;
(j) isyarat asap yang mengeluarkan asap berwarna oranye;
(k) mengangkat dan menurunkan kedua lengan yang terentang ke samping secara perlahan dan berulang;
(l) peringatan bahaya melalui panggilan selektif digital (DSC) pada (i) VHF kanal 70, atau (ii) MF/HF pada frekuensi 2187,5; 8414,5; 4207,5; 6312; 12577; atau 16804,5 kHz;
(m) peringatan bahaya kapal-ke-darat melalui stasiun bumi kapal Inmarsat atau penyedia layanan satelit bergerak lainnya;
(n) isyarat dari rambu radio penunjuk posisi darurat (EPIRB);
(o) isyarat yang disetujui dari sistem radiokomunikasi, termasuk transponder radar sekoci (SART).`,
ex:`Dokumen sumber memuat dua versi Annex IV; yang dipakai di sini versi terbaru (dengan DSC dan Inmarsat), sedangkan versi lama masih menyebut alarm radiotelegraf.`,uj:`Hafalkan beberapa yang khas: asap OREN (bukan merah), bintang MERAH, bendera N di atas C, tembakan tiap ±1 menit, DSC VHF kanal 70.`},
{k:'2',l:`2`,en:`The use or exhibition of any of the foregoing signals, except for the purpose of indicating distress and need of assistance and the use of other signals which may be confused with any of the above signals, is prohibited.`,id:`Penggunaan atau penunjukan isyarat-isyarat di atas, kecuali untuk menandakan bahaya dan butuh pertolongan, serta penggunaan isyarat lain yang dapat dikacaukan dengan isyarat di atas, dilarang.`,ex:`Menyalakan suar merah untuk perayaan atau latihan tanpa pemberitahuan dilarang.`},
{k:'3',l:`3`,en:`Attention is drawn to the relevant sections of the International Code of Signals, the International Aeronautical and Maritime Search and Rescue Manual, Volume III and the following signals:
(a) a piece of orange-coloured canvas with either a black square and circle or other appropriate symbol (for identification from the air);
(b) a dye marker.`,id:`Perhatian diarahkan pada bagian terkait Kode Isyarat Internasional, Manual Pencarian dan Pertolongan Penerbangan dan Maritim Internasional (IAMSAR) Volume III, serta isyarat berikut:
(a) sehelai kanvas oranye dengan kotak dan lingkaran hitam atau simbol lain yang sesuai (untuk dikenali dari udara);
(b) pewarna laut (dye marker).`,ex:`Dua alat bantu ini membantu pesawat SAR menemukan Anda.`}
],
q:[
[`Isyarat asap bahaya berwarna…`,[`Oranye`,`Merah`,`Hitam`,`Putih`],`Annex IV 1(j).`],
[`Peringatan bahaya DSC di VHF dikirim pada kanal…`,[`70`,`16`,`13`,`6`],`Annex IV 1(l)(i).`],
[`Tembakan sebagai isyarat bahaya dilakukan dengan selang sekitar…`,[`Satu menit`,`Lima detik`,`Sepuluh menit`,`Dua menit`],`Annex IV 1(a).`]
]});

rule({n:'K',p:'K',lbl:`Pasal Konvensi`,short:`I–IX`,enl:`Articles I–IX`,pre:`Pasal `,t:`Pasal-pasal Konvensi`,en:`Convention on the International Regulations for Preventing Collisions at Sea, 1972`,
sum:`Pasal I–IX mengatur kewajiban negara pihak, cara menjadi pihak, pemberlakuan (tidak sebelum 1 Januari 1976; berlaku 15 Juli 1977), konferensi revisi, amandemen lewat MSC dan Majelis IMO, penarikan diri, penyimpanan, dan bahasa resmi (Inggris dan Prancis).`,
mn:`"Ditandatangani London, 20 Oktober 1972."`,
rel:[1,39],
subs:[
{k:'I',l:`I`,en:`General Obligations. The Parties to the present Convention undertake to give effect to the Rules and other Annexes constituting the International Regulations for Preventing Collisions at Sea, 1972, attached hereto.`,id:`Kewajiban Umum. Para Pihak Konvensi ini berjanji memberlakukan Aturan-aturan dan Annex lainnya yang membentuk Peraturan Internasional Pencegahan Tubrukan di Laut 1972 yang dilampirkan.`,ex:`Negara yang menjadi pihak wajib menerapkan COLREGs dalam hukum nasionalnya.`},
{k:'II',l:`II`,en:`Signature, Ratification, Acceptance, Approval and Accession.
1 The present Convention shall remain open for signature until 1 June 1973 and shall thereafter remain open for accession.
2 States Members of the United Nations, or of any of the Specialized Agencies, or the International Atomic Energy Agency, or Parties to the Statute of the International Court of Justice may become Parties to this Convention by: (a) signature without reservation as to ratification, acceptance or approval; (b) signature subject to ratification, acceptance or approval followed by ratification, acceptance or approval; or (c) accession.
3 Ratification, acceptance, approval or accession shall be effected by the deposit of an instrument to that effect with the Inter-Governmental Maritime Consultative Organization (hereinafter referred to as "the Organization") which shall inform the Governments of States that have signed or acceded to the present Convention of the deposit of each instrument and of the date of its deposit.`,
id:`Penandatanganan, Ratifikasi, Penerimaan, Persetujuan, dan Aksesi.
1 Konvensi terbuka untuk ditandatangani sampai 1 Juni 1973, setelah itu terbuka untuk aksesi.
2 Negara anggota PBB, badan khusus PBB, IAEA, atau pihak Statuta Mahkamah Internasional dapat menjadi Pihak melalui: (a) penandatanganan tanpa syarat ratifikasi, penerimaan, atau persetujuan; (b) penandatanganan dengan syarat ratifikasi, penerimaan, atau persetujuan, lalu diikuti ratifikasi, penerimaan, atau persetujuan; atau (c) aksesi.
3 Ratifikasi, penerimaan, persetujuan, atau aksesi dilakukan dengan menyerahkan instrumen kepada IMCO ("Organisasi"), yang memberi tahu negara-negara penanda tangan atau peserta aksesi tentang setiap penyerahan dan tanggalnya.`,ex:`IMCO adalah nama lama IMO (berganti nama tahun 1982).`},
{k:'III',l:`III`,en:`Territorial Application.
1 The United Nations in cases where they are the administering authority for a territory, or any Contracting Party responsible for the international relations of a territory, may at any time by notification in writing to the Secretary-General of the Organization (hereinafter referred to as "the Secretary-General"), extend the application of this Convention to such a territory.
2 The present Convention shall, upon the date of receipt of the notification or from such other date as may be specified in the notification, extend to the territory named therein.
3 Any notification made in accordance with paragraph 1 of this Article may be withdrawn in respect of any territory mentioned in that notification and the extension of this Convention to that territory shall cease to apply after one year or such longer period as may be specified at the time of the withdrawal.
4 The Secretary-General shall inform all Contracting Parties of the notification of any extension or withdrawal of any extension communicated under this Article.`,
id:`Penerapan Wilayah.
1 PBB sebagai otoritas pengelola suatu wilayah, atau Pihak yang bertanggung jawab atas hubungan internasional suatu wilayah, sewaktu-waktu dapat memperluas penerapan Konvensi ke wilayah itu dengan pemberitahuan tertulis kepada Sekretaris Jenderal Organisasi.
2 Konvensi berlaku di wilayah tersebut sejak tanggal pemberitahuan diterima atau tanggal lain yang disebut dalam pemberitahuan.
3 Pemberitahuan dapat ditarik kembali, dan perluasan berhenti berlaku setelah satu tahun atau jangka lebih lama yang disebut saat penarikan.
4 Sekretaris Jenderal memberi tahu semua Pihak tentang setiap perluasan atau penarikannya.`,ex:`Mengatur berlakunya Konvensi di wilayah yang hubungan luar negerinya diurus negara lain.`},
{k:'IV',l:`IV`,en:`Entry into Force.
1 (a) The present Convention shall enter into force twelve months after the date on which at least 15 States, the aggregate of whose merchant fleets constitutes not less than 65 per cent by number or by tonnage of the world fleet of vessels of 100 gross tons and over, have become Parties to it, whichever is achieved first. (b) Notwithstanding the provisions in sub-paragraph (a) of this paragraph, the present Convention shall not enter into force before 1 January 1976.
2 Entry into force for States which ratify, accept, approve or accede to this Convention in accordance with Article II after the conditions prescribed in sub-paragraph 1(a) have been met and before the Convention enters into force, shall be on the date of entry into force of the Convention.
3 Entry into force for States which ratify, accept, approve or accede after the date on which this Convention enters into force, shall be on the date of deposit of an instrument in accordance with Article II.
4 After the date of entry into force of an amendment to this Convention in accordance with paragraph 4 of Article VI, any ratification, acceptance, approval or accession shall apply to the Convention as amended.
5 On the date of entry into force of this Convention, the Regulations replace and abrogate the International Regulations for Preventing Collisions at Sea, 1960.
6 The Secretary-General shall inform the Governments of States that have signed or acceded to this Convention of the date of its entry into force.`,
id:`Pemberlakuan.
1 (a) Konvensi berlaku dua belas bulan setelah sekurang-kurangnya 15 Negara, yang gabungan armada niaganya tidak kurang dari 65 persen jumlah atau tonase armada dunia berukuran 100 GT ke atas, menjadi Pihak, mana yang lebih dahulu tercapai. (b) Namun Konvensi tidak berlaku sebelum 1 Januari 1976.
2 Bagi Negara yang menjadi Pihak setelah syarat 1(a) terpenuhi tetapi sebelum Konvensi berlaku, Konvensi berlaku bersamaan dengan tanggal berlakunya Konvensi.
3 Bagi Negara yang menjadi Pihak setelah Konvensi berlaku, Konvensi berlaku pada tanggal penyerahan instrumennya.
4 Setelah suatu amandemen berlaku menurut Pasal VI ayat 4, setiap ratifikasi, penerimaan, persetujuan, atau aksesi berlaku untuk Konvensi yang telah diamandemen.
5 Pada tanggal berlakunya Konvensi ini, Peraturan ini menggantikan dan mencabut Peraturan Pencegahan Tubrukan di Laut 1960.
6 Sekretaris Jenderal memberi tahu negara-negara tentang tanggal berlakunya Konvensi.`,ex:`Dalam kenyataannya COLREGs 1972 mulai berlaku pada 15 Juli 1977.`,uj:`Syarat: 15 negara, 65% armada dunia (jumlah atau tonase, kapal ≥100 GT), tidak sebelum 1 Januari 1976. COLREGs 1972 menggantikan Peraturan 1960.`},
{k:'V',l:`V`,en:`Revision Conference.
1 A Conference for the purpose of revising this Convention or the Regulations or both may be convened by the Organization.
2 The Organization shall convene a Conference of Contracting Parties for the purpose of revising this Convention or the Regulations or both at the request of not less than one-third of the Contracting Parties.`,id:`Konferensi Revisi.
1 Organisasi dapat menyelenggarakan konferensi untuk merevisi Konvensi atau Peraturan atau keduanya.
2 Organisasi wajib menyelenggarakan konferensi revisi atas permintaan sekurang-kurangnya sepertiga Pihak.`,ex:`Sepertiga Pihak bisa memaksa diadakannya konferensi revisi.`},
{k:'VI',l:`VI`,en:`Amendments to the Regulations.
1 Any amendment to the Regulations proposed by a Contracting Party shall be considered in the Organization at the request of that Party.
2 If adopted by a two-thirds majority of those present and voting in the Maritime Safety Committee of the Organization, such amendment shall be communicated to all Contracting Parties and Members of the Organization at least six months prior to its consideration by the Assembly of the Organization. Any Contracting Party which is not a Member of the Organization shall be entitled to participate when the amendment is considered by the Assembly.
3 If adopted by a two-thirds majority of those present and voting in the Assembly, the amendment shall be communicated by the Secretary-General to all Contracting Parties for their acceptance.
4 Such an amendment shall enter into force on a date to be determined by the Assembly at the time of its adoption unless, by a prior date determined by the Assembly at the same time, more than one-third of the Contracting Parties notify the Organization of their objection to the amendment. Determination by the Assembly of the dates referred to in this paragraph shall be by a two-thirds majority of those present and voting.
5 On entry into force any amendment shall, for all Contracting Parties which have not objected to the amendment, replace and supersede any previous provision to which the amendment refers.
6 The Secretary-General shall inform all Contracting Parties and Members of the Organization of any request and communication under this Article and the date on which any amendment enters into force.`,
id:`Amandemen Peraturan.
1 Usulan amandemen dari suatu Pihak dibahas di Organisasi atas permintaan Pihak itu.
2 Bila diadopsi dua pertiga suara yang hadir dan memberi suara di Komite Keselamatan Maritim (MSC), amandemen dikirim kepada semua Pihak dan anggota Organisasi sekurang-kurangnya enam bulan sebelum dibahas Majelis. Pihak yang bukan anggota Organisasi berhak ikut saat Majelis membahasnya.
3 Bila diadopsi dua pertiga suara di Majelis, Sekretaris Jenderal mengirimkannya kepada semua Pihak untuk diterima.
4 Amandemen berlaku pada tanggal yang ditetapkan Majelis, kecuali sebelum tanggal tertentu lebih dari sepertiga Pihak menyatakan keberatan. Penetapan tanggal-tanggal itu dengan dua pertiga suara.
5 Saat berlaku, amandemen menggantikan ketentuan lama bagi semua Pihak yang tidak berkeberatan.
6 Sekretaris Jenderal memberi tahu semua Pihak dan anggota tentang setiap permintaan, komunikasi, dan tanggal berlakunya amandemen.`,ex:`Prosedur "penerimaan diam-diam" (tacit acceptance): amandemen otomatis berlaku kecuali ditolak lebih dari sepertiga Pihak. Contohnya amandemen 2001 (Resolusi A.910(22) dan A.919(22)) yang berlaku 29 November 2003.`,uj:`Alur: usulan Pihak → MSC (2/3) → diedarkan ≥6 bulan → Majelis (2/3) → berlaku kecuali >1/3 Pihak keberatan.`},
{k:'VII',l:`VII`,en:`Denunciation.
1 The present Convention may be denounced by a Contracting Party at any time after the expiry of five years from the date on which the Convention entered into force for that Party.
2 Denunciation shall be effected by the deposit of an instrument with the Organization. The Secretary-General shall inform all other Contracting Parties of the receipt of the instrument of denunciation and of the date of its deposit.
3 A denunciation shall take effect one year, or such longer period as may be specified in the instrument, after its deposit.`,id:`Penarikan Diri.
1 Suatu Pihak dapat menarik diri kapan saja setelah lewat lima tahun sejak Konvensi berlaku baginya.
2 Penarikan diri dilakukan dengan menyerahkan instrumen kepada Organisasi; Sekretaris Jenderal memberi tahu Pihak lain.
3 Penarikan diri berlaku satu tahun, atau jangka lebih lama yang disebut, setelah instrumen diserahkan.`,ex:`Minimal 5 tahun menjadi pihak; berlaku 1 tahun setelah diserahkan.`},
{k:'VIII',l:`VIII`,en:`Deposit and Registration.
1 The present Convention and the Regulations shall be deposited with the Organization, and the Secretary-General shall transmit certified true copies thereof to all Governments of States that have signed this Convention or acceded to it.
2 When the present Convention enters into force, the text shall be transmitted by the Secretary-General to the Secretariat of the United Nations for registration and publication in accordance with Article 102 of the Charter of the United Nations.`,id:`Penyimpanan dan Pendaftaran.
1 Konvensi dan Peraturan disimpan di Organisasi, dan Sekretaris Jenderal mengirimkan salinan resmi kepada pemerintah semua negara penanda tangan atau peserta aksesi.
2 Setelah Konvensi berlaku, teksnya dikirim ke Sekretariat PBB untuk didaftarkan dan diterbitkan sesuai Pasal 102 Piagam PBB.`,ex:`IMO menjadi penyimpan (depositary) Konvensi.`},
{k:'IX',l:`IX`,en:`Languages. The present Convention is established, together with the Regulations, in a single copy in the English and French languages, both texts being equally authentic. Official translations in the Russian and Spanish languages shall be prepared and deposited with the signed original.
IN WITNESS WHEREOF the undersigned being duly authorized by their respective Governments for that purpose have signed the present Convention.
DONE AT LONDON this twentieth day of October one thousand nine hundred and seventy-two.`,id:`Bahasa. Konvensi beserta Peraturan dibuat dalam satu naskah berbahasa Inggris dan Prancis yang sama-sama otentik. Terjemahan resmi berbahasa Rusia dan Spanyol disiapkan dan disimpan bersama naskah asli.
SEBAGAI BUKTI, yang bertanda tangan di bawah ini, yang diberi kuasa oleh pemerintahnya, telah menandatangani Konvensi ini.
DIBUAT DI LONDON pada tanggal dua puluh Oktober seribu sembilan ratus tujuh puluh dua.`,ex:`Bahasa otentik: Inggris dan Prancis. Terjemahan Indonesia (P2TL) adalah terjemahan resmi nasional, bukan naskah otentik internasional.`}
],
q:[
[`COLREGs 1972 ditandatangani di…`,[`London, 20 Oktober 1972`,`Jenewa, 1 Juni 1973`,`New York, 1 Januari 1976`,`Paris, 15 Juli 1977`],`Pasal IX.`],
[`Amandemen Peraturan tidak berlaku bila…`,[`Lebih dari sepertiga Pihak menyatakan keberatan`,`Satu Pihak menyatakan keberatan`,`Separuh Pihak tidak memberi suara`,`MSC tidak bersidang`],`Pasal VI ayat 4.`],
[`Bahasa otentik Konvensi adalah…`,[`Inggris dan Prancis`,`Inggris saja`,`Inggris, Prancis, Rusia, dan Spanyol`,`Semua bahasa resmi PBB`],`Pasal IX.`]
]});

TJ({n:'TJ1',lbl:`Tugas Jaga, Seksi I`,short:`TJ I`,enl:`Recommendation on Navigational Watchkeeping, Section 1`,pre:`TJ I `,t:`Prinsip dasar tugas jaga navigasi`,en:`Basic Principles to be Observed in Keeping a Navigational Watch`,
sum:`Nakhoda memastikan pengaturan jaga memadai; anjungan tidak pernah ditinggal; awak jaga cukup istirahat; pelayaran direncanakan; pengamatan dijaga penuh dan terpisah dari tugas juru mudi; kehadiran pandu tidak mengurangi tanggung jawab nakhoda dan mualim jaga.`,
mn:`"Anjungan tak pernah kosong, pengamat tak merangkap."`,
subs:[
{k:'1',l:`1–2`,en:`[Introduction] 1. The master of every ship is bound to ensure that the watchkeeping arrangements are adequate for maintaining a safe navigational watch. Under his general direction, the officers of the watch are responsible for navigating the ship safely during their periods of duty when they will be particularly concerned to avoid collision and stranding.
2. This Section includes the basic principles which shall at least be taken into account by all ships.`,id:`[Pendahuluan] 1. Nakhoda setiap kapal wajib memastikan pengaturan jaga memadai untuk tugas jaga navigasi yang aman. Di bawah arahannya, para mualim jaga bertanggung jawab menavigasikan kapal dengan aman selama jaganya, terutama untuk menghindari tubrukan dan kandas.
2. Seksi ini memuat prinsip dasar yang sekurang-kurangnya harus diperhatikan semua kapal.`,ex:`Tanggung jawab berlapis: nakhoda mengatur, mualim jaga melaksanakan.`},
{k:'3',l:`3–4`,en:`[Watch arrangements] 3. The composition of the watch, including the requirement for look-out(s), shall at all times be adequate and appropriate to the prevailing circumstances and conditions.
4. When deciding the composition of the watch on the bridge the following points are among those to be taken into account: (a) at no time shall the bridge be left unattended; (b) the weather conditions, visibility and whether there is daylight or darkness; (c) the proximity of navigational hazards which may make it necessary for the officer in charge to carry out additional navigational duties; (d) the use and operational condition of navigational aids such as radar or electronic position-indicating devices and any other equipment affecting the safe navigation of the ship; (e) whether the ship is fitted with automatic steering; (f) any additional demands on the navigational watch that may arise as a result of special operational circumstances.`,id:`[Pengaturan jaga] 3. Susunan regu jaga, termasuk kebutuhan pengamat, setiap saat harus memadai dan sesuai keadaan.
4. Dalam menentukan susunan jaga di anjungan, antara lain diperhatikan: (a) anjungan tidak boleh ditinggalkan kosong kapan pun; (b) cuaca, jarak pandang, dan siang atau malam; (c) dekatnya bahaya navigasi yang menuntut tugas tambahan; (d) penggunaan dan kondisi alat bantu navigasi seperti radar dan alat penentu posisi elektronik; (e) apakah kapal memakai kemudi otomatis; (f) tuntutan tambahan karena keadaan operasional khusus.`,ex:`Prinsip nomor satu: anjungan tidak pernah boleh kosong.`},
{k:'5',l:`5–10`,en:`[Fitness for duty] 5. The watch system shall be such that the efficiency of the watchkeeping members of the crew is not impaired by fatigue. Accordingly the duties shall be so organized that the first watch at the commencement of a voyage and the subsequent relieving watches are sufficiently rested and otherwise fit when going on duty.
[Navigation] 6. The intended voyage shall be planned in advance taking into consideration all pertinent information and any course laid down shall be checked.
7. On taking over the watch the ship's estimated or true position, intended track, course and speed shall be confirmed; any navigational hazard expected to be encountered during the watch shall be noted.
8. During the watch the course steered, position and speed shall be checked at sufficiently frequent intervals using any available navigational aids necessary to ensure that the ship follows the planned course.
9. The safety and navigational equipment with which the ship is provided and the manner of its operation shall be clearly understood; in addition its operational condition shall be fully taken into account.
10. Whoever is in charge of a navigational watch shall not be assigned or undertake any duties which would interfere with the safe navigation of the ship.`,id:`[Kelaikan bertugas] 5. Sistem jaga harus mencegah kelelahan mengurangi efisiensi awak jaga. Tugas diatur agar jaga pertama di awal pelayaran dan jaga pengganti berikutnya cukup istirahat dan laik saat mulai bertugas.
[Navigasi] 6. Pelayaran direncanakan sebelumnya dengan semua informasi terkait, dan setiap haluan yang ditetapkan diperiksa.
7. Saat menerima jaga, posisi perkiraan atau sebenarnya, rencana lintasan, haluan, dan kecepatan dipastikan; bahaya navigasi yang diperkirakan dicatat.
8. Selama jaga, haluan, posisi, dan kecepatan diperiksa cukup sering dengan alat bantu yang ada agar kapal mengikuti rencana.
9. Peralatan keselamatan dan navigasi serta cara pengoperasiannya harus dipahami dengan jelas, dan kondisinya diperhitungkan.
10. Penanggung jawab jaga tidak boleh diberi atau mengambil tugas yang mengganggu navigasi yang aman.`,ex:`Kelelahan, rencana pelayaran, dan fokus penuh pada navigasi.`},
{k:'11',l:`11`,en:`[Look-out] 11. Every ship shall at all times maintain a proper look-out by sight and hearing as well as by all available means appropriate in the prevailing circumstances and conditions so as to make a full appraisal of the situation and of the risk of collision, stranding and other hazards to navigation. Additionally, the duties of the look-out shall include the detection of ships or aircraft in distress, shipwrecked persons, wrecks and debris. In applying these principles the following shall be observed:
(a) whoever is keeping a look-out must be able to give full attention to the task and no duties shall be assigned or undertaken which would interfere with the keeping of a proper look-out;
(b) the duties of the person on look-out and helmsman are separate and the helmsman should not be considered the person on look-out while steering; except in small vessels where an unobstructed all round view is provided at the steering position and there is no impairment of night vision or other impediment to the keeping of a proper look-out;
(c) there may be circumstances in which the officer of the watch can safely be the sole look-out in daylight. However, this practice shall only be followed after the situation has been carefully assessed on each occasion and it has been established without doubt that it is safe to do so. Full account shall be taken of all relevant factors including but not limited to the state of weather, conditions of visibility, traffic density, proximity of navigational hazards and if navigating in or near a traffic separation scheme. Assistance must be summoned to the bridge when any change in the situation necessitates this and such assistance must be immediately available.`,
id:`[Pengamatan] 11. Setiap kapal setiap saat menjaga pengamatan yang layak dengan penglihatan, pendengaran, dan semua sarana yang sesuai untuk menilai penuh situasi serta risiko tubrukan, kandas, dan bahaya navigasi lain. Tugas pengamat juga mencakup mendeteksi kapal atau pesawat dalam bahaya, orang korban kapal karam, kerangka kapal, dan puing. Dalam menerapkannya:
(a) pengamat harus dapat memberi perhatian penuh, dan tidak boleh diberi atau mengambil tugas yang mengganggu pengamatan;
(b) tugas pengamat dan juru mudi terpisah; juru mudi yang sedang mengemudi tidak dianggap pengamat, kecuali di kapal kecil dengan pandangan bebas ke segala arah dari posisi kemudi tanpa gangguan penglihatan malam;
(c) dalam keadaan tertentu mualim jaga dapat menjadi satu-satunya pengamat pada siang hari, tetapi hanya setelah situasi dinilai cermat setiap kali dan dipastikan tanpa ragu aman, dengan memperhitungkan cuaca, jarak pandang, kepadatan lalu lintas, dekatnya bahaya, dan apakah berada di dalam atau dekat TSS. Bantuan harus dipanggil ke anjungan bila situasi berubah dan harus segera tersedia.`,
ex:`Melengkapi Aturan 5: pengamat sendirian hanya boleh siang hari dan setelah penilaian cermat.`,uj:`Mualim jaga sebagai satu-satunya pengamat: hanya SIANG hari, setelah dinilai aman, dengan bantuan segera tersedia.`},
{k:'12',l:`12–13`,en:`[Navigation with pilot embarked] 12. Despite the duties and obligations of a pilot, his presence on board does not relieve the master or officer in charge of the watch from their duties and obligations for the safety of the ship. The master and the pilot shall exchange information regarding navigation procedures, local conditions and the ship's characteristics.
[Protection of the marine environment] 13. The master and officer in charge of the watch shall be aware of the serious effects of operational or accidental pollution of the marine environment and shall take all possible precautions to prevent such pollution, particularly within the framework of existing international regulations.`,id:`[Navigasi dengan pandu di kapal] 12. Walaupun pandu punya tugas dan kewajiban, kehadirannya tidak membebaskan nakhoda atau mualim jaga dari tugas dan kewajibannya atas keselamatan kapal. Nakhoda dan pandu bertukar informasi tentang prosedur navigasi, kondisi setempat, dan karakteristik kapal.
[Perlindungan lingkungan laut] 13. Nakhoda dan mualim jaga harus menyadari dampak serius pencemaran laut, baik operasional maupun karena kecelakaan, dan melakukan segala upaya pencegahan, terutama sesuai peraturan internasional yang berlaku.`,ex:`Pandu adalah penasihat; tanggung jawab tetap pada nakhoda dan mualim jaga.`}
],
q:[
[`Menurut Rekomendasi Tugas Jaga, anjungan…`,[`Tidak boleh ditinggalkan kosong kapan pun`,`Boleh kosong saat autopilot aktif`,`Boleh kosong di laut lepas`,`Boleh kosong saat berlabuh`],`Seksi I paragraf 4(a).`],
[`Mualim jaga boleh menjadi satu-satunya pengamat…`,[`Siang hari, setelah dinilai cermat dan dipastikan aman`,`Kapan saja di laut lepas`,`Malam hari jika radar menyala`,`Tidak pernah`],`Seksi I paragraf 11(c).`],
[`Dengan adanya pandu di kapal, tanggung jawab keselamatan kapal…`,[`Tetap pada nakhoda dan mualim jaga`,`Pindah sepenuhnya ke pandu`,`Pindah ke syahbandar`,`Dibagi rata dengan pandu`],`Seksi I paragraf 12.`]
]});

TJ({n:'TJ2',lbl:`Tugas Jaga, Seksi II`,short:`TJ II`,enl:`Recommendation on Navigational Watchkeeping, Section II`,pre:`TJ II `,t:`Panduan operasional mualim jaga`,en:`Operational Guidance for Officers in charge of a Navigational Watch`,
sum:`Mualim jaga mewakili nakhoda, tidak meninggalkan anjungan sampai diganti, memakai mesin dan suling tanpa ragu, memeriksa alat secara berkala, memakai radar dan plotting, mengambil baringan kompas, dan segera memanggil nakhoda dalam delapan keadaan, termasuk tampak terbatas dan lalu lintas yang mengkhawatirkan.`,
mn:`"Ragu? Panggil nakhoda, tetapi tetap bertindak."`,
subs:[
{k:'1',l:`1–7`,en:`[Introduction] 1. This Section contains operational guidance of general application for officers in charge of a navigational watch, which masters are expected to supplement as appropriate. It is essential that officers of the watch appreciate that the efficient performance of their duties is necessary in the interest of safety of life and property at sea and the avoidance of pollution of the marine environment.
[General] 2. The officer of the watch is the master's representative and his primary responsibility at all times is the safe navigation of the vessel. He must at all times comply with the applicable regulations for preventing collisions at sea (see also paragraphs 23 and 24).
3. The officer of the watch should keep his watch on the bridge which he should in no circumstances leave until properly relieved. It is of especial importance that at all times the officer of the watch ensures that an efficient look-out is maintained. In a vessel with a separate chart room the officer of the watch may visit this, when essential, for a short period for the necessary performance of his navigational duties, but he should previously satisfy himself that it is safe to do so and ensure that an efficient look-out is maintained.
4. There may be circumstances in which the officer of the watch can safely be the sole look-out in daylight. However, this practice shall only be followed after the situation has been carefully assessed on each occasion and it has been established without doubt that it is safe to do so. Full account shall be taken of all relevant factors including but not limited to the state of weather, conditions of visibility, traffic density, proximity of navigational hazards and if navigating in or near a traffic separation scheme. When the officer of the watch is acting as the sole look-out he must not hesitate to summon assistance to the bridge, and when for any reason he is unable to give his undivided attention to the look-out such assistance must be immediately available.
5. The officer of the watch should bear in mind that the engines are at his disposal and he should not hesitate to use them in case of need. However, timely notice of intended variations of engine speed should be given when possible. He should also keep prominently in mind the manoeuvring capabilities of his ship including its stopping distance.
6. The officer of the watch should also bear in mind that the sound signalling apparatus is at his disposal and he should not hesitate to use it in accordance with the applicable regulations for preventing collisions at sea.
7. The officer of the watch continues to be responsible for the safe navigation of the vessel despite the presence of the master on the bridge until the master informs him specifically that he has assumed responsibility and this is mutually understood.`,
id:`[Pendahuluan] 1. Seksi ini berisi panduan operasional umum bagi mualim jaga, yang dapat dilengkapi nakhoda. Mualim jaga harus menyadari bahwa pelaksanaan tugas yang efisien penting bagi keselamatan jiwa, harta di laut, dan pencegahan pencemaran.
[Umum] 2. Mualim jaga adalah wakil nakhoda dan tanggung jawab utamanya setiap saat adalah navigasi kapal yang aman, dengan selalu mematuhi peraturan pencegahan tubrukan.
3. Mualim jaga berjaga di anjungan dan dalam keadaan apa pun tidak meninggalkannya sampai diganti dengan benar. Ia harus selalu memastikan pengamatan yang efisien. Bila ada ruang peta terpisah, ia boleh ke sana sebentar bila perlu untuk tugas navigasi, setelah memastikan aman dan pengamatan tetap terjaga.
4. Mualim jaga dapat menjadi satu-satunya pengamat pada siang hari hanya setelah penilaian cermat (cuaca, jarak pandang, lalu lintas, bahaya, TSS). Saat itu ia tidak boleh ragu memanggil bantuan, dan bantuan harus segera tersedia bila ia tidak bisa memberi perhatian penuh.
5. Mualim jaga harus ingat bahwa mesin siap dipakainya dan tidak ragu menggunakannya bila perlu, dengan pemberitahuan tepat waktu bila memungkinkan, serta selalu mengingat kemampuan olah gerak dan jarak henti kapal.
6. Ia juga harus ingat alat isyarat suara siap dipakai dan tidak ragu menggunakannya sesuai peraturan.
7. Mualim jaga tetap bertanggung jawab atas navigasi meskipun nakhoda di anjungan, sampai nakhoda secara tegas menyatakan mengambil alih dan hal itu dipahami bersama.`,
ex:`Kehadiran nakhoda di anjungan tidak otomatis memindahkan tanggung jawab: harus ada serah terima yang jelas.`,uj:`Paragraf 7 sering diuji: tanggung jawab berpindah hanya bila nakhoda menyatakannya secara tegas dan dipahami bersama.`},
{k:'8',l:`8–10`,en:`[Taking over the watch] 8. The officer of the watch should not hand over the watch to the relieving officer if he has any reason to believe that the latter is apparently under any disability which would preclude him from carrying out his duties effectively. If in doubt, the officer of the watch should inform the master accordingly. The relieving officer of the watch should ensure that members of his watch are apparently fully capable of performing their duties and in particular the adjustment to night vision.
9. The relieving officer should not take over the watch until his vision is fully adjusted to the light conditions and he has personally satisfied himself regarding: (a) standing orders and other special instructions of the master relating to the navigation of the vessel; (b) the position, course, speed and draught of the vessel; (c) prevailing and predicted tides, currents, weather, visibility and the effect of these factors upon course and speed; (d) the navigational situation including but not limited to the following: (i) the operational condition of all navigational and safety equipment being used or likely to be used during the watch; (ii) errors of gyro and magnetic compasses; (iii) the presence and movement of vessels in sight or known to be in the vicinity; (iv) conditions and hazards likely to be encountered during his watch; (v) the possible effects of heel, trim, water density and squat on underkeel clearance.
10. If at the time the officer of the watch is to be relieved a manoeuvre or other action to avoid any hazard is taking place, the relief of the officer should be deferred until such action is completed.`,id:`[Serah terima jaga] 8. Mualim jaga tidak boleh menyerahkan jaga bila ada alasan menduga penggantinya tidak mampu bertugas efektif; bila ragu, laporkan ke nakhoda. Mualim pengganti memastikan anggota regunya mampu bertugas, terutama mata mereka sudah menyesuaikan dengan gelap.
9. Mualim pengganti tidak menerima jaga sebelum matanya menyesuaikan dengan kondisi cahaya dan ia sendiri yakin tentang: (a) perintah tetap dan instruksi khusus nakhoda; (b) posisi, haluan, kecepatan, dan sarat kapal; (c) pasang surut, arus, cuaca, jarak pandang saat ini dan perkiraannya serta pengaruhnya; (d) situasi navigasi, termasuk (i) kondisi alat navigasi dan keselamatan, (ii) kesalahan pedoman gyro dan magnet, (iii) kapal-kapal yang terlihat atau diketahui di sekitar, (iv) kondisi dan bahaya yang mungkin ditemui, (v) pengaruh oleng, trim, massa jenis air, dan squat terhadap ruang bebas lunas.
10. Bila saat pergantian sedang berlangsung olah gerak atau tindakan menghindari bahaya, pergantian ditunda sampai tindakan itu selesai.`,ex:`Jangan pernah serah terima jaga di tengah olah gerak menghindar.`},
{k:'11',l:`11–15`,en:`[Periodic checks of navigational equipment] 11. The officer of the watch should make regular checks to ensure that: (a) the helmsman or the automatic pilot is steering the correct course; (b) the standard compass error is established at least once a watch and when possible, after any major alteration of course; the standard and the gyro compasses should be frequently compared; repeaters should be synchronized with their master compass; (c) the automatic pilot is tested in the manual position at least once a watch; (d) the navigation and signal lights and other navigational equipment are functioning properly.
[Automatic pilot] 12. Officers of the watch should bear in mind the need to station the helmsman and to put the steering into manual control in good time to allow any potentially hazardous situation to be dealt with in a safe manner. With a vessel under automatic steering it is highly dangerous to allow a situation to develop to the point where the officer of the watch is without assistance and has to break the continuity of the look-out in order to take emergency action. The change-over from automatic to manual steering and vice versa should be made by, or under the supervision of, a responsible officer.
[Electronic navigational aids] 13. The officer of the watch should be thoroughly familiar with the use of electronic navigational aids carried, including their capabilities and limitations.
[Echo-sounder] 14. The echo-sounder is a valuable navigational aid and should be used whenever appropriate.
[Navigational records] 15. A proper record of the movements and activities of the vessel should be kept during the watch.`,id:`[Pemeriksaan berkala] 11. Mualim jaga memeriksa secara teratur bahwa: (a) juru mudi atau autopilot mengemudikan haluan yang benar; (b) koreksi pedoman standar ditentukan sekurang-kurangnya sekali tiap jaga dan bila mungkin setelah perubahan haluan besar; pedoman standar dan gyro sering dibandingkan; repeater disinkronkan; (c) autopilot dicoba pada posisi manual sekurang-kurangnya sekali tiap jaga; (d) lampu navigasi, lampu isyarat, dan alat navigasi lain berfungsi baik.
[Autopilot] 12. Juru mudi harus ditempatkan dan kemudi dipindah ke manual tepat waktu agar situasi berbahaya dapat ditangani dengan aman. Sangat berbahaya membiarkan situasi berkembang sampai mualim jaga sendirian dan harus memutus pengamatan untuk tindakan darurat. Pergantian otomatis ke manual dan sebaliknya dilakukan atau diawasi perwira yang bertanggung jawab.
[Alat navigasi elektronik] 13. Mualim jaga harus menguasai alat navigasi elektronik, termasuk kemampuan dan keterbatasannya.
[Perum gema] 14. Perum gema (echo-sounder) adalah alat bantu berharga dan dipakai bila sesuai.
[Catatan navigasi] 15. Gerakan dan kegiatan kapal selama jaga harus dicatat dengan baik.`,ex:`Koreksi pedoman minimal sekali tiap jaga; uji kemudi manual sekali tiap jaga.`},
{k:'16',l:`16–20`,en:`[Radar] 16. The officer of the watch should use the radar when appropriate and whenever restricted visibility is encountered or expected and at all times in congested waters having due regard to its limitations.
17. Whenever radar is in use, the officer of the watch should select an appropriate range scale, observe the display carefully and plot effectively.
18. The officer of the watch should ensure that range scales employed are changed at sufficiently frequent intervals so that echoes are detected as early as possible and that small or poor echoes do not escape detection.
19. The officer of the watch should ensure that plotting or systematic analysis is commenced in ample time, remembering that sufficient time can be made available by reducing speed if necessary.
20. In clear weather, whenever possible, the officer of the watch should carry out radar practice.`,id:`[Radar] 16. Radar dipakai bila sesuai, setiap kali tampak terbatas terjadi atau diperkirakan, dan setiap saat di perairan padat, dengan memperhatikan keterbatasannya.
17. Saat radar dipakai, pilih skala jarak yang tepat, amati layar dengan cermat, dan lakukan plotting yang efektif.
18. Skala jarak cukup sering diganti agar gema terdeteksi sedini mungkin dan gema kecil atau lemah tidak terlewat.
19. Plotting atau analisis sistematis dimulai dalam waktu yang cukup lapang; ingat bahwa waktu bisa "dibeli" dengan mengurangi kecepatan.
20. Dalam cuaca cerah, bila mungkin, lakukan latihan radar.`,ex:`Sejalan dengan Aturan 6(b) dan 7(b).`},
{k:'21',l:`21–24`,en:`[Navigation in coastal waters] 21. The largest scale chart on board, suitable for the area and corrected with the latest available information, should be used. Fixes should be taken at frequent intervals; whenever circumstances allow, fixing should be carried out by more than one method.
22. The officer of the watch should positively identify all relevant navigation marks.
[Clear weather] 23. The officer of the watch should take frequent and accurate compass bearings of approaching vessels as a means of early detection of risk of collision; such risk may sometimes exist even when an appreciable bearing change is evident, particularly when approaching a very large vessel or a tow or when approaching a vessel at close range. He should also take early and positive action in compliance with the applicable regulations for preventing collisions at sea and subsequently check that such action is having the desired effect.
[Restricted visibility] 24. When restricted visibility is encountered or suspected, the first responsibility of the officer of the watch is to comply with the relevant rules of the applicable regulations for preventing collisions at sea, with particular regard to the sounding of fog signals, proceeding at a moderate speed and he shall have the engines ready for immediate manoeuvre. In addition, he should: (a) inform the master (see paragraph 25); (b) post look-out(s) and helmsman and, in congested waters, revert to hand steering immediately; (c) exhibit navigation lights; (d) operate and use the radar. It is important that the officer of the watch should have the manoeuvring capabilities including the "stopping distance" of his own vessel prominently in mind.`,id:`[Navigasi di perairan pantai] 21. Gunakan peta berskala terbesar yang sesuai dan sudah dikoreksi. Ambil posisi (fix) sesering mungkin, dan bila keadaan memungkinkan dengan lebih dari satu metode.
22. Kenali dengan pasti semua tanda navigasi yang relevan.
[Cuaca cerah] 23. Ambil baringan kompas kapal yang mendekat sesering mungkin dan secara akurat untuk mendeteksi dini risiko tubrukan; risiko kadang tetap ada walau baringan berubah jelas, terutama terhadap kapal sangat besar, tundaan, atau kapal yang sangat dekat. Bertindaklah dini dan tegas sesuai peraturan, lalu periksa apakah tindakan itu berhasil.
[Tampak terbatas] 24. Saat tampak terbatas terjadi atau diduga, tanggung jawab pertama mualim jaga adalah mematuhi peraturan pencegahan tubrukan, terutama membunyikan isyarat kabut, berlayar dengan kecepatan sedang, dan menyiapkan mesin untuk olah gerak segera. Selain itu: (a) beri tahu nakhoda; (b) tempatkan pengamat dan juru mudi, dan di perairan padat segera kembali ke kemudi tangan; (c) nyalakan lampu navigasi; (d) operasikan dan gunakan radar. Selalu ingat kemampuan olah gerak dan jarak henti kapal sendiri.`,ex:`Paragraf 23 dan 24 adalah "versi praktis" Aturan 7 dan 19.`,uj:`Empat langkah saat kabut: lapor nakhoda, pengamat + kemudi tangan, lampu navigasi, radar.`},
{k:'25',l:`25`,en:`[Calling the master] 25. The officer of the watch should notify the master immediately under the following circumstances: (a) if restricted visibility is encountered or suspected; (b) if the traffic conditions or the movements of other vessels are causing concern; (c) if difficulty is experienced in maintaining course; (d) on failure to sight land, a navigation mark or to obtain soundings by the expected time; (e) if land or a navigation mark is sighted or a change in soundings occurs unexpectedly; (f) on the breakdown of the engines, steering gear or any essential navigational equipment; (g) in heavy weather if in any doubt about the possibility of weather damage; (h) in any other emergency or situation in which he is in any doubt. Despite the requirement to notify the master immediately in the foregoing circumstances, the officer of the watch should in addition not hesitate to take immediate action for the safety of the ship, where circumstances so require.`,id:`[Memanggil nakhoda] 25. Mualim jaga segera memberi tahu nakhoda bila: (a) tampak terbatas terjadi atau diduga; (b) kondisi lalu lintas atau gerakan kapal lain mengkhawatirkan; (c) sulit mempertahankan haluan; (d) daratan, tanda navigasi, atau kedalaman tidak terlihat/terukur pada waktu yang diperkirakan; (e) daratan, tanda navigasi, atau perubahan kedalaman muncul tak terduga; (f) mesin, kemudi, atau alat navigasi penting rusak; (g) cuaca buruk dan ragu kemungkinan kerusakan; (h) keadaan darurat lain atau situasi apa pun yang meragukan. Walaupun wajib memanggil nakhoda, mualim jaga tetap tidak boleh ragu bertindak segera demi keselamatan kapal bila keadaan menuntut.`,ex:`Memanggil nakhoda tidak berarti menunggu nakhoda: bertindaklah bila perlu.`,uj:`Hafalkan delapan keadaan (a)–(h). Kalimat penutupnya sering diuji: tetap bertindak segera bila perlu.`},
{k:'26',l:`26–28`,en:`[Navigation with pilot embarked] 26. Despite the duties and obligations of a pilot, his presence on board does not relieve the officer of the watch from his duties and obligations for the safety of the ship. He should co-operate closely with the pilot and maintain an accurate check on the vessel's positions and movements. If he is in any doubt as to the pilot's actions or intentions, he should seek clarification from the pilot and if doubt still exists he should notify the master immediately and take whatever action is necessary before the master arrives.
[The watchkeeping personnel] 27. The officer of the watch should give the watchkeeping personnel all appropriate instructions and information which will ensure the keeping of a safe watch including an appropriate look-out.
[Ship at anchor] 28. If the master considers it necessary a continuous navigational watch should be maintained. In all circumstances, however, the officer of the watch should: (a) determine and plot the ship's position on the appropriate chart as soon as practicable and at sufficiently frequent intervals check, when circumstances permit, by taking bearings of fixed navigational marks or readily identifiable shore objects, whether the ship is remaining securely at anchor; (b) ensure that an efficient look-out is maintained; (c) ensure that inspection rounds of the vessel are made periodically; (d) observe meteorological and tidal conditions and the state of the sea; (e) notify the master and undertake all necessary measures if the vessel drags her anchor; (f) ensure that the state of readiness of the main engines and other machinery is in accordance with the master's instructions; (g) if visibility deteriorates notify the master and comply with the applicable regulations for preventing collisions at sea; (h) ensure that the vessel exhibits the appropriate lights and shapes and that appropriate sound signals are made at all times; (i) take measures to protect the environment from pollution by the ship and comply with the applicable pollution regulations.`,
id:`[Navigasi dengan pandu] 26. Kehadiran pandu tidak membebaskan mualim jaga dari kewajibannya. Ia bekerja sama erat dengan pandu dan terus memeriksa posisi dan gerakan kapal. Bila ragu terhadap tindakan atau maksud pandu, minta penjelasan; bila masih ragu, segera beri tahu nakhoda dan ambil tindakan yang perlu sebelum nakhoda tiba.
[Personel jaga] 27. Mualim jaga memberi instruksi dan informasi yang tepat kepada personel jaga agar jaga aman, termasuk pengamatan yang layak.
[Kapal berlabuh] 28. Bila nakhoda menganggap perlu, jaga navigasi terus-menerus dipertahankan. Dalam semua keadaan mualim jaga harus: (a) menentukan dan memplot posisi kapal di peta secepatnya dan cukup sering memeriksa dengan baringan tanda tetap atau benda darat yang mudah dikenali apakah kapal tetap aman di jangkarnya; (b) memastikan pengamatan efisien; (c) memastikan ronda pemeriksaan kapal berkala; (d) mengamati cuaca, pasang surut, dan keadaan laut; (e) memberi tahu nakhoda dan mengambil tindakan bila jangkar menggaruk (kapal hanyut); (f) memastikan kesiapan mesin sesuai instruksi nakhoda; (g) bila jarak pandang memburuk, memberi tahu nakhoda dan mematuhi peraturan pencegahan tubrukan; (h) memastikan lampu, sosok, dan isyarat suara yang sesuai selalu ditunjukkan; (i) mencegah pencemaran dan mematuhi peraturan pencemaran.`,ex:`Saat berlabuh pun jaga tetap berjalan: periksa posisi (jangkar menggaruk?), lampu, sosok, dan isyarat kabut.`}
],
q:[
[`Nakhoda datang ke anjungan. Tanggung jawab navigasi berpindah kepadanya…`,[`Hanya bila nakhoda menyatakannya secara tegas dan dipahami bersama`,`Otomatis saat nakhoda masuk anjungan`,`Setelah 15 menit`,`Bila nakhoda memegang kemudi`],`Seksi II paragraf 7.`],
[`Serah terima jaga saat kapal sedang berolah gerak menghindari bahaya harus…`,[`Ditunda sampai tindakan selesai`,`Dilakukan secepatnya`,`Diserahkan ke juru mudi`,`Dilaporkan ke pandu`],`Seksi II paragraf 10.`],
[`Saat tampak terbatas, mualim jaga antara lain harus…`,[`Memberi tahu nakhoda, menempatkan pengamat, menyalakan lampu, dan memakai radar`,`Menambah kecepatan agar cepat keluar`,`Mematikan radar agar tidak bingung`,`Berlabuh di tempat`],`Seksi II paragraf 24.`]
]});

<script>
function reveal(sel){ const e = typeof sel === 'string' ? document.querySelector(sel) : sel; if(!e) return; e.focus({preventScroll:true}); e.scrollIntoView({block:'nearest'}); }
/* ================= VESSEL LIGHT MODEL ================= */
const L = (c,a,x,y,z,f) => ({c,a,x,y,z,f});
const MH = (y,z) => L('w','mast',0,y,z);
const AR = (c,y,z,x=0,f) => L(c,'all',x,y,z,f);
const SIDE = [L('g','stbd',6,8,9), L('r','port',-6,8,9)];
const STERN = L('w','stern',0,-40,8);
const TOWL = L('y','stern',0,-40,13);
const V = [
 {id:'pwr',n:`Kapal tenaga <50 m`,r:23,lights:[MH(15,30),...SIDE,STERN],sh:[]},
 {id:'pwr50',n:`Kapal tenaga ≥50 m`,r:23,lights:[MH(22,26),MH(-15,42),...SIDE,STERN],sh:[]},
 {id:'small',n:`Kapal tenaga <12 m (lampu keliling)`,r:23,lights:[AR('w',0,20),...SIDE],sh:[]},
 {id:'sail',n:`Kapal layar`,r:25,lights:[...SIDE,STERN],sh:[]},
 {id:'sailopt',n:`Kapal layar dengan merah di atas hijau`,r:25,lights:[AR('r',0,46),AR('g',0,40),...SIDE,STERN],sh:[]},
 {id:'motorsail',n:`Kapal layar yang memakai mesin (siang)`,r:25,lights:[MH(15,30),...SIDE,STERN],sh:['coneDown'],dayOnly:true},
 {id:'tow',n:`Kapal tunda, tundaan ≤200 m`,r:24,lights:[MH(15,32),MH(15,26),...SIDE,STERN,TOWL],sh:[]},
 {id:'tow200',n:`Kapal tunda, tundaan >200 m`,r:24,lights:[MH(15,38),MH(15,32),MH(15,26),...SIDE,STERN,TOWL],sh:['diamond']},
 {id:'push',n:`Kapal mendorong di depan (bukan unit gabungan)`,r:24,lights:[MH(15,32),MH(15,26),...SIDE,STERN],sh:[]},
 {id:'trawl',n:`Kapal pukat, sedang laju`,r:26,lights:[AR('g',5,36),AR('w',5,30),...SIDE,STERN],sh:['coneDown','coneUp']},
 {id:'fish',n:`Kapal penangkap ikan (bukan pukat), sedang laju`,r:26,lights:[AR('r',5,36),AR('w',5,30),...SIDE,STERN],sh:['coneDown','coneUp']},
 {id:'nuc',n:`Kapal NUC, sedang laju`,r:27,lights:[AR('r',0,36),AR('r',0,30),...SIDE,STERN],sh:['ball','ball']},
 {id:'nucstop',n:`Kapal NUC, tidak laju`,r:27,lights:[AR('r',0,36),AR('r',0,30)],sh:['ball','ball']},
 {id:'ram',n:`Kapal RAM, sedang laju`,r:27,lights:[MH(15,38),AR('r',0,30),AR('w',0,24),AR('r',0,18),...SIDE,STERN],sh:['ball','diamond','ball']},
 {id:'cbd',n:`Kapal CBD`,r:28,lights:[MH(25,24),MH(-15,48),AR('r',-10,40,4),AR('r',-10,34,4),AR('r',-10,28,4),...SIDE,STERN],sh:['cyl']},
 {id:'pilot',n:`Kapal pandu sedang bertugas`,r:29,lights:[AR('w',0,36),AR('r',0,30),...SIDE,STERN],sh:[]},
 {id:'anchor',n:`Kapal berlabuh ≥50 m`,r:30,lights:[AR('w',35,26),AR('w',-38,14)],sh:['ball']},
 {id:'aground',n:`Kapal kandas`,r:30,lights:[AR('w',35,26),AR('w',-38,14),AR('r',0,38),AR('r',0,32)],sh:['ball','ball','ball']},
 {id:'hover',n:`Hovercraft`,r:23,lights:[AR('y',0,40,0,1),MH(10,30),...SIDE,STERN],sh:[]},
 {id:'mine',n:`Kapal penyapu ranjau`,r:27,lights:[MH(15,30),AR('g',15,40),AR('g',15,35,-7),AR('g',15,35,7),...SIDE,STERN],sh:['ball','ball','ball'],tri:true}
];
const VMAP = Object.fromEntries(V.map(v => [v.id, v]));
const LC = {w:'#FFF8E6', r:'#FF3D3D', g:'#2EE57F', y:'#FFC734'};
const CNAME = {w:'putih', r:'merah', g:'hijau', y:'kuning'};
function visible(l, th){
  th = ((th % 360) + 360) % 360;
  if(l.a === 'all') return true;
  if(l.a === 'mast') return th <= 112.5 || th >= 247.5;
  if(l.a === 'stbd') return th <= 112.5 || th >= 357;
  if(l.a === 'port') return th >= 247.5 || th <= 3;
  if(l.a === 'stern') return th > 112.5 && th < 247.5;
}
function proj(p, th){ const t = th * Math.PI/180; return -p.x*Math.cos(t) + p.y*Math.sin(t); }
function hullPts(th){
  const out = [[0,44],[7,30],[9,0],[8,-40],[-8,-40],[-9,0],[-7,30]];
  const pts = [];
  out.forEach(([x,y]) => { const sx = proj({x,y}, th); pts.push([sx,0],[sx,11]); });
  pts.sort((a,b) => a[0]-b[0] || a[1]-b[1]);
  const cross = (o,a,b) => (a[0]-o[0])*(b[1]-o[1]) - (a[1]-o[1])*(b[0]-o[0]);
  const lo = [], up = [];
  for(const p of pts){ while(lo.length >= 2 && cross(lo[lo.length-2], lo[lo.length-1], p) <= 0) lo.pop(); lo.push(p); }
  for(const p of pts.slice().reverse()){ while(up.length >= 2 && cross(up[up.length-2], up[up.length-1], p) <= 0) up.pop(); up.push(p); }
  return lo.slice(0,-1).concat(up.slice(0,-1));
}
let gid = 0;
function nightSVG(v, th, ghost){
  const id = 'g' + (gid++);
  const X = sx => 150 + sx*1.7, Y = z => 148 - z*2.3;
  const lights = v.lights.filter(l => visible(l, th));
  const dots = lights.map(l => { const x = X(proj(l, th)), y = Y(l.z);
    return `<ellipse cx="${x}" cy="${154 + (148-y)*0.06}" rx="3" ry="${5 + (148-y)*0.05}" fill="${LC[l.c]}" opacity=".2" ${l.f ? 'class="flash"' : ''}/><circle cx="${x}" cy="${y}" r="5.5" fill="${LC[l.c]}" filter="url(#${id})" ${l.f ? 'class="flash"' : ''}/>`; }).join('');
  const hull = ghost ? `<polygon points="${hullPts(th).map(([x,z]) => `${X(x)},${Y(z)}`).join(' ')}" fill="#9fb4c4" opacity=".16"/>` + v.lights.filter(l => l.z > 14).map(l => `<line x1="${X(proj(l,th))}" y1="${Y(11)}" x2="${X(proj(l,th))}" y2="${Y(l.z)}" stroke="#9fb4c4" stroke-width="1.5" opacity=".18"/>`).join('') : '';

function shapeSVG(v){

  const d = (s,x,y) => s === 'ball' ? `<circle cx="${x}" cy="${y+12}" r="12" fill="${f}"/>` : s === 'diamond' ? `<polygon points="${x},${y} ${x+12},${y+12} ${x},${y+24} ${x-12},${y+12}" fill="${f}"/>` : s === 'coneUp' ? `<polygon points="${x},${y} ${x+12},${y+24} ${x-12},${y+24}" fill="${f}"/>` : s === 'coneDown' ? `<polygon points="${x-12},${y} ${x+12},${y} ${x},${y+24}" fill="${f}"/>` : `<rect x="${x-9}" y="${y-8}" width="18" height="38" fill="${f}"/>`;

function sectorPath(cx, cy, r, a1, a2){
  const p = a => [cx + r*Math.sin(a*Math.PI/180), cy - r*Math.cos(a*Math.PI/180)];

    <text x="90" y="16" text-anchor="middle" font-size="10" fill="var(--muted)" font-family="Barlow,sans-serif">haluan</text></svg>`;

function seenText(v, th){
  const ls = v.lights.filter(l => visible(l, th));
  if(!ls.length) return 'tidak ada lampu yang terlihat';
  const parts = [];
  const mast = ls.filter(l => l.a === 'mast').length;
  if(mast) parts.push(`${mast} lampu tiang putih`);
  const st = ls.filter(l => l.a === 'stbd').length, pt = ls.filter(l => l.a === 'port').length;
  if(st && pt) parts.push('lampu lambung hijau dan merah'); else if(st) parts.push('lampu lambung hijau'); else if(pt) parts.push('lampu lambung merah');
  ls.filter(l => l.a === 'stern').forEach(l => parts.push(l.c === 'y' ? 'lampu tunda kuning' : 'lampu buritan putih'));
  const ar = ls.filter(l => l.a === 'all');
  if(ar.length) parts.push('lampu keliling ' + ar.slice().sort((a,b) => b.z-a.z).map(l => CNAME[l.c] + (l.f ? ' kedip' : '')).join(', '));

function sectorText(th){

  if(th >= 247.5) return 'Anda berada di sisi kiri (port) kapal itu.';

}

let ac = null, anodes = [], ptimer = null, fastSnd = false;
function actx(){ if(!ac) ac = new (window.AudioContext || window.webkitAudioContext)(); if(ac.state === 'suspended') ac.resume(); return ac; }

  if(tts.on) ttsStop(); stopSnd(); let c; try{ c = actx(); }catch(e){ return; }

const D2R = Math.PI/180;
const a360 = a => ((a % 360) + 360) % 360;
const a180 = a => { a = a360(a); return a > 180 ? a - 360 : a; };
const brgTo = (a, b) => a360(Math.atan2(b.x - a.x, b.y - a.y) / D2R);
const dist = (a, b) => Math.hypot(b.x - a.x, b.y - a.y);

const relTxt = rb => { rb = Math.round(a180(rb)); return rb === 0 ? 'tepat di depan' : Math.abs(rb) === 180 ? 'tepat di belakang' : `${Math.abs(rb)}° ${rb > 0 ? 'kanan' : 'kiri'}`; };

/* Lintasan: posisi dalam mil laut (x timur, y utara), waktu dalam menit, kecepatan dalam knot */
const SDT = 0.05;
function smTrack(sp, dur, cur){
  const cx = cur ? Math.sin(cur.d*D2R)*cur.kn/60 : 0, cy = cur ? Math.cos(cur.d*D2R)*cur.kn/60 : 0;
  let c = a360(sp.c), s = sp.s, x = sp.x || 0, y = sp.y || 0;
  if(sp.meet){ const [mx, my, mt] = sp.meet; x = mx - (Math.sin(c*D2R)*s/60 + cx)*mt; y = my - (Math.cos(c*D2R)*s/60 + cy)*mt; }
  const man = (sp.man || []).slice().sort((a,b) => a.t - b.t);
  let tc = c, ts = s, rot = 30, acc = 3, dir = 0, mi = 0;
  const pts = [], N = Math.ceil(dur/SDT);
  for(let i = 0; i <= N; i++){
    const t = i*SDT;
    while(mi < man.length && man[mi].t <= t + 1e-9){
      const m = man[mi++];
      if(m.c !== undefined){ tc = a360(m.c); rot = m.rot || 30; dir = m.dir === 'R' ? 1 : m.dir === 'L' ? -1 : 0; }
      if(m.s !== undefined){ ts = m.s; acc = m.acc || 3; }
    }
    pts.push({x, y, h:c, s});
    const step = rot*SDT;
    if(c !== tc){
      const rem = dir > 0 ? a360(tc - c) : dir < 0 ? a360(c - tc) : Math.abs(a180(tc - c));
      const sg = dir || Math.sign(a180(tc - c));
      c = rem <= step ? tc : a360(c + sg*step);
    }
    if(s !== ts){ const st = acc*SDT; s = Math.abs(ts - s) <= st ? ts : s + Math.sign(ts - s)*st; }
    x += (Math.sin(c*D2R)*s/60 + cx)*SDT; y += (Math.cos(c*D2R)*s/60 + cy)*SDT;
  }
  return pts;
}
/* Tundaan mengikuti jejak kapal tunda pada jarak tali tunda */
function smFollow(pts, len){
  const cum = [0];
  for(let i = 1; i < pts.length; i++) cum.push(cum[i-1] + Math.hypot(pts[i].x - pts[i-1].x, pts[i].y - pts[i-1].y));
  return pts.map((p, i) => {
    const tg = cum[i] - len;
    if(tg < 0){ const h = pts[0].h*D2R; return {x:pts[0].x + Math.sin(h)*tg, y:pts[0].y + Math.cos(h)*tg, h:pts[0].h, s:p.s}; }
    let lo = 0, hi = i; while(lo < hi){ const m = (lo + hi + 1) >> 1; if(cum[m] <= tg) lo = m; else hi = m - 1; }
    const q = pts[lo+1] || pts[lo], seg = (cum[lo+1] ?? cum[lo]) - cum[lo], f = seg > 0 ? (tg - cum[lo])/seg : 0;
    return {x:pts[lo].x + (q.x - pts[lo].x)*f, y:pts[lo].y + (q.y - pts[lo].y)*f, h:a360(pts[lo].h + a180(q.h - pts[lo].h)*f), s:p.s};
  });
}
function smBuild(vr, all){
  if(vr._b) return vr._b;
  const ships = {}, order = [];
  const base = vr.same && all ? smBuild(all.find(x => x.k === vr.same), all) : null;
  for(let sp of vr.ships){
    if(base && base.ships[sp.id] && !sp.x && !sp.meet){ const p0 = base.ships[sp.id].pts[0]; sp = Object.assign({}, sp, {x:p0.x, y:p0.y}); }
    let pts;
    if(sp.tow) pts = smFollow(ships[sp.tow].pts, sp.len);
    else {
      pts = smTrack(sp, vr.dur, vr.cur);
      if(sp.hit){
        const [oid, ht] = sp.hit, i = Math.round(ht/SDT), o = ships[oid].pts;
        const dx = o[i].x - pts[i].x + (sp.hitOff ? sp.hitOff[0] : 0), dy = o[i].y - pts[i].y + (sp.hitOff ? sp.hitOff[1] : 0);
        pts.forEach(p => { p.x += dx; p.y += dy; });
      }
    }
    ships[sp.id] = {sp, pts}; order.push(sp.id);
  }

}
function smAt(b, id, t){
  const pts = b.ships[id].pts, f = clamp(t/SDT, 0, pts.length - 1), i = Math.floor(f), p = pts[i], q = pts[Math.min(i+1, pts.length-1)], u = f - i;
  return {x:p.x + (q.x - p.x)*u, y:p.y + (q.y - p.y)*u, h:a360(p.h + a180(q.h - p.h)*u), s:p.s + (q.s - p.s)*u};
}
function smCpa(b, a, c, t0=0){
  let best = {d:1e9, t:0};
  const A = b.ships[a].pts, C = b.ships[c].pts, i0 = Math.round(t0/SDT);
  for(let i = i0; i < Math.min(A.length, C.length); i++){ const d = dist(A[i], C[i]); if(d < best.d) best = {d, t:i*SDT}; }
  return best;

function smText(b, st){

    const o = smAt(b, b.own, st.t), p = smAt(b, id, st.t);

    if(k === 'rng') return nf(dist(o, p)) + ' mil';
    return nf(smCpa(b, b.own, id, st.t).d) + ' mil';
  });
}

/* ---------- tampilan dari anjungan ---------- */
const BRW = 600, BRH = 290, BHZ = 118, BFOV = 124, BPPD = BRW/BFOV;
function smAspect(th){ th = a360(th); return th <= 8 || th >= 352 ? 'tampak haluannya, lurus ke arah Anda' : th <= 112.5 ? 'tampak sisi kanannya' : th >= 247.5 ? 'tampak sisi kirinya' : 'tampak buritannya'; }

    return {id, sp, st, d, rb:a180(brgTo(me, st) - hdg), rbo:a180(brgTo(me, st) - me.h), th:a360(brgTo(st, me) - st.h)};

}

    <rect width="${W}" height="${HZ}" fill="url(#k${id})"/><rect y="${HZ}" width="${W}" height="${H - HZ}" fill="url(#w${id})"/>`;
  const seen = [], scr = {}, tk = night ? '#8FB0C6' : fog ? '#46535B' : '#1E3D52';

    const alpha = fog ? clamp((vis - ob.d)/(vis*.5), 0, 1) : 1;

    const u = clamp(1.7*(o.zoom || 1)*(L/150)/Math.max(ob.d, .04), .06, 4), x = W/2 + ob.rb*BPPD, yw = HZ + clamp(9/Math.max(ob.d, .04), .8, 150);

    const th = ob.th;
    if(night){
      if(o.ghost) s += `<polygon points="${hullPts(th).map(([hx,z]) => `${SX(hx)},${SY(z)}`).join(' ')}" fill="#9fb4c4" opacity=".14"/>`;
      const r = clamp(1.4 + u*1.5, 1.6, 6);
      m.lights.filter(l => visible(l, th)).forEach(l => { const lx = SX(proj(l, th)), ly = SY(l.z);
        s += `<ellipse cx="${lx}" cy="${(yw + 2 + (yw - ly)*.05).toFixed(1)}" rx="${(r*.5).toFixed(1)}" ry="${(r + (yw - ly)*.04).toFixed(1)}" fill="${LC[l.c]}" opacity=".18" ${l.f ? 'class="flash"' : ''}/><circle cx="${lx}" cy="${ly}" r="${r.toFixed(1)}" fill="${LC[l.c]}" filter="url(#f${id})" ${l.f ? 'class="flash"' : ''}/>`; });
      const ls = m.lights.filter(l => visible(l, th));
      seen.push(`${ob.id} (${relTxt(ob.rbo)}, ${nf(ob.d)} mil): ${ls.length ? seenText(m, th) : 'tidak ada lampu yang terlihat'}`);
    } else {
      const col = fog ? '#5E6B72' : '#24313A', op = alpha.toFixed(2);
      let g = '';
      if(ob.sp.k === 'barge'){ const hp = hullPts(th).map(([hx,z]) => `${SX(hx*1.05)},${SY(Math.min(z, 7))}`).join(' '); g += `<polygon points="${hp}" fill="${col}"/>`; }
      else {
        g += `<polygon points="${hullPts(th).map(([hx,z]) => `${SX(hx)},${SY(z)}`).join(' ')}" fill="${col}"/>`;
        if(ob.sp.k === 'sail'){
          const mx = proj({x:0, y:8}, th), sd = o.wind !== undefined ? smSailSide(ob.st.h, o.wind) : (ob.sp.sd || 1), be = proj({x:sd*16, y:-22}, th);
          g += `<line x1="${SX(mx)}" y1="${SY(10)}" x2="${SX(mx)}" y2="${SY(58)}" stroke="${col}" stroke-width="${clamp(u*1.2,1,3)}"/><polygon points="${SX(mx)},${SY(56)} ${SX(mx)},${SY(13)} ${SX(be)},${SY(13)}" fill="${fog ? '#C7CED2' : '#F2F4F2'}" stroke="${col}" stroke-width="1"/>`;
        } else {
          const sx = [-7, 7].flatMap(xx => [-30, -14].map(yy => proj({x:xx, y:yy}, th))), a = Math.min(...sx), c = Math.max(...sx);
          g += `<rect x="${SX(a)}" y="${SY(22)}" width="${((c - a)*u).toFixed(1)}" height="${(11*u).toFixed(1)}" fill="${col}"/>`;
          const masts = m.lights.filter(l => l.a === 'mast' || (l.a === 'all' && l.z > 14));
          const tops = {}; masts.forEach(l => { const k2 = Math.round(proj(l, th)); tops[k2] = Math.max(tops[k2] || 0, l.z); });
          if(!masts.length) tops[Math.round(proj({x:0, y:10}, th))] = 28;
          Object.entries(tops).forEach(([mx, z]) => { g += `<line x1="${SX(+mx)}" y1="${SY(11)}" x2="${SX(+mx)}" y2="${SY(z + 4)}" stroke="${col}" stroke-width="${clamp(u*1.1, 1, 3)}"/>`; });
          if(m.sh.length){
            const mx = proj({x:0, y:10}, th), sz = Math.max(3.2, 3.6*u), cxs = +SX(mx), top = +SY(40);
            g += `<line x1="${cxs}" y1="${SY(11)}" x2="${cxs}" y2="${(top - 2).toFixed(1)}" stroke="${col}" stroke-width="${clamp(u*1.1, 1, 3)}"/>`;
            if(m.tri){ g += `<circle cx="${cxs}" cy="${top}" r="${sz}" fill="#0B1218"/><circle cx="${cxs - sz*2.6}" cy="${top + sz*3}" r="${sz}" fill="#0B1218"/><circle cx="${cxs + sz*2.6}" cy="${top + sz*3}" r="${sz}" fill="#0B1218"/>`; }
            else { const gap = m.sh[0] === 'coneDown' && m.sh[1] === 'coneUp' ? 0 : sz*.8; let yy = top;
              m.sh.forEach(shp => { const q = sz;
                g += shp === 'ball' ? `<circle cx="${cxs}" cy="${yy + q}" r="${q}" fill="#0B1218"/>` : shp === 'diamond' ? `<polygon points="${cxs},${yy} ${cxs + q},${yy + q} ${cxs},${yy + 2*q} ${cxs - q},${yy + q}" fill="#0B1218"/>` : shp === 'coneUp' ? `<polygon points="${cxs},${yy} ${cxs + q},${yy + 2*q} ${cxs - q},${yy + 2*q}" fill="#0B1218"/>` : shp === 'coneDown' ? `<polygon points="${cxs - q},${yy} ${cxs + q},${yy} ${cxs},${yy + 2*q}" fill="#0B1218"/>` : `<rect x="${cxs - q*.75}" y="${yy}" width="${q*1.5}" height="${q*3}" fill="#0B1218"/>`;
                yy += (shp === 'cyl' ? 3*q : 2*q) + gap; }); }
          }
        }
      }
      s += `<g opacity="${op}">${g}</g>`;
      if(!fog || ob.d < vis) seen.push(`${ob.id} (${relTxt(ob.rbo)}, ${nf(ob.d)} mil): ${smAspect(th)}${m.sh.length && !fog ? ', ada sosok di tiangnya' : ''}`);

  for(const ob of objs){ if(ob.sp.tow && scr[ob.id] && scr[ob.sp.tow] && !night){ const a = scr[ob.id], c = scr[ob.sp.tow]; s += `<line x1="${a.x}" y1="${a.yw - 4*a.u}" x2="${c.x}" y2="${c.yw - 4*c.u}" stroke="${fog ? '#5E6B72' : '#24313A'}" stroke-width="1"/>`; } }
  if(fog) s += `<rect width="${W}" height="${H}" fill="#C3CACE" opacity=".35"/>`;

  s += `<text x="${W/2}" y="21" text-anchor="middle" font-size="12" font-weight="600" fill="${tk}" font-family="Barlow,sans-serif">${o.look ? 'Pandangan ke belakang' : 'Haluan ' + d3(hdg)}</text>`;
  const bc = night ? '#0E1A24' : fog ? '#46525A' : '#33414B', be = night ? '#1E3344' : fog ? '#5D6A72' : '#4A5965';
  s += o.look
    ? `<polygon points="${W/2 - 210},${H} ${W/2 + 210},${H} ${W/2 + 170},${H - 26} ${W/2 - 170},${H - 26}" fill="${bc}"/><line x1="${W/2 - 170}" y1="${H - 26}" x2="${W/2 + 170}" y2="${H - 26}" stroke="${be}" stroke-width="3"/>`
    : `<polygon points="${W/2 - 190},${H} ${W/2 + 190},${H} ${W/2 + 26},${H - 62} ${W/2},${H - 70} ${W/2 - 26},${H - 62}" fill="${bc}"/><polyline points="${W/2 - 190},${H} ${W/2 - 26},${H - 62} ${W/2},${H - 70} ${W/2 + 26},${H - 62} ${W/2 + 190},${H}" fill="none" stroke="${be}" stroke-width="2"/><line x1="${W/2}" y1="${H - 70}" x2="${W/2}" y2="${H - 96}" stroke="${be}" stroke-width="2"/>`;
  const lab = fog ? 'Kabut: kapal lain tidak terlihat kecuali sangat dekat.' : seen.length ? 'Terlihat: ' + seen.join('; ') + '.' : 'Tidak ada kapal di depan pandangan.';
  return {svg:`<svg class="smsvg smbr" viewBox="0 0 ${W} ${H}" role="img" aria-label="Pandangan dari anjungan ${o.obs}. ${esc(lab)}">${s}</svg>`, seen};
}

/* ---------- layar radar (PPI, north-up, gerak relatif) ---------- */
function smPPI(o){
  const S = 260, C = 130, R = 116, k = R/o.range, cid = 'pc' + (gid++);
  const P = p => [(C + p.x*k).toFixed(1), (C - p.y*k).toFixed(1)];
  let s = `<defs><clipPath id="${cid}"><circle cx="${C}" cy="${C}" r="${R}"/></clipPath><filter id="e${cid}" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="1.4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
  <circle cx="${C}" cy="${C}" r="${R + 12}" class="pp-rim"/><circle cx="${C}" cy="${C}" r="${R}" class="pp-bg"/>`;
  for(let r = o.ring; r < o.range + 1e-9; r += o.ring) s += `<circle cx="${C}" cy="${C}" r="${(r*k).toFixed(1)}" class="pp-ring"/>`;
  for(let a = 0; a < 360; a += 10){ const r1 = a % 30 ? R + 3 : R, r2 = R + 9; s += `<line x1="${C + Math.sin(a*D2R)*r1}" y1="${C - Math.cos(a*D2R)*r1}" x2="${C + Math.sin(a*D2R)*r2}" y2="${C - Math.cos(a*D2R)*r2}" class="pp-tick"/>`; }
  [[0,'000'],[90,'090'],[180,'180'],[270,'270']].forEach(([a, l]) => { s += `<text x="${C + Math.sin(a*D2R)*(R - 11)}" y="${C - Math.cos(a*D2R)*(R - 11)}" class="pp-txt" text-anchor="middle" dominant-baseline="central">${l}</text>`; });
  s += `<line x1="${C}" y1="${C}" x2="${(C + Math.sin(o.hdg*D2R)*R).toFixed(1)}" y2="${(C - Math.cos(o.hdg*D2R)*R).toFixed(1)}" class="pp-hl"/>`;
  let inner = '';
  (o.lines || []).forEach(l => { const [ax, ay] = P(l.a), [bx, by] = P(l.b); inner += `<line x1="${ax}" y1="${ay}" x2="${bx}" y2="${by}" class="pp-line ${l.c || ''}"/>`; });
  (o.marks || []).forEach(m => { const [x, y] = P(m); inner += `<circle cx="${x}" cy="${y}" r="4" class="pp-mark"/>${m.l ? `<text x="${+x + 7}" y="${+y - 6}" class="pp-mtxt">${m.l}</text>` : ''}`; });
  (o.echoes || []).forEach(e => { e.pts.forEach((p, i) => { const [x, y] = P(p), last = i === e.pts.length - 1; inner += `<circle cx="${x}" cy="${y}" r="${last ? 3.6 : 2.4}" class="pp-echo" opacity="${last ? 1 : .35 + .4*i/e.pts.length}" ${last ? `filter="url(#e${cid})"` : ''}/>`; if(last && e.l) inner += `<text x="${+x + 7}" y="${+y + 4}" class="pp-etxt">${e.l}</text>`; }); });
  s += `<g clip-path="url(#${cid})">${inner}</g><circle cx="${C}" cy="${C}" r="3" class="pp-own"/>`;
  return `<svg class="ppi" viewBox="0 0 ${S} ${S}" role="img" aria-label="${esc(o.label || 'Layar radar')}">${s}</svg><p class="pp-cap">Jarak ${o.range} mil, cincin tiap ${nf(o.ring, o.ring % 1 ? 1 : 0)} mil, utara di atas</p>`;
}
