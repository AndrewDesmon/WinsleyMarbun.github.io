{k:'g',en:`Vessels of less than 12 metres in length, except those engaged in diving operations, shall not be required to exhibit the lights and shapes prescribed in this Rule.`,id:`Kapal dengan panjang kurang dari 12 meter, kecuali yang mendukung penyelaman, tidak diwajibkan menunjukkan lampu dan sosok menurut aturan ini.`,ex:`Pengecualian untuk kapal kecil, kecuali perahu selam.`},
{k:'h',en:`The signals prescribed in this Rule are not signals of vessels in distress and requiring assistance. Such signals are contained in Annex IV to these Regulations.`,id:`Isyarat dalam aturan ini bukan isyarat kapal dalam bahaya yang membutuhkan pertolongan. Isyarat tersebut tercantum dalam Annex IV.`,ex:`NUC tidak sama dengan "minta tolong". Untuk minta tolong gunakan isyarat bahaya Annex IV.`}
],
q:[
[`Merah-putih-merah keliling dalam satu garis tegak menunjukkan…`,[`Kapal RAM`,`Kapal NUC`,`Kapal CBD`,`Kapal pandu`],`Aturan 27(b)(i).`],
[`Kapal keruk menandai sisi yang aman dilewati dengan…`,[`Dua hijau keliling atau dua belah ketupat`,`Dua merah keliling atau dua bola`,`Satu putih keliling`,`Kerucut puncak ke atas`],`Aturan 27(d)(ii).`],
[`Tiga hijau keliling menandakan kapal pembersih ranjau. Jarak aman yang harus dijaga adalah…`,[`1000 m`,`500 m`,`200 m`,`2 mil`],`Aturan 27(f).`]
]});

rule({n:28,p:'C',t:`Kapal yang terkendala oleh saratnya`,en:`Vessels constrained by their Draught`,tool:[['tebak','Tebak lampu dan sosok']],
sum:`CBD boleh menambah tiga merah keliling vertikal atau satu silinder pada lampu kapal tenaga.`,
mn:`"Tiga merah, kapal dalam; silinder, sarat tinggi."`,
rel:[3,18],
subs:[
{k:'',en:`A vessel constrained by her draught may, in addition to the lights prescribed for power-driven vessels in Rule 23, exhibit where they can best be seen three all-round red lights in a vertical line, or a cylinder.`,id:`Kapal yang terkendala oleh saratnya, selain lampu kapal tenaga Aturan 23, boleh menunjukkan di tempat yang paling mudah terlihat tiga lampu merah keliling dalam satu garis tegak, atau satu silinder.`,ex:`Kata "may" (boleh): isyarat CBD tidak wajib, tetapi tanpa isyarat ini kapal lain tidak terikat Aturan 18(d).`,uj:`Hanya jika isyarat Aturan 28 ditunjukkan, kapal lain wajib menghindari menghalangi CBD (Aturan 18(d)).`}
],
q:[
[`Isyarat malam kapal CBD adalah…`,[`Tiga merah keliling vertikal`,`Dua merah keliling vertikal`,`Merah-putih-merah`,`Putih di atas merah`],`Aturan 28.`],
[`Isyarat siang kapal CBD adalah…`,[`Satu silinder`,`Satu bola`,`Belah ketupat`,`Dua kerucut`],`Aturan 28.`],
[`Apakah isyarat CBD wajib ditunjukkan?`,[`Tidak, "may" (boleh), tetapi perlu agar Aturan 18(d) berlaku`,`Ya, selalu wajib`,`Hanya siang hari`,`Hanya di dalam TSS`],`Aturan 28 memakai kata "may".`]
]});

rule({n:29,p:'C',t:`Kapal pandu`,en:`Pilot Vessels`,tool:[['tebak','Tebak lampu dan sosok']],
sum:`Kapal pandu yang bertugas: putih di atas merah keliling di puncak tiang, plus lambung dan buritan saat berlayar, atau lampu jangkar saat berlabuh. Saat tidak bertugas: lampu kapal biasa.`,
mn:`"White over red, pilot ahead."`,
rel:[30,35],
subs:[
{k:'a',en:`A vessel engaged on pilotage duty shall exhibit:
(i) at or near the masthead, two all-round lights in a vertical line, the upper being white and the lower red;
(ii) when underway, in addition, sidelights and a sternlight;
(iii) when at anchor, in addition to the lights prescribed in sub-paragraph (i), the light, lights or shape prescribed in Rule 30 for vessels at anchor.`,
id:`Kapal yang sedang bertugas memandu harus menunjukkan:
(i) di atau dekat puncak tiang, dua lampu keliling dalam satu garis tegak, yang atas putih dan yang bawah merah;
(ii) saat berlayar, sebagai tambahan, lampu lambung dan lampu buritan;
(iii) saat berlabuh, selain lampu pada (i), lampu atau sosok kapal berlabuh menurut Aturan 30.`,
ex:`Kapal pandu yang bertugas tidak menunjukkan lampu tiang, meskipun ia kapal tenaga.`},
{k:'b',en:`A pilot vessel when not engaged on pilotage duty shall exhibit the lights or shapes prescribed for a similar vessel of her length.`,id:`Kapal pandu yang tidak sedang bertugas memandu harus menunjukkan lampu atau sosok untuk kapal sejenis seukurannya.`,ex:`Pulang ke pangkalan = lampu kapal tenaga biasa.`}
],
q:[
[`Putih di atas merah keliling menunjukkan…`,[`Kapal pandu yang bertugas`,`Kapal menangkap ikan`,`Kapal NUC`,`Kapal berlabuh`],`Aturan 29(a)(i).`],
[`Kapal pandu yang bertugas dan berlabuh menunjukkan…`,[`Putih di atas merah ditambah lampu jangkar`,`Lampu jangkar saja`,`Dua merah keliling`,`Lampu tiang dan lambung`],`Aturan 29(a)(iii).`],
[`Kapal pandu yang tidak bertugas menunjukkan…`,[`Lampu untuk kapal sejenis seukurannya`,`Putih di atas merah`,`Tidak ada lampu`,`Lampu kuning kedip`],`Aturan 29(b).`]
]});

rule({n:30,p:'C',t:`Kapal berlabuh dan kandas`,en:`Anchored Vessels and Vessels aground`,tool:[['tebak','Tebak lampu dan sosok'],['pasang','Pasang lampu']],
sum:`Berlabuh: putih keliling depan, putih keliling lebih rendah di buritan (<50 m cukup satu); siang satu bola. Kapal ≥100 m wajib lampu kerja geladak. Kandas: lampu jangkar + dua merah keliling; siang tiga bola.`,
mn:`"Satu bola berlabuh, tiga bola kandas."`,
rel:[27,35],
subs:[
{k:'a',en:`A vessel at anchor shall exhibit where it can best be seen:
(i) in the fore part, an all-round white light or one ball;
(ii) at or near the stern and at a lower level than the light prescribed in sub-paragraph (i), an all-round white light.`,id:`Kapal yang berlabuh jangkar harus menunjukkan di tempat yang paling mudah terlihat:
(i) di bagian depan, satu lampu keliling putih atau satu bola;
(ii) di atau dekat buritan dan lebih rendah dari lampu pada (i), satu lampu keliling putih.`,ex:`Lampu depan lebih tinggi dari lampu belakang: kebalikan dari lampu tiang kapal yang berlayar.`},
{k:'b',en:`A vessel of less than 50 metres in length may exhibit an all-round white light where it can best be seen instead of the lights prescribed in paragraph (a) of this Rule.`,id:`Kapal dengan panjang kurang dari 50 meter boleh menunjukkan satu lampu keliling putih di tempat yang paling mudah terlihat sebagai ganti lampu pada paragraf (a).`,ex:`Satu putih keliling cukup untuk kapal di bawah 50 m.`},
{k:'c',en:`A vessel at anchor may, and a vessel of 100 metres and more in length shall, also use the available working or equivalent lights to illuminate her decks.`,id:`Kapal yang berlabuh boleh, dan kapal dengan panjang 100 meter atau lebih wajib, juga menggunakan lampu kerja atau lampu setara untuk menerangi geladaknya.`,ex:`Geladak yang terang menunjukkan ukuran kapal besar yang berlabuh.`},
{k:'d',en:`A vessel aground shall exhibit the lights prescribed in paragraph (a) or (b) of this Rule and in addition, where they can best be seen:
(i) two all-round red lights in a vertical line;
(ii) three balls in a vertical line.`,id:`Kapal yang kandas harus menunjukkan lampu pada paragraf (a) atau (b) dan sebagai tambahan, di tempat yang paling mudah terlihat:
(i) dua lampu merah keliling dalam satu garis tegak;
(ii) tiga bola dalam satu garis tegak.`,ex:`Kandas = lampu jangkar + "NUC". Siang: tiga bola. Kapal kandas juga menandakan perairan dangkal di sekitarnya.`},
{k:'e',en:`A vessel of less than 7 metres in length, when at anchor, not in or near a narrow channel, fairway or anchorage, or where other vessels normally navigate, shall not be required to exhibit the lights or shape prescribed in paragraphs (a) and (b) of this Rule.`,id:`Kapal dengan panjang kurang dari 7 meter yang berlabuh tidak di dalam atau dekat alur sempit, alur masuk, tempat berlabuh, atau tempat yang biasa dilayari kapal lain, tidak diwajibkan menunjukkan lampu atau sosok pada paragraf (a) dan (b).`,ex:`Perahu kecil yang berlabuh jauh dari lalu lintas tidak wajib lampu jangkar.`},
{k:'f',en:`A vessel of less than 12 metres in length, when aground, shall not be required to exhibit the lights or shapes prescribed in sub-paragraphs (d)(i) and (ii) of this Rule.`,id:`Kapal dengan panjang kurang dari 12 meter yang kandas tidak diwajibkan menunjukkan lampu atau sosok pada sub-paragraf (d)(i) dan (ii).`,ex:`Perahu kecil yang kandas tidak wajib dua merah dan tiga bola.`}
],
q:[
[`Siang hari Anda melihat tiga bola hitam vertikal. Kapal itu…`,[`Kandas`,`Berlabuh`,`NUC`,`RAM`],`Aturan 30(d)(ii).`],
[`Pada kapal berlabuh ≥50 m, lampu jangkar depan dibandingkan lampu belakang…`,[`Lebih tinggi`,`Lebih rendah`,`Sama tinggi`,`Bebas`],`Aturan 30(a)(ii): lampu buritan lebih rendah.`],
[`Kapal berlabuh yang wajib menerangi geladaknya adalah kapal dengan panjang…`,[`100 m atau lebih`,`50 m atau lebih`,`20 m atau lebih`,`Semua kapal`],`Aturan 30(c).`]
]});

rule({n:31,p:'C',t:`Pesawat laut`,en:`Seaplanes`,
sum:`Pesawat laut dan WIG yang tidak bisa memasang lampu dan sosok persis sesuai aturan harus memakai yang semirip mungkin.`,
mn:`"Tidak bisa persis? Semirip mungkin."`,
rel:[3,18,23],
subs:[
{k:'',en:`Where it is impracticable for a seaplane or a WIG craft to exhibit lights and shapes of the characteristics or in the positions prescribed in the Rules of this Part she shall exhibit lights and shapes as closely similar in characteristics and position as is possible.`,id:`Bila pesawat laut atau wahana WIG tidak dapat menunjukkan lampu dan sosok dengan karakteristik atau posisi menurut aturan Bagian ini, ia harus menunjukkan lampu dan sosok yang karakteristik dan posisinya semirip mungkin.`,ex:`Sayap dan bentuk pesawat membuat pemasangan lampu standar sulit; prinsipnya semirip mungkin.`}
],
q:[
[`Pesawat laut yang tidak bisa memasang lampu persis sesuai aturan harus…`,[`Memasang lampu yang semirip mungkin`,`Tidak memasang lampu`,`Hanya bergerak siang hari`,`Memasang lampu kuning kedip`],`Aturan 31.`],
[`Aturan 31 berlaku untuk…`,[`Pesawat laut dan WIG`,`Hovercraft`,`Kapal selam`,`Kapal layar`],`Aturan 31.`],
[`Prinsip Aturan 31 mirip dengan Aturan…`,[`1(e): kapal khusus memenuhi semirip mungkin`,`13: menyusul`,`19: tampak terbatas`,`34: isyarat olah gerak`],`Keduanya memakai prinsip "closest possible compliance".`]
]});

rule({n:32,p:'D',t:`Definisi`,en:`Definitions`,tool:[['suara','Dengar isyarat suara']],
sum:`Suling adalah alat isyarat suara sesuai Annex III. Tiupan pendek sekitar 1 detik, tiupan panjang 4 sampai 6 detik.`,
mn:`"Pendek satu, panjang empat sampai enam."`,
rel:[33,34,35],
subs:[
{k:'a',en:`The word "whistle" means any sound signalling appliance capable of producing the prescribed blasts and which complies with the specifications in Annex III to these Regulations.`,id:`Kata "suling" berarti setiap alat isyarat suara yang mampu menghasilkan tiupan yang ditentukan dan memenuhi spesifikasi Annex III.`,ex:`Suling kapal (horn) tidak harus berbentuk peluit; yang penting memenuhi standar Annex III.`},
{k:'b',en:`The term "short blast" means a blast of about one second's duration.`,id:`Istilah "tiupan pendek" berarti tiupan yang lamanya sekitar satu detik.`,ex:`Sekitar 1 detik.`},
{k:'c',en:`The term "prolonged blast" means a blast of from four to six seconds' duration.`,id:`Istilah "tiupan panjang" berarti tiupan yang lamanya empat sampai enam detik.`,ex:`4 sampai 6 detik. Dokumen sumber tertulis "seconds's"; teks resmi "seconds'".`}
],
q:[
[`Tiupan pendek berlangsung sekitar…`,[`1 detik`,`2 detik`,`4 detik`,`0,5 detik`],`Aturan 32(b).`],
[`Tiupan panjang berlangsung…`,[`4 sampai 6 detik`,`2 sampai 3 detik`,`8 sampai 10 detik`,`1 detik`],`Aturan 32(c).`],
[`Spesifikasi teknis suling diatur di…`,[`Annex III`,`Annex I`,`Annex II`,`Annex IV`],`Aturan 32(a).`]
]});

rule({n:33,p:'D',t:`Perlengkapan isyarat suara`,en:`Equipment for Sound Signals`,
sum:`≥12 m: suling. ≥20 m: suling dan bel. ≥100 m: suling, bel, dan gong. <12 m: alat lain yang efektif.`,
mn:`"12 suling, 20 bel, 100 gong."`,
rel:[32,35],
subs:[
{k:'a',en:`A vessel of 12 metres or more in length shall be provided with a whistle, a vessel of 20 metres or more in length shall be provided with a bell in addition to a whistle, and a vessel of 100 metres or more in length shall, in addition, be provided with a gong, the tone and sound of which cannot be confused with that of the bell. The whistle, bell and gong shall comply with the specifications in Annex III to these Regulations. The bell or gong or both may be replaced by other equipment having the same respective sound characteristics, provided that manual sounding of the prescribed signals shall always be possible.`,id:`Kapal dengan panjang 12 meter atau lebih harus dilengkapi suling; kapal 20 meter atau lebih harus dilengkapi bel selain suling; dan kapal 100 meter atau lebih harus dilengkapi pula gong yang nada dan bunyinya tidak dapat dikacaukan dengan bel. Suling, bel, dan gong harus memenuhi spesifikasi Annex III. Bel atau gong atau keduanya boleh diganti peralatan lain dengan karakteristik bunyi yang sama, asalkan isyarat yang ditentukan selalu dapat dibunyikan secara manual.`,ex:`Bel dan gong elektronik boleh, tetapi harus tetap bisa dibunyikan manual saat listrik padam.`},
{k:'b',en:`A vessel of less than 12 metres in length shall not be obliged to carry the sound signalling appliances prescribed in paragraph (a) of this Rule but if she does not, she shall be provided with some other means of making an efficient sound signal.`,id:`Kapal dengan panjang kurang dari 12 meter tidak wajib membawa alat isyarat suara pada paragraf (a), tetapi bila tidak membawanya, ia harus memiliki sarana lain untuk membuat isyarat suara yang efektif.`,ex:`Misalnya terompet gas genggam.`}
],
q:[
[`Kapal 60 m wajib dilengkapi…`,[`Suling dan bel`,`Suling saja`,`Suling, bel, dan gong`,`Bel saja`],`Aturan 33(a): ≥20 m suling + bel; gong mulai 100 m.`],
[`Gong wajib untuk kapal dengan panjang…`,[`100 m atau lebih`,`50 m atau lebih`,`20 m atau lebih`,`12 m atau lebih`],`Aturan 33(a).`],
[`Kapal 10 m tanpa suling harus memiliki…`,[`Sarana lain untuk isyarat suara yang efektif`,`Gong`,`Lampu sorot`,`Tidak perlu apa pun`],`Aturan 33(b).`]
]});

rule({n:34,p:'D',t:`Isyarat olah gerak dan peringatan`,en:`Manoeuvring and Warning Signals`,tool:[['suara','Dengar isyarat suara'],['tebaks','Tebak isyarat']],
sum:`Saling melihat: 1 pendek kanan, 2 pendek kiri, 3 pendek mundur (boleh dengan kedipan lampu). Alur sempit: 2 panjang + 1/2 pendek untuk menyusul, panjang-pendek-panjang-pendek setuju. Ragu: minimal 5 pendek cepat. Tikungan: 1 panjang.`,
mn:`"Satu kanan, dua kiri, tiga mundur, lima ragu."`,
rel:[9,17,32,35],
subs:[
{k:'a',en:`When vessels are in sight of one another, a power-driven vessel underway, when manoeuvring as authorized or required by these Rules, shall indicate that manoeuvre by the following signals on her whistle:
– one short blast to mean "I am altering my course to starboard";
– two short blasts to mean "I am altering my course to port";
– three short blasts to mean "I am operating astern propulsion".`,
id:`Bila kapal-kapal saling melihat, kapal tenaga yang sedang berlayar, saat berolah gerak sebagaimana diizinkan atau diwajibkan aturan-aturan ini, harus menyatakan olah gerak itu dengan isyarat suling berikut:
– satu tiupan pendek berarti "Saya mengubah haluan ke kanan";
– dua tiupan pendek berarti "Saya mengubah haluan ke kiri";
– tiga tiupan pendek berarti "Mesin saya bekerja mundur".`,
ex:`Wajib bagi kapal tenaga yang saling melihat saat berolah gerak. Isyarat diberikan saat berolah gerak, bukan sekadar niat.`,
uj:`"Operating astern propulsion" berarti mesin mundur bekerja; kapal belum tentu sudah bergerak mundur.`},
{k:'b',en:`Any vessel may supplement the whistle signals prescribed in paragraph (a) of this Rule by light signals, repeated as appropriate, whilst the manoeuvre is being carried out:
(i) these light signals shall have the following significance:
– one flash to mean "I am altering my course to starboard";
– two flashes to mean "I am altering my course to port";
– three flashes to mean "I am operating astern propulsion";
(ii) the duration of each flash shall be about one second, the interval between flashes shall be about one second, and the interval between successive signals shall be not less than ten seconds;
(iii) the light used for this signal shall, if fitted, be an all-round white light, visible at a minimum range of 5 miles, and shall comply with the provisions of Annex I to these Regulations.`,
id:`Setiap kapal boleh melengkapi isyarat suling pada paragraf (a) dengan isyarat cahaya, diulang seperlunya selama olah gerak berlangsung:
(i) arti isyarat cahaya:
– satu kedipan berarti "Saya mengubah haluan ke kanan";
– dua kedipan berarti "Saya mengubah haluan ke kiri";
– tiga kedipan berarti "Mesin saya bekerja mundur";
(ii) lama setiap kedipan sekitar satu detik, selang antar kedipan sekitar satu detik, dan selang antar isyarat berturut-turut tidak kurang dari sepuluh detik;
(iii) lampu yang dipakai, bila dipasang, harus lampu putih keliling yang tampak minimal 5 mil dan memenuhi ketentuan Annex I.`,
ex:`Lampu olah gerak membantu bila suara suling tidak terdengar, misalnya karena angin.`},
{k:'c',en:`When in sight of one another in a narrow channel or fairway:
(i) a vessel intending to overtake another shall in compliance with Rule 9(e)(i) indicate her intention by the following signals on her whistle:
– two prolonged blasts followed by one short blast to mean "I intend to overtake you on your starboard side";
– two prolonged blasts followed by two short blasts to mean "I intend to overtake you on your port side";
(ii) the vessel about to be overtaken when acting in accordance with Rule 9(e)(i) shall indicate her agreement by the following signal on her whistle:
– one prolonged, one short, one prolonged and one short blast, in that order.`,
id:`Bila saling melihat di alur sempit atau alur masuk:
(i) kapal yang bermaksud menyusul kapal lain, sesuai Aturan 9(e)(i), harus menyatakan maksudnya dengan isyarat suling:
– dua tiupan panjang diikuti satu tiupan pendek berarti "Saya bermaksud menyusul Anda di sisi kanan Anda";
– dua tiupan panjang diikuti dua tiupan pendek berarti "Saya bermaksud menyusul Anda di sisi kiri Anda";
(ii) kapal yang akan disusul, bila bertindak sesuai Aturan 9(e)(i), harus menyatakan persetujuannya dengan isyarat: satu panjang, satu pendek, satu panjang, dan satu pendek, berurutan.`,
ex:`Jumlah tiupan pendek sama dengan isyarat olah gerak: 1 = kanan, 2 = kiri. Jawaban setuju berbunyi seperti huruf C dalam Morse ("Charlie" = ya).`},
{k:'d',en:`When vessels in sight of one another are approaching each other and from any cause either vessel fails to understand the intentions or actions of the other, or is in doubt whether sufficient action is being taken by the other to avoid collision, the vessel in doubt shall immediately indicate such doubt by giving at least five short and rapid blasts on the whistle. Such signal may be supplemented by a light signal of at least five short and rapid flashes.`,id:`Bila kapal-kapal yang saling melihat saling mendekat dan karena sebab apa pun salah satunya tidak memahami maksud atau tindakan kapal lain, atau ragu apakah kapal lain sudah bertindak cukup untuk menghindari tubrukan, kapal yang ragu harus segera menyatakan keraguannya dengan sekurang-kurangnya lima tiupan pendek dan cepat. Isyarat ini boleh dilengkapi isyarat cahaya sekurang-kurangnya lima kedipan pendek dan cepat.`,ex:`Isyarat "Hei! Apa maksud Anda?" Sering dibunyikan kapal stand-on sebelum bertindak menurut Aturan 17(a)(ii).`},
{k:'e',en:`A vessel nearing a bend or an area of a channel or fairway where other vessels may be obscured by an intervening obstruction shall sound one prolonged blast. Such signal shall be answered with a prolonged blast by any approaching vessel that may be within hearing around the bend or behind the intervening obstruction.`,id:`Kapal yang mendekati tikungan atau bagian alur di mana kapal lain mungkin tidak terlihat karena terhalang, harus membunyikan satu tiupan panjang. Isyarat ini harus dijawab dengan satu tiupan panjang oleh kapal yang mendekat dan mendengarnya di balik tikungan atau rintangan.`,ex:`Seperti klakson di tikungan gunung.`},
{k:'f',en:`If whistles are fitted on a vessel at a distance apart of more than 100 metres, one whistle only shall be used for giving manoeuvring and warning signals.`,id:`Bila suling dipasang pada kapal dengan jarak antar suling lebih dari 100 meter, hanya satu suling yang boleh dipakai untuk isyarat olah gerak dan peringatan.`,ex:`Dua suling berjauhan yang berbunyi bersamaan bisa terdengar seperti dua kapal.`}
],
q:[
[`Dua tiupan pendek berarti…`,[`Saya mengubah haluan ke kiri`,`Saya mengubah haluan ke kanan`,`Mesin saya bekerja mundur`,`Saya ragu`],`Aturan 34(a).`],
[`Di alur sempit, dua panjang diikuti satu pendek berarti…`,[`Saya bermaksud menyusul di sisi kanan Anda`,`Saya bermaksud menyusul di sisi kiri Anda`,`Saya setuju`,`Saya mendekati tikungan`],`Aturan 34(c)(i).`],
[`Selang antar isyarat cahaya olah gerak berturut-turut minimal…`,[`10 detik`,`2 detik`,`1 menit`,`5 detik`],`Aturan 34(b)(ii).`]
]});

rule({n:35,p:'D',t:`Isyarat suara dalam tampak terbatas`,en:`Sound Signals in Restricted Visibility`,tool:[['suara','Dengar isyarat suara'],['kabut','Mode kabut']],
lead:{en:`In or near an area of restricted visibility, whether by day or night, the signals prescribed in this Rule shall be used as follows:`,id:`Di dalam atau dekat area tampak terbatas, siang maupun malam, isyarat dalam aturan ini harus digunakan sebagai berikut:`},
sum:`Kapal tenaga laju: 1 panjang/≤2 menit. Berhenti: 2 panjang. NUC, RAM, CBD, layar, ikan, tunda: 1 panjang 2 pendek. Ditunda: 1 panjang 3 pendek. Berlabuh: bel 5 detik/≤1 menit (≥100 m + gong). Kandas: 3 ketukan + bel + 3 ketukan. Pandu: boleh 4 pendek.`,
mn:`"Satu jalan, dua diam, satu-dua istimewa, satu-tiga ditarik."`,
rel:[19,32,33,34],
subs:[
{k:'a',en:`A power-driven vessel making way through the water shall sound at intervals of not more than 2 minutes one prolonged blast.`,id:`Kapal tenaga yang laju di air harus membunyikan satu tiupan panjang dengan selang tidak lebih dari 2 menit.`,ex:`Satu panjang = "Saya kapal tenaga dan sedang bergerak."`},
{k:'b',en:`A power-driven vessel underway but stopped and making no way through the water shall sound at intervals of not more than 2 minutes two prolonged blasts in succession with an interval of about 2 seconds between them.`,id:`Kapal tenaga yang berlayar tetapi berhenti dan tidak laju di air harus membunyikan dua tiupan panjang berturut-turut dengan selang sekitar 2 detik, setiap tidak lebih dari 2 menit.`,ex:`Dua panjang = "Saya kapal tenaga, underway tetapi tidak bergerak."`},
{k:'c',en:`A vessel not under command, a vessel restricted in her ability to manoeuvre, a vessel constrained by her draught, a sailing vessel, a vessel engaged in fishing and a vessel engaged in towing or pushing another vessel shall, instead of the signals prescribed in paragraphs (a) or (b) of this Rule, sound at intervals of not more than 2 minutes three blasts in succession, namely one prolonged followed by two short blasts.`,id:`Kapal NUC, kapal RAM, kapal CBD, kapal layar, kapal yang sedang menangkap ikan, dan kapal yang sedang menunda atau mendorong kapal lain, sebagai ganti isyarat pada (a) atau (b), harus membunyikan tiga tiupan berturut-turut, yaitu satu panjang diikuti dua pendek, setiap tidak lebih dari 2 menit.`,ex:`Satu isyarat untuk semua kapal "istimewa". Anda tidak tahu persis jenisnya, tetapi tahu ia sulit menyingkir.`},
{k:'d',en:`A vessel engaged in fishing, when at anchor, and a vessel restricted in her ability to manoeuvre when carrying out her work at anchor, shall instead of the signals prescribed in paragraph (g) of this Rule sound the signal prescribed in paragraph (c) of this Rule.`,id:`Kapal yang menangkap ikan saat berlabuh, dan kapal RAM yang bekerja saat berlabuh, sebagai ganti isyarat pada paragraf (g), harus membunyikan isyarat pada paragraf (c).`,ex:`Bukan bel jangkar, tetapi 1 panjang 2 pendek.`},
{k:'e',en:`A vessel towed or if more than one vessel is towed the last vessel of the tow, if manned, shall at intervals of not more than 2 minutes sound four blasts in succession, namely one prolonged followed by three short blasts. When practicable, this signal shall be made immediately after the signal made by the towing vessel.`,id:`Kapal yang ditunda, atau bila lebih dari satu kapal yang ditunda, kapal terakhir dalam tundaan, bila berawak, harus membunyikan empat tiupan berturut-turut, yaitu satu panjang diikuti tiga pendek, setiap tidak lebih dari 2 menit. Bila memungkinkan, isyarat ini dibunyikan segera setelah isyarat kapal penunda.`,ex:`Penunda: 1 panjang 2 pendek; segera disusul tundaan: 1 panjang 3 pendek. Anda tahu ada tali panjang di antara keduanya.`},
{k:'f',en:`When a pushing vessel and a vessel being pushed ahead are rigidly connected in a composite unit they shall be regarded as a power-driven vessel and shall give the signals prescribed in paragraphs (a) or (b) of this Rule.`,id:`Bila kapal pendorong dan kapal yang didorong terhubung kaku sebagai unit gabungan, keduanya dianggap kapal tenaga dan membunyikan isyarat pada (a) atau (b).`,ex:`Sama dengan Aturan 24(b): unit gabungan = kapal tenaga.`},
{k:'g',en:`A vessel at anchor shall at intervals of not more than one minute ring the bell rapidly for about 5 seconds. In a vessel of 100 metres or more in length the bell shall be sounded in the forepart of the vessel and immediately after the ringing of the bell the gong shall be sounded rapidly for about 5 seconds in the after part of the vessel. A vessel at anchor may in addition sound three blasts in succession, namely one short, one prolonged and one short blast, to give warning of her position and of the possibility of collision to an approaching vessel.`,id:`Kapal yang berlabuh harus membunyikan bel dengan cepat selama sekitar 5 detik, dengan selang tidak lebih dari satu menit. Pada kapal 100 meter atau lebih, bel dibunyikan di bagian depan dan segera setelahnya gong dibunyikan cepat selama sekitar 5 detik di bagian belakang. Kapal berlabuh boleh juga membunyikan tiga tiupan berturut-turut, yaitu pendek, panjang, pendek, untuk memperingatkan kapal yang mendekat akan posisinya dan kemungkinan tubrukan.`,ex:`Selang bel jangkar ≤1 menit, lebih sering daripada isyarat suling (≤2 menit).`},
{k:'h',en:`A vessel aground shall give the bell signal and if required the gong signal prescribed in paragraph (g) of this Rule and shall, in addition, give three separate and distinct strokes on the bell immediately before and after the rapid ringing of the bell. A vessel aground may in addition sound an appropriate whistle signal.`,id:`Kapal yang kandas harus membunyikan isyarat bel, dan bila perlu gong, pada paragraf (g), dan sebagai tambahan memberi tiga ketukan bel yang terpisah dan jelas segera sebelum dan sesudah bel dibunyikan cepat. Kapal kandas boleh juga membunyikan isyarat suling yang sesuai.`,ex:`3 ketukan, bel cepat, 3 ketukan. Dokumen sumber tertulis "gone signal"; maksudnya gong.`},
{k:'i',en:`A vessel of 12 metres or more but less than 20 metres in length shall not be obliged to give the bell signals prescribed in paragraphs (g) and (h) of this Rule. However, if she does not, she shall make some other efficient sound signal at intervals of not more than 2 minutes.`,id:`Kapal dengan panjang 12 meter atau lebih tetapi kurang dari 20 meter tidak wajib memberi isyarat bel pada paragraf (g) dan (h). Namun bila tidak, ia harus membuat isyarat suara lain yang efektif dengan selang tidak lebih dari 2 menit.`,ex:`Sesuai Aturan 33: bel baru wajib dibawa mulai 20 m.`},
{k:'j',en:`A vessel of less than 12 metres in length shall not be obliged to give the above-mentioned signals but, if she does not, shall make some other efficient sound signal at intervals of not more than 2 minutes.`,id:`Kapal dengan panjang kurang dari 12 meter tidak wajib memberi isyarat-isyarat di atas, tetapi bila tidak, ia harus membuat isyarat suara lain yang efektif dengan selang tidak lebih dari 2 menit.`,ex:`Perahu kecil tetap harus bersuara di kabut.`},
{k:'k',en:`A pilot vessel when engaged on pilotage duty may in addition to the signals prescribed in paragraphs (a), (b) or (g) of this Rule sound an identity signal consisting of four short blasts.`,id:`Kapal pandu yang sedang bertugas, selain isyarat pada (a), (b), atau (g), boleh membunyikan isyarat identitas berupa empat tiupan pendek.`,ex:`Empat pendek = "Saya kapal pandu."`}
],
q:[
[`Di kabut, kapal tenaga yang laju membunyikan…`,[`1 panjang tiap ≤2 menit`,`2 panjang tiap ≤2 menit`,`1 panjang 2 pendek tiap ≤2 menit`,`Bel tiap 1 menit`],`Aturan 35(a).`],
[`1 panjang diikuti 3 pendek dibunyikan oleh…`,[`Kapal terakhir dalam tundaan, bila berawak`,`Kapal penunda`,`Kapal pandu`,`Kapal kandas`],`Aturan 35(e).`],
[`Kapal berlabuh di kabut membunyikan bel cepat selama sekitar 5 detik dengan selang…`,[`Tidak lebih dari 1 menit`,`Tidak lebih dari 2 menit`,`Setiap 5 menit`,`Setiap 30 detik tepat`],`Aturan 35(g).`]
]});

rule({n:36,p:'D',t:`Isyarat untuk menarik perhatian`,en:`Signals to attract Attention`,
sum:`Boleh memakai isyarat cahaya atau suara, atau mengarahkan lampu sorot ke arah bahaya, asalkan tidak dikira isyarat lain dan tidak menyilaukan. Hindari lampu strobo.`,
mn:`"Tarik perhatian, jangan bikin bingung atau silau."`,
rel:[34,37],
subs:[
{k:'',en:`If necessary to attract the attention of another vessel any vessel may make light or sound signals that cannot be mistaken for any signal authorized elsewhere in these Rules, or may direct the beam of her searchlight in the direction of the danger, in such a way as not to embarrass any vessel. Any light to attract the attention of another vessel shall be such that it cannot be mistaken for any aid to navigation. For the purpose of this Rule the use of high intensity intermittent or revolving lights, such as strobe lights, shall be avoided.`,id:`Bila perlu menarik perhatian kapal lain, setiap kapal boleh membuat isyarat cahaya atau suara yang tidak dapat dikira isyarat lain dalam aturan-aturan ini, atau mengarahkan sorot lampu sorotnya ke arah bahaya dengan cara yang tidak mengganggu kapal mana pun. Setiap cahaya untuk menarik perhatian tidak boleh dapat dikira sebagai sarana bantu navigasi. Untuk keperluan aturan ini, lampu berintensitas tinggi yang menyala terputus-putus atau berputar, seperti lampu strobo, harus dihindari.`,ex:`Sorot ke arah bahaya (misalnya ke perahu kecil di depan kapal lain), bukan ke anjungan kapal lain yang menyilaukan. Dokumen sumber tertulis "strove"; maksudnya strobe.`}
],
q:[
[`Untuk menarik perhatian, lampu sorot boleh diarahkan ke…`,[`Arah bahaya, tanpa menyilaukan kapal lain`,`Anjungan kapal lain`,`Langit secara berputar`,`Mana saja`],`Aturan 36.`],
[`Lampu apa yang harus dihindari menurut Aturan 36?`,[`Lampu strobo berintensitas tinggi`,`Lampu sorot`,`Lampu tiang`,`Lampu buritan`],`Aturan 36.`],
[`Isyarat menarik perhatian tidak boleh…`,[`Dapat dikira isyarat lain atau sarana bantu navigasi`,`Berupa suara`,`Berupa cahaya`,`Dipakai siang hari`],`Aturan 36.`]
]});

rule({n:37,p:'D',t:`Isyarat bahaya`,en:`Distress Signals`,
sum:`Kapal dalam bahaya dan butuh pertolongan memakai isyarat dalam Annex IV.`,
mn:`"Minta tolong? Lihat Annex IV."`,
rel:[27,36],
subs:[
{k:'',en:`When a vessel is in distress and requires assistance she shall use or exhibit the signals described in Annex IV to these Regulations.`,id:`Bila kapal dalam bahaya dan membutuhkan pertolongan, ia harus menggunakan atau menunjukkan isyarat yang diuraikan dalam Annex IV.`,ex:`Contoh: SOS, "Mayday", roket merah, asap oranye, bendera N di atas C, DSC, EPIRB. Daftar lengkapnya di bagian Annex IV (menyusul).`,uj:`Isyarat NUC (Aturan 27) bukan isyarat bahaya.`}
],
q:[
[`Isyarat bahaya diatur di…`,[`Annex IV`,`Annex I`,`Aturan 27`,`Aturan 36`],`Aturan 37.`],
[`Dua lampu merah keliling (NUC) berarti kapal…`,[`Tidak dapat diolah gerak, bukan minta tolong`,`Dalam bahaya dan minta tolong`,`Kandas`,`Sedang memandu`],`Aturan 27(h).`],
[`Manakah isyarat bahaya?`,[`Asap berwarna oranye`,`Satu tiupan panjang`,`Dua bola hitam`,`Lampu kuning kedip`],`Annex IV 1(j).`]
]});

rule({n:38,p:'E',t:`Pengecualian`,en:`Exemptions`,
lead:{en:`Any vessel (or class of vessels) provided that she complies with the requirements of the International Regulations for Preventing Collisions at Sea, 1960, the keel of which is laid or which is at a corresponding stage of construction before the entry into force of these Regulations may be exempted from compliance therewith as follows:`,id:`Setiap kapal (atau golongan kapal), asalkan memenuhi Peraturan 1960, yang lunasnya diletakkan atau berada pada tahap pembangunan setara sebelum peraturan ini berlaku, dapat dikecualikan sebagai berikut:`},
sum:`Ketentuan peralihan bagi kapal yang dibangun sebelum COLREGs 1972 berlaku (15 Juli 1977): sebagian sementara (4 atau 9 tahun), sebagian permanen.`,
mn:`"Kapal tua: ada masa peralihan."`,
rel:[22,33],
subs:[
{k:'a',en:`The installation of lights with ranges prescribed in Rule 22, until four years after the date of entry into force of these Regulations.`,id:`Pemasangan lampu dengan jarak tampak menurut Aturan 22, sampai empat tahun setelah peraturan ini berlaku.`,ex:`Sementara, 4 tahun.`},
{k:'b',en:`The installation of lights with colour specifications as prescribed in Section 7 of Annex I to these Regulations, until four years after the date of entry into force of these Regulations.`,id:`Pemasangan lampu dengan spesifikasi warna menurut Bagian 7 Annex I, sampai empat tahun setelah peraturan ini berlaku.`,ex:`Sementara, 4 tahun.`},
{k:'c',en:`The repositioning of lights as a result of conversion from Imperial to metric units and rounding off measurement figures, permanent exemption.`,id:`Pemindahan posisi lampu akibat konversi satuan Imperial ke metrik dan pembulatan angka ukuran, pengecualian permanen.`,ex:`Permanen.`},
{k:'d',en:`(i) The repositioning of masthead lights on vessels of less than 150 metres in length, resulting from the prescriptions of Section 3(a) of Annex I to these Regulations, permanent exemption.
(ii) The repositioning of masthead lights on vessels of 150 metres or more in length, resulting from the prescriptions of Section 3(a) of Annex I to these Regulations, until nine years after the date of entry into force of these Regulations.`,id:`(i) Pemindahan lampu tiang pada kapal kurang dari 150 meter akibat Bagian 3(a) Annex I, pengecualian permanen.
(ii) Pemindahan lampu tiang pada kapal 150 meter atau lebih akibat Bagian 3(a) Annex I, sampai sembilan tahun setelah peraturan ini berlaku.`,ex:`<150 m permanen; ≥150 m sementara 9 tahun.`},
{k:'e',en:`The repositioning of masthead lights resulting from the prescriptions of Section 2(b) of Annex I to these Regulations, until nine years after the date of entry into force of these Regulations.`,id:`Pemindahan lampu tiang akibat Bagian 2(b) Annex I, sampai sembilan tahun setelah peraturan ini berlaku.`,ex:`Sementara, 9 tahun.`},
{k:'f',en:`The repositioning of sidelights resulting from the prescriptions of Sections 2(g) and 3(b) of Annex I to these Regulations, until nine years after the date of entry into force of these Regulations.`,id:`Pemindahan lampu lambung akibat Bagian 2(g) dan 3(b) Annex I, sampai sembilan tahun setelah peraturan ini berlaku.`,ex:`Sementara, 9 tahun.`},
{k:'g',en:`The requirements for sound signal appliances prescribed in Annex III to these Regulations, until nine years after the date of entry into force of these Regulations.`,id:`Persyaratan alat isyarat suara menurut Annex III, sampai sembilan tahun setelah peraturan ini berlaku.`,ex:`Sementara, 9 tahun.`},
{k:'h',en:`The repositioning of all-round lights resulting from the prescription of Section 9(b) of Annex I to these Regulations, permanent exemption.`,id:`Pemindahan lampu keliling akibat Bagian 9(b) Annex I, pengecualian permanen.`,ex:`Permanen.`,uj:`Semua masa peralihan sudah lama berakhir; yang masih relevan hanya pengecualian permanen untuk kapal sangat tua.`}
],
q:[
[`Aturan 38 berlaku bagi kapal yang…`,[`Lunasnya diletakkan sebelum COLREGs 1972 berlaku`,`Berukuran kurang dari 12 m`,`Berbendera asing`,`Sedang menangkap ikan`],`Kalimat pembuka Aturan 38.`],
[`Pemindahan lampu akibat konversi Imperial ke metrik mendapat pengecualian…`,[`Permanen`,`4 tahun`,`9 tahun`,`Tidak ada`],`Aturan 38(c).`],
[`Persyaratan alat isyarat suara Annex III mendapat masa peralihan…`,[`9 tahun`,`4 tahun`,`Permanen`,`1 tahun`],`Aturan 38(g).`]
]});

rule({n:39,p:'F',t:`Definisi`,en:`Definitions`,
sum:`Bagian F (ditambahkan Resolusi A.1085(28)) mendefinisikan audit, Skema Audit Negara Anggota IMO, dan Kode III sebagai standar audit.`,
mn:`"Audit, Skema, Kode III."`,
rel:[40,41],
subs:[
{k:'a',en:`Audit means a systematic, independent and documented process for obtaining audit evidence and evaluating it objectively to determine the extent to which audit criteria are fulfilled.`,id:`Audit berarti proses yang sistematis, independen, dan terdokumentasi untuk memperoleh bukti audit dan menilainya secara objektif guna menentukan sejauh mana kriteria audit terpenuhi.`,ex:`Pemeriksaan resmi terhadap negara anggota, bukan terhadap kapal.`},
{k:'b',en:`Audit Scheme means the IMO Member State Audit Scheme established by the Organization and taking into account the guidelines developed by the Organization.`,id:`Skema Audit berarti Skema Audit Negara Anggota IMO yang ditetapkan oleh Organisasi dengan memperhatikan pedoman yang dikembangkan Organisasi.`,ex:`IMSAS: IMO Member State Audit Scheme (rujukan: Resolusi A.1067(28)).`},
{k:'c',en:`Code for Implementation means the IMO Instruments Implementation Code (III Code) adopted by the Organization by resolution A.1070(28).`,id:`Kode Pelaksanaan berarti Kode Pelaksanaan Instrumen IMO (Kode III) yang diadopsi Organisasi melalui Resolusi A.1070(28).`,ex:`Kode III mengatur kewajiban negara bendera, negara pantai, dan negara pelabuhan.`},
{k:'d',en:`Audit Standard means the Code for Implementation.`,id:`Standar Audit berarti Kode Pelaksanaan.`,ex:`Audit dinilai berdasarkan Kode III.`}
],
q:[
[`Standar audit dalam Bagian F adalah…`,[`Kode III (IMO Instruments Implementation Code)`,`SOLAS`,`STCW`,`Annex I`],`Aturan 39(d).`],
[`Yang diaudit menurut Bagian F adalah…`,[`Negara anggota (Contracting Party)`,`Setiap kapal`,`Nakhoda`,`Perusahaan pelayaran`],`Aturan 41(a).`],
[`Bagian F ditambahkan melalui…`,[`Resolusi A.1085(28)`,`Resolusi A.919(22)`,`MSC/Circ.1144`,`Konferensi 1972`],`Catatan pada Aturan 39–41.`]
]});

rule({n:40,p:'F',t:`Penerapan`,en:`Application`,
sum:`Negara pihak menggunakan Kode III dalam melaksanakan kewajibannya menurut konvensi.`,
mn:`"Negara pakai Kode III."`,
rel:[39,41],
subs:[
{k:'',en:`Contracting Parties shall use the provisions of the Code for Implementation in the execution of their obligations and responsibilities contained in the present Convention.`,id:`Para Pihak harus menggunakan ketentuan Kode Pelaksanaan dalam melaksanakan kewajiban dan tanggung jawabnya menurut Konvensi ini.`,ex:`Ditujukan kepada negara, bukan kepada awak kapal.`}
],
q:[
[`Aturan 40 ditujukan kepada…`,[`Para Pihak (negara)`,`Nakhoda`,`Mualim jaga`,`Pemilik kapal`],`Aturan 40.`],
[`Para Pihak menggunakan ketentuan… dalam melaksanakan kewajibannya`,[`Kode Pelaksanaan (Kode III)`,`Annex II`,`ISM Code`,`Aturan 2`],`Aturan 40.`],
[`Bagian F membahas…`,[`Verifikasi kepatuhan terhadap konvensi`,`Lampu kapal`,`Isyarat suara`,`Olah gerak`],`Judul Bagian F.`]
]});

rule({n:41,p:'F',t:`Verifikasi kepatuhan`,en:`Verification of Compliance`,
sum:`Setiap negara pihak diaudit IMO secara berkala; Sekretaris Jenderal IMO mengelola skemanya; negara memfasilitasi audit dan menindaklanjuti temuannya.`,
mn:`"Diaudit berkala, difasilitasi, ditindaklanjuti."`,
rel:[39,40],
subs:[
{k:'a',en:`Every Contracting Party shall be subject to periodic audits by the Organization in accordance with the audit standard to verify compliance with and implementation of the present Convention.`,id:`Setiap Pihak harus diaudit secara berkala oleh Organisasi sesuai standar audit untuk memverifikasi kepatuhan dan pelaksanaan Konvensi ini.`,ex:`Audit berkala oleh IMO.`},
{k:'b',en:`The Secretary-General of the Organization shall have responsibility for administering the Audit Scheme, based on the guidelines developed by the Organization.`,id:`Sekretaris Jenderal Organisasi bertanggung jawab mengelola Skema Audit berdasarkan pedoman yang dikembangkan Organisasi.`,ex:`Pengelola: Sekretaris Jenderal IMO.`},
{k:'c',en:`Every Contracting Party shall have responsibility for facilitating the conduct of the audit and implementation of a programme of actions to address the findings, based on the guidelines developed by the Organization.`,id:`Setiap Pihak bertanggung jawab memfasilitasi pelaksanaan audit dan melaksanakan program tindakan untuk menindaklanjuti temuan, berdasarkan pedoman yang dikembangkan Organisasi.`,ex:`Negara wajib membantu audit dan memperbaiki temuan.`},
{k:'d',en:`Audit of all Contracting Parties shall be:
(i) based on an overall schedule developed by the Secretary-General of the Organization, taking into account the guidelines developed by the Organization; and
(ii) conducted at periodic intervals, taking into account the guidelines developed by the Organization.`,id:`Audit terhadap semua Pihak harus:
(i) berdasarkan jadwal menyeluruh yang disusun Sekretaris Jenderal Organisasi dengan memperhatikan pedoman Organisasi; dan
(ii) dilakukan dengan selang berkala dengan memperhatikan pedoman Organisasi.`,ex:`Jadwal disusun Sekretaris Jenderal; audit berulang secara berkala.`}
],
q:[
[`Siapa yang mengelola Skema Audit?`,[`Sekretaris Jenderal IMO`,`Negara bendera`,`Syahbandar`,`Klasifikasi kapal`],`Aturan 41(b).`],
[`Kewajiban negara pihak dalam audit adalah…`,[`Memfasilitasi audit dan menindaklanjuti temuan`,`Mengaudit kapal asing`,`Menetapkan TSS`,`Menerbitkan sertifikat lampu`],`Aturan 41(c).`],
[`Audit dilakukan…`,[`Secara berkala sesuai jadwal Sekretaris Jenderal`,`Sekali seumur hidup`,`Setiap terjadi tubrukan`,`Atas permintaan kapal`],`Aturan 41(d).`]
]});

const AX = (o) => rule(Object.assign({p:'X'}, o));
AX({n:'A1',lbl:`Annex I`,short:`I`,enl:`Annex I`,pre:`Annex I `,t:`Posisi dan detail teknis lampu serta sosok`,en:`Positioning and Technical Details of Lights and Shapes`,tool:[['annex1','Kalkulator posisi lampu']],
sum:`Annex I mengatur tinggi dan jarak lampu (tiang ≥6 m atau selebar kapal, maks 12 m; lampu tiang belakang ≥4,5 m lebih tinggi; jarak mendatar ≥½ panjang, maks 100 m), ukuran sosok (bola, kerucut, silinder 0,6 m; jarak antar sosok 1,5 m), warna, kekuatan cahaya, dan sektor lampu.`,
mn:`"6, 4½, ½": lampu tiang depan minimal 6 m, belakang 4,5 m lebih tinggi, terpisah setengah panjang kapal.`,
rel:[20,21,22,23],
subs:[
{k:'1',l:`1`,en:`Definition. The term "height above the hull" means height above the uppermost continuous deck. This height shall be measured from the position vertically beneath the location of the light.`,id:`Definisi. Istilah "tinggi di atas lambung" berarti tinggi di atas geladak menerus teratas. Tinggi ini diukur dari titik tegak lurus di bawah posisi lampu.`,ex:`Semua tinggi lampu di Annex I diukur dari geladak menerus teratas, bukan dari permukaan air.`},
{k:'2a',l:`2(a)`,en:`On a power-driven vessel of 20 metres or more in length the masthead lights shall be placed as follows:
(i) the forward masthead light, or if only one masthead light is carried, then that light, at a height above the hull of not less than 6 metres, and, if the breadth of the vessel exceeds 6 metres, then at a height above the hull not less than such breadth, so however that the light need not be placed at a greater height above the hull than 12 metres;
(ii) when two masthead lights are carried the after one shall be at least 4.5 metres vertically higher than the forward one.`,
id:`Pada kapal tenaga dengan panjang 20 meter atau lebih, lampu tiang ditempatkan sebagai berikut:
(i) lampu tiang depan, atau satu-satunya lampu tiang bila hanya satu, pada tinggi di atas lambung tidak kurang dari 6 meter, dan bila lebar kapal lebih dari 6 meter, tidak kurang dari lebar tersebut, tetapi tidak perlu lebih tinggi dari 12 meter di atas lambung;
(ii) bila dipasang dua lampu tiang, lampu belakang sekurang-kurangnya 4,5 meter lebih tinggi secara tegak dari lampu depan.`,
ex:`Contoh: kapal lebar 20 m → lampu tiang depan minimal 12 m (karena dibatasi 12 m). Kapal lebar 9 m → minimal 9 m.`,uj:`Hafalkan: minimal 6 m atau selebar kapal, tidak perlu lebih dari 12 m; lampu belakang +4,5 m.`},
{k:'2b',l:`2(b)`,en:`The vertical separation of masthead lights of power-driven vessels shall be such that in all normal conditions of trim the after light will be seen over and separate from the forward light at a distance of 1,000 metres from the stem when viewed from sea level.`,id:`Jarak tegak lampu-lampu tiang kapal tenaga harus sedemikian rupa sehingga dalam semua kondisi trim normal, lampu belakang terlihat di atas dan terpisah dari lampu depan pada jarak 1.000 meter dari linggi haluan bila dilihat dari permukaan laut.`,ex:`Tujuannya agar dua lampu tiang tidak tampak menyatu dari jarak 1 km.`},
{k:'2c',l:`2(c)`,en:`The masthead light of a power-driven vessel of 12 metres but less than 20 metres in length shall be placed at a height above the gunwale of not less than 2.5 metres.`,id:`Lampu tiang kapal tenaga dengan panjang 12 meter tetapi kurang dari 20 meter harus ditempatkan pada tinggi tidak kurang dari 2,5 meter di atas pinggir geladak (gunwale).`,ex:`Untuk kapal 12–20 m, tinggi diukur dari gunwale.`},
{k:'2d',l:`2(d)`,en:`A power-driven vessel of less than 12 metres in length may carry the uppermost light at a height of less than 2.5 metres above the gunwale. When however a masthead light is carried in addition to sidelights and a sternlight or the all-round light prescribed in Rule 23(d)(i) is carried in addition to sidelights, then such masthead light or all-round light shall be carried at least 1 metre higher than the sidelights.`,id:`Kapal tenaga dengan panjang kurang dari 12 meter boleh memasang lampu teratasnya kurang dari 2,5 meter di atas gunwale. Namun bila lampu tiang dipasang bersama lampu lambung dan lampu buritan, atau lampu keliling menurut Aturan 23(d)(i) dipasang bersama lampu lambung, maka lampu tiang atau lampu keliling itu harus sekurang-kurangnya 1 meter lebih tinggi dari lampu lambung.`,ex:`Dokumen sumber merujuk "Rule 23(c)(i)"; setelah amandemen 2003 nomornya menjadi 23(d)(i).`},
{k:'2e',l:`2(e)`,en:`One of the two or three masthead lights prescribed for a power-driven vessel when engaged in towing or pushing another vessel shall be placed in the same position as either the forward masthead light or the after masthead light; provided that, if carried on the aftermast, the lowest after masthead light shall be at least 4.5 metres vertically higher than the forward masthead light.`,id:`Salah satu dari dua atau tiga lampu tiang kapal tenaga yang sedang menunda atau mendorong harus ditempatkan pada posisi yang sama dengan lampu tiang depan atau lampu tiang belakang; dengan ketentuan bila dipasang di tiang belakang, lampu tiang belakang yang terendah harus sekurang-kurangnya 4,5 meter lebih tinggi dari lampu tiang depan.`,ex:`Lampu tunda vertikal menggantikan lampu tiang depan atau belakang.`},
{k:'2f',l:`2(f)`,en:`(i) The masthead light or lights prescribed in Rule 23(a) shall be so placed as to be above and clear of all other lights and obstructions except as described in sub-paragraph (ii).
(ii) When it is impracticable to carry the all-round lights prescribed by Rule 27(b)(i) or Rule 28 below the masthead lights, they may be carried above the after masthead light(s) or vertically in between the forward masthead light(s) and after masthead light(s), provided that in the latter case the requirement of Section 3(c) of this Annex shall be complied with.`,id:`(i) Lampu tiang menurut Aturan 23(a) harus ditempatkan di atas dan bebas dari semua lampu dan rintangan lain, kecuali seperti diuraikan dalam (ii).
(ii) Bila lampu keliling Aturan 27(b)(i) atau Aturan 28 tidak dapat dipasang di bawah lampu tiang, lampu itu boleh dipasang di atas lampu tiang belakang atau secara tegak di antara lampu tiang depan dan belakang, asalkan dalam hal yang terakhir dipenuhi ketentuan Bagian 3(c) Annex ini.`,ex:`Biasanya lampu RAM dan CBD berada di bawah lampu tiang; pengecualian diatur di sini.`},
{k:'2g',l:`2(g)`,en:`The sidelights of a power-driven vessel shall be placed at a height above the hull not greater than three quarters of that of the forward masthead light. They shall not be so low as to be interfered with by deck lights.`,id:`Lampu lambung kapal tenaga harus ditempatkan pada tinggi di atas lambung tidak lebih dari tiga perempat tinggi lampu tiang depan. Lampu lambung tidak boleh terlalu rendah sehingga terganggu lampu geladak.`,ex:`Maksimal ¾ tinggi lampu tiang depan.`},
{k:'2h',l:`2(h)`,en:`The sidelights, if in a combined lantern and carried on a power-driven vessel of less than 20 metres in length, shall be placed not less than 1 metre below the masthead light.`,id:`Lampu lambung, bila dalam lentera gabungan pada kapal tenaga kurang dari 20 meter, harus ditempatkan tidak kurang dari 1 meter di bawah lampu tiang.`,ex:`Lentera gabungan minimal 1 m di bawah lampu tiang.`},
{k:'2i',l:`2(i)`,en:`When the Rules prescribe two or three lights to be carried in a vertical line, they shall be spaced as follows:
(i) on a vessel of 20 metres in length or more such lights shall be spaced not less than 2 metres apart, and the lowest of these lights shall, except where a towing light is required, be placed at a height of not less than 4 metres above the hull;
(ii) on a vessel of less than 20 metres in length such lights shall be spaced not less than 1 metre apart and the lowest of these lights shall, except where a towing light is required, be placed at a height of not less than 2 metres above the gunwale;
(iii) when three lights are carried they shall be equally spaced.`,id:`Bila aturan menentukan dua atau tiga lampu dalam satu garis tegak, jaraknya sebagai berikut:
(i) pada kapal 20 meter atau lebih, jarak antar lampu tidak kurang dari 2 meter, dan lampu terendah, kecuali bila diperlukan lampu tunda, tidak kurang dari 4 meter di atas lambung;
(ii) pada kapal kurang dari 20 meter, jarak antar lampu tidak kurang dari 1 meter, dan lampu terendah, kecuali bila diperlukan lampu tunda, tidak kurang dari 2 meter di atas gunwale;
(iii) bila tiga lampu dipasang, jaraknya harus sama.`,ex:`Kapal ≥20 m: jarak 2 m, terendah 4 m. Kapal <20 m: jarak 1 m, terendah 2 m.`},
{k:'2j',l:`2(j)`,en:`The lower of the two all-round lights prescribed for a vessel when engaged in fishing shall be at a height above the sidelights not less than twice the distance between the two vertical lights.`,id:`Lampu yang lebih rendah dari dua lampu keliling kapal yang sedang menangkap ikan harus berada di atas lampu lambung dengan jarak tidak kurang dari dua kali jarak antara kedua lampu tegak itu.`,ex:`Agar lampu putih kapal ikan tidak dikira lampu tiang yang dekat lampu lambung.`},
{k:'2k',l:`2(k)`,en:`The forward anchor light prescribed in Rule 30(a)(i), when two are carried, shall not be less than 4.5 metres above the after one. On a vessel of 50 metres or more in length this forward anchor light shall be placed at a height of not less than 6 metres above the hull.`,id:`Lampu jangkar depan menurut Aturan 30(a)(i), bila dipasang dua, harus tidak kurang dari 4,5 meter di atas lampu jangkar belakang. Pada kapal 50 meter atau lebih, lampu jangkar depan ditempatkan tidak kurang dari 6 meter di atas lambung.`,ex:`Lampu jangkar depan lebih tinggi 4,5 m; pada kapal ≥50 m minimal 6 m di atas lambung.`},
{k:'3a',l:`3(a)`,en:`When two masthead lights are prescribed for a power-driven vessel, the horizontal distance between them shall not be less than one half of the length of the vessel but need not be more than 100 metres. The forward light shall be placed not more than one quarter of the length of the vessel from the stem.`,id:`Bila ditentukan dua lampu tiang untuk kapal tenaga, jarak mendatar antara keduanya tidak kurang dari setengah panjang kapal tetapi tidak perlu lebih dari 100 meter. Lampu depan ditempatkan tidak lebih dari seperempat panjang kapal dari linggi haluan.`,ex:`Kapal 180 m: jarak minimal 90 m, lampu depan maksimal 45 m dari haluan.`,uj:`"½ L, maks 100 m; depan ≤ ¼ L dari haluan."`},
{k:'3b',l:`3(b)`,en:`On a power-driven vessel of 20 metres or more in length the sidelights shall not be placed in front of the forward masthead lights. They shall be placed at or near the side of the vessel.`,id:`Pada kapal tenaga 20 meter atau lebih, lampu lambung tidak boleh ditempatkan di depan lampu tiang depan. Lampu lambung ditempatkan di atau dekat sisi kapal.`,ex:`Tafsiran resmi IMO (MSC.1/Circ.1260): "near the side" berarti tidak lebih dari 10% lebar kapal ke arah dalam dari sisi, maksimal 1 meter.`},
{k:'3c',l:`3(c)`,en:`When the lights prescribed in Rule 27(b)(i) or Rule 28 are placed vertically between the forward masthead light(s) and the after masthead light(s) these all-round lights shall be placed at a horizontal distance of not less than 2 metres from the fore and aft centreline of the vessel in the athwartship direction.`,id:`Bila lampu Aturan 27(b)(i) atau Aturan 28 ditempatkan secara tegak di antara lampu tiang depan dan belakang, lampu keliling itu harus ditempatkan pada jarak mendatar tidak kurang dari 2 meter dari garis tengah membujur kapal ke arah melintang.`,ex:`Digeser ke samping minimal 2 m agar tidak tertukar dengan lampu tiang.`},
{k:'3d',l:`3(d)`,en:`When only one masthead light is prescribed for a power-driven vessel, this light shall be exhibited forward of amidships; except that a vessel of less than 20 metres in length need not exhibit this light forward of amidships but shall exhibit it as far forward as is practicable.`,id:`Bila hanya satu lampu tiang ditentukan untuk kapal tenaga, lampu itu ditunjukkan di depan tengah kapal; kecuali kapal kurang dari 20 meter tidak perlu di depan tengah kapal tetapi sejauh mungkin ke depan.`,ex:`Satu lampu tiang di bagian depan kapal.`},
{k:'4',l:`4`,en:`Details of location of direction-indicating lights for fishing vessels, dredgers and vessels engaged in underwater operations.
(a) The light indicating the direction of the outlying gear from a vessel engaged in fishing as prescribed in Rule 26(c)(ii) shall be placed at a horizontal distance of not less than 2 metres and not more than 6 metres away from the two all-round red and white lights. This light shall be placed not higher than the all-round white light prescribed in Rule 26(c)(i) and not lower than the sidelights.
(b) The lights and shapes on a vessel engaged in dredging or underwater operations to indicate the obstructed side and/or the side on which it is safe to pass, as prescribed in Rule 27(d)(i) and (ii), shall be placed at the maximum practical horizontal distance, but in no case less than 2 metres, from the lights or shapes prescribed in Rule 27(b)(i) and (ii). In no case shall the upper of these lights or shapes be at a greater height than the lower of the three lights or shapes prescribed in Rule 27(b)(i) and (ii).`,
id:`Detail letak lampu penunjuk arah untuk kapal ikan, kapal keruk, dan kapal yang bekerja di bawah air.
(a) Lampu penunjuk arah alat tangkap yang terbentang menurut Aturan 26(c)(ii) ditempatkan pada jarak mendatar 2 sampai 6 meter dari dua lampu keliling merah dan putih, tidak lebih tinggi dari lampu putih keliling Aturan 26(c)(i) dan tidak lebih rendah dari lampu lambung.
(b) Lampu dan sosok kapal keruk atau kapal yang bekerja di bawah air yang menandai sisi terhalang dan/atau sisi aman dilewati menurut Aturan 27(d)(i) dan (ii) ditempatkan sejauh mungkin secara mendatar, tetapi tidak kurang dari 2 meter, dari lampu atau sosok Aturan 27(b)(i) dan (ii). Lampu atau sosok teratasnya tidak boleh lebih tinggi dari yang terendah di antara tiga lampu atau sosok Aturan 27(b)(i) dan (ii).`,ex:`Lampu penunjuk sisi dipasang terpisah ke samping agar arahnya jelas.`},
{k:'5',l:`5`,en:`Screens for sidelights. The sidelights of vessels of 20 metres or more in length shall be fitted with inboard screens painted matt black, and meeting the requirements of Section 9 of this Annex. On vessels of less than 20 metres in length the sidelights, if necessary to meet the requirements of Section 9 of this Annex, shall be fitted with inboard matt black screens. With a combined lantern, using a single vertical filament and a very narrow division between the green and red sections, external screens need not be fitted.`,id:`Penyekat lampu lambung. Lampu lambung kapal 20 meter atau lebih harus dilengkapi penyekat sisi dalam bercat hitam doff yang memenuhi Bagian 9 Annex ini. Pada kapal kurang dari 20 meter, lampu lambung dilengkapi penyekat hitam doff bila perlu untuk memenuhi Bagian 9. Lentera gabungan dengan satu filamen tegak dan pemisah sangat sempit antara bagian hijau dan merah tidak perlu penyekat luar.`,ex:`Penyekat mencegah lampu hijau terlihat dari sisi kiri dan sebaliknya.`},
{k:'6',l:`6`,en:`Shapes.
(a) Shapes shall be black and of the following sizes:
(i) a ball shall have a diameter of not less than 0.6 metre;
(ii) a cone shall have a base diameter of not less than 0.6 metre and a height equal to its diameter;
(iii) a cylinder shall have a diameter of at least 0.6 metre and a height of twice its diameter;
(iv) a diamond shape shall consist of two cones as defined in (ii) above having a common base.
(b) The vertical distance between shapes shall be at least 1.5 metres.
(c) In a vessel of less than 20 metres in length shapes of lesser dimensions but commensurate with the size of the vessel may be used and the distance apart may be correspondingly reduced.`,
id:`Sosok.
(a) Sosok harus berwarna hitam dengan ukuran:
(i) bola berdiameter tidak kurang dari 0,6 meter;
(ii) kerucut berdiameter alas tidak kurang dari 0,6 meter dan tinggi sama dengan diameternya;
(iii) silinder berdiameter sekurang-kurangnya 0,6 meter dan tinggi dua kali diameternya;
(iv) belah ketupat terdiri dari dua kerucut seperti (ii) dengan alas bersama.
(b) Jarak tegak antar sosok sekurang-kurangnya 1,5 meter.
(c) Pada kapal kurang dari 20 meter boleh dipakai sosok lebih kecil yang sepadan dengan ukuran kapal, dan jaraknya dapat dikurangi.`,
ex:`Semua 0,6 m; silinder tinggi 1,2 m; jarak antar sosok 1,5 m.`,uj:`Soal favorit: ukuran bola 0,6 m, tinggi silinder 2 × diameter, jarak antar sosok 1,5 m.`},
{k:'7',l:`7`,en:`Colour specification of lights. The chromaticity of all navigation lights shall conform to the following standards, which lie within the boundaries of the area of the diagram specified for each colour by the International Commission on Illumination (CIE). The boundaries of the area for each colour are given by indicating the corner co-ordinates, which are as follows:
(i) White: x 0.525 0.525 0.452 0.310 0.310 0.443; y 0.382 0.440 0.440 0.348 0.283 0.382
(ii) Green: x 0.028 0.009 0.300 0.203; y 0.385 0.723 0.511 0.356
(iii) Red: x 0.680 0.660 0.735 0.721; y 0.320 0.320 0.265 0.259
(iv) Yellow: x 0.612 0.618 0.575 0.575; y 0.382 0.382 0.425 0.406`,
id:`Spesifikasi warna lampu. Kromatisitas semua lampu navigasi harus sesuai standar berikut, yang berada dalam batas area diagram yang ditentukan untuk setiap warna oleh Komisi Internasional tentang Iluminasi (CIE). Batas area tiap warna diberikan dengan koordinat sudut seperti tercantum dalam teks asli untuk putih, hijau, merah, dan kuning.`,ex:`Detail teknis untuk pabrik lampu. Cukup tahu bahwa warna lampu diatur standar CIE.`},
{k:'8',l:`8`,en:`Intensity of lights.
(a) The minimum luminous intensity of lights shall be calculated by using the formula: I = 3.43 × 10⁶ × T × D² × K⁻ᴰ
where I is luminous intensity in candelas under service conditions, T is threshold factor 2 × 10⁻⁷ lux, D is range of visibility (luminous range) of the light in nautical miles, K is atmospheric transmissivity. For prescribed lights the value of K shall be 0.8, corresponding to a meteorological visibility of approximately 13 nautical miles.
(b) A selection of figures derived from the formula is given in the following table: range D (miles) 1, 2, 3, 4, 5, 6 → luminous intensity I (candelas, K = 0.8) 0.9, 4.3, 12, 27, 52, 94.
Note: The maximum luminous intensity of navigation lights should be limited to avoid undue glare. This shall not be achieved by a variable control of the luminous intensity.`,
id:`Kekuatan cahaya lampu.
(a) Kekuatan cahaya minimum dihitung dengan rumus I = 3,43 × 10⁶ × T × D² × K⁻ᴰ, dengan I kekuatan cahaya dalam kandela, T faktor ambang 2 × 10⁻⁷ lux, D jarak tampak lampu dalam mil laut, dan K transmisivitas atmosfer. Untuk lampu yang ditentukan, K = 0,8, setara jarak pandang meteorologis sekitar 13 mil laut.
(b) Contoh hasil rumus: jarak 1, 2, 3, 4, 5, 6 mil → kekuatan 0,9; 4,3; 12; 27; 52; 94 kandela.
Catatan: kekuatan maksimum lampu navigasi harus dibatasi agar tidak menyilaukan, tetapi tidak dengan pengatur kekuatan yang dapat diubah-ubah.`,ex:`Rumus di dokumen sumber terpotong saat konversi; di sini ditulis lengkap. Lampu 6 mil butuh sekitar 94 kandela.`},
{k:'9',l:`9`,en:`Horizontal sectors.
(a)(i) In the forward direction, sidelights as fitted on the vessel shall show the minimum required intensities. The intensities must decrease to reach practical cut-off between 1 degree and 3 degrees outside the prescribed sectors.
(ii) For sternlights and masthead lights and at 22.5 degrees abaft the beam for sidelights, the minimum required intensities shall be maintained over the arc of the horizon up to 5 degrees within the limits of the sectors prescribed in Rule 21. From 5 degrees within the prescribed sectors the intensity may decrease by 50 per cent up to the prescribed limits; it shall decrease steadily to reach practical cut-off at not more than 5 degrees outside the prescribed sectors.
(b)(i) All-round lights shall be so located as not to be obscured by masts, topmasts or structures within angular sectors of more than 6 degrees, except anchor lights prescribed in Rule 30, which need not be placed at an impracticable height above the hull.
(ii) If it is impracticable to comply with paragraph (b)(i) of this section by exhibiting only one all-round light, two all-round lights shall be used suitably positioned or screened so that they appear, as far as practicable, as one light at a distance of one mile.`,
id:`Sektor mendatar.
(a)(i) Ke arah depan, lampu lambung harus menunjukkan kekuatan minimum yang disyaratkan, lalu menurun sampai padam praktis antara 1 dan 3 derajat di luar sektor yang ditentukan.
(ii) Untuk lampu buritan dan lampu tiang, serta pada batas 22,5 derajat di belakang arah melintang untuk lampu lambung, kekuatan minimum dipertahankan sampai 5 derajat di dalam batas sektor Aturan 21. Dari 5 derajat di dalam sektor, kekuatan boleh turun 50 persen sampai batas sektor, lalu terus menurun sampai padam praktis tidak lebih dari 5 derajat di luar sektor.
(b)(i) Lampu keliling ditempatkan agar tidak terhalang tiang atau bangunan dalam sektor lebih dari 6 derajat, kecuali lampu jangkar Aturan 30 yang tidak perlu dipasang pada tinggi yang tidak praktis.
(ii) Bila (b)(i) tidak dapat dipenuhi dengan satu lampu keliling, dipakai dua lampu keliling yang diatur atau disekat sehingga sejauh mungkin tampak sebagai satu lampu pada jarak satu mil.`,
ex:`Itulah sebabnya dari tepat di depan Anda bisa sesaat melihat merah dan hijau, bahkan sedikit melewati garis tengah. Tafsiran IMO (MSC.1/Circ.1260/Rev.1) untuk (b)(ii): sudut sekat kedua lampu harus memenuhi θ2 ≤ 360 − θ1.`},
{k:'10',l:`10`,en:`Vertical sectors.
(a) The vertical sectors of electric lights as fitted, with the exception of lights on sailing vessels underway, shall ensure that:
(i) at least the required minimum intensity is maintained at all angles from 5 degrees above to 5 degrees below the horizontal;
(ii) at least 60 per cent of the required minimum intensity is maintained from 7.5 degrees above to 7.5 degrees below the horizontal.
(b) In the case of sailing vessels underway the vertical sectors of electric lights as fitted shall ensure that:
(i) at least the required minimum intensity is maintained at all angles from 5 degrees above to 5 degrees below the horizontal;
(ii) at least 50 per cent of the required minimum intensity is maintained from 25 degrees above to 25 degrees below the horizontal.
(c) In the case of lights other than electric these specifications shall be met as closely as possible.`,
id:`Sektor tegak.
(a) Sektor tegak lampu listrik, kecuali pada kapal layar yang sedang berlayar, harus menjamin: (i) kekuatan minimum dipertahankan dari 5 derajat di atas sampai 5 derajat di bawah horizontal; (ii) sekurang-kurangnya 60 persen kekuatan minimum dipertahankan dari 7,5 derajat di atas sampai 7,5 derajat di bawah horizontal.
(b) Pada kapal layar yang sedang berlayar: (i) kekuatan minimum dipertahankan dari 5 derajat di atas sampai 5 derajat di bawah horizontal; (ii) sekurang-kurangnya 50 persen dari 25 derajat di atas sampai 25 derajat di bawah horizontal.
(c) Lampu bukan listrik memenuhi spesifikasi ini semirip mungkin.`,ex:`Kapal layar mendapat sektor tegak lebih lebar (±25°) karena kapalnya miring (oleng) saat berlayar.`},
{k:'11',l:`11`,en:`Intensity of non-electric lights. Non-electric lights shall so far as practicable comply with the minimum intensities, as specified in the Table given in Section 8 of this Annex.`,id:`Kekuatan lampu bukan listrik. Lampu bukan listrik sedapat mungkin memenuhi kekuatan minimum dalam tabel Bagian 8 Annex ini.`,ex:`Misalnya lampu minyak di perahu tradisional.`},
{k:'12',l:`12`,en:`Manoeuvring light. Notwithstanding the provisions of paragraph 2(f) of this Annex the manoeuvring light described in Rule 34(b) shall be placed in the same fore and aft vertical plane as the masthead light or lights and, where practicable, at a minimum height of 2 metres vertically above the forward masthead light, provided that it shall be carried not less than 2 metres vertically above or below the after masthead light. On a vessel where only one masthead light is carried the manoeuvring light, if fitted, shall be carried where it can best be seen, not less than 2 metres vertically apart from the masthead light.`,id:`Lampu olah gerak. Walaupun ada ketentuan paragraf 2(f), lampu olah gerak Aturan 34(b) ditempatkan pada bidang tegak membujur yang sama dengan lampu tiang dan, bila memungkinkan, sekurang-kurangnya 2 meter di atas lampu tiang depan, dengan ketentuan tidak kurang dari 2 meter di atas atau di bawah lampu tiang belakang. Pada kapal dengan satu lampu tiang, lampu olah gerak, bila dipasang, ditempatkan di tempat paling mudah terlihat dengan jarak tegak tidak kurang dari 2 meter dari lampu tiang.`,ex:`Lampu olah gerak dipisah 2 m dari lampu tiang agar kedipannya jelas.`},
{k:'13',l:`13`,en:`High-speed craft.
(a) The masthead light of high-speed craft may be placed at a height related to the breadth of the craft lower than that prescribed in paragraph 2(a)(i) of this Annex, provided that the base angle of the isosceles triangles formed by the sidelights and masthead light, when seen in end elevation, is not less than 27 degrees.
(b) On high-speed craft of 50 metres or more in length, the vertical separation between foremast and mainmast light of 4.5 metres required by paragraph 2(a)(ii) of this Annex may be modified provided that such distance shall not be less than the value determined by the following formula: y = (a + 17Ψ) × C / 1000 + 2
where y is the height of the mainmast light above the foremast light in metres; a is the height of the foremast light above the water surface in service condition in metres; Ψ is the trim in service condition in degrees; C is the horizontal separation of masthead lights in metres.`,
id:`Kapal cepat (high-speed craft).
(a) Lampu tiang kapal cepat boleh lebih rendah dari ketentuan 2(a)(i) sesuai lebarnya, asalkan sudut alas segitiga sama kaki yang dibentuk lampu lambung dan lampu tiang, dilihat dari depan, tidak kurang dari 27 derajat.
(b) Pada kapal cepat 50 meter atau lebih, jarak tegak 4,5 meter antara lampu tiang depan dan utama boleh diubah asalkan tidak kurang dari y = (a + 17Ψ) × C / 1000 + 2, dengan y tinggi lampu tiang utama di atas lampu tiang depan (m), a tinggi lampu tiang depan di atas air (m), Ψ trim (derajat), dan C jarak mendatar lampu tiang (m).`,ex:`Kapal cepat sering rendah dan lebar; aturannya disesuaikan. Rumus di dokumen sumber berupa gambar dan di sini ditulis ulang.`},
{k:'14',l:`14`,en:`Approval. The construction of lanterns and shapes and the installation of lanterns on board the vessel shall be to the satisfaction of the appropriate authority of the State whose flag the vessel is entitled to fly.`,id:`Persetujuan. Konstruksi lentera dan sosok serta pemasangan lentera di kapal harus memenuhi persyaratan otoritas yang berwenang dari Negara yang benderanya dikibarkan kapal tersebut.`,ex:`Negara bendera yang menyetujui lampu dan sosok.`}
],
q:[
[`Pada kapal tenaga ≥20 m, lampu tiang depan minimal setinggi…`,[`6 m, atau selebar kapal bila lebih dari 6 m (tidak perlu >12 m)`,`4 m`,`2,5 m di atas gunwale`,`12 m untuk semua kapal`],`Annex I 2(a)(i).`],
[`Jarak tegak minimum antar sosok adalah…`,[`1,5 m`,`0,6 m`,`2 m`,`4,5 m`],`Annex I 6(b).`],
[`Jarak mendatar dua lampu tiang minimal…`,[`Setengah panjang kapal, tidak perlu lebih dari 100 m`,`Seperempat panjang kapal`,`4,5 m`,`Sama dengan lebar kapal`],`Annex I 3(a).`]
]});

AX({n:'A2',lbl:`Annex II`,short:`II`,enl:`Annex II`,pre:`Annex II `,t:`Isyarat tambahan kapal ikan yang berdekatan`,en:`Additional Signals for Fishing Vessels Fishing in Close Proximity`,
sum:`Pukat ≥20 m: menebar jaring dua putih, menarik jaring putih di atas merah, jaring tersangkut dua merah; pukat berpasangan menyalakan lampu sorot. Pukat cincin: dua kuning berkedip bergantian. Semua di bawah lampu Aturan 26, terlihat ≥1 mil.`,
mn:`"Tebar putih-putih, tarik putih-merah, nyangkut merah-merah."`,
rel:[26],
subs:[
{k:'1',l:`1`,en:`General. The lights mentioned herein shall, if exhibited in pursuance of Rule 26(d), be placed where they can best be seen. They shall be at least 0.9 metre apart but at a lower level than lights prescribed in Rule 26(b)(i) and (c)(i). The lights shall be visible all round the horizon at a distance of at least 1 mile but at a lesser distance than the lights prescribed by these Rules for fishing vessels.`,id:`Umum. Lampu-lampu di sini, bila ditunjukkan menurut Aturan 26(d), ditempatkan di tempat paling mudah terlihat, berjarak sekurang-kurangnya 0,9 meter satu sama lain tetapi lebih rendah dari lampu Aturan 26(b)(i) dan (c)(i). Lampu harus terlihat dari segala arah pada jarak sekurang-kurangnya 1 mil, tetapi kurang dari jarak tampak lampu kapal ikan dalam aturan-aturan ini.`,ex:`Isyarat tambahan ini lebih redup dan lebih rendah dari lampu kapal ikan biasa.`},
{k:'2a',l:`2(a)`,en:`Signals for trawlers. Vessels of 20 metres or more in length when engaged in trawling, whether using demersal or pelagic gear, shall exhibit:
(i) when shooting their nets: two white lights in a vertical line;
(ii) when hauling their nets: one white light over one red light in a vertical line;
(iii) when the net has come fast upon an obstruction: two red lights in a vertical line.`,id:`Isyarat kapal pukat. Kapal 20 meter atau lebih yang sedang memukat, baik alat dasar maupun pelagis, harus menunjukkan:
(i) saat menebar jaring: dua lampu putih dalam satu garis tegak;
(ii) saat menarik jaring: satu lampu putih di atas satu lampu merah dalam satu garis tegak;
(iii) bila jaring tersangkut rintangan: dua lampu merah dalam satu garis tegak.`,ex:`Ingat: tersangkut = merah-merah, karena kapal tidak bisa bermanuver.`},
{k:'2b',l:`2(b)`,en:`Each vessel of 20 metres or more in length engaged in pair trawling shall exhibit:
(i) by night, a searchlight directed forward and in the direction of the other vessel of the pair;
(ii) when shooting or hauling their nets or when their nets have come fast upon an obstruction, the lights prescribed in 2(a) above.`,id:`Setiap kapal 20 meter atau lebih yang memukat berpasangan harus menunjukkan:
(i) pada malam hari, lampu sorot yang diarahkan ke depan dan ke arah kapal pasangannya;
(ii) saat menebar atau menarik jaring atau bila jaring tersangkut, lampu menurut 2(a).`,ex:`Lampu sorot ke arah pasangan menunjukkan ada jaring di antara kedua kapal: jangan lewat di tengah!`},
{k:'2c',l:`2(c)`,en:`A vessel of less than 20 metres in length engaged in trawling, whether using demersal or pelagic gear or engaged in pair trawling, may exhibit the lights prescribed in paragraphs (a) or (b) of this section, as appropriate.`,id:`Kapal kurang dari 20 meter yang memukat, baik alat dasar, pelagis, maupun berpasangan, boleh menunjukkan lampu menurut paragraf (a) atau (b) sesuai keadaannya.`,ex:`Untuk kapal <20 m sifatnya boleh, bukan wajib.`},
{k:'3',l:`3`,en:`Signals for purse seiners. Vessels engaged in fishing with purse seine gear may exhibit two yellow lights in a vertical line. These lights shall flash alternately every second and with equal light and occultation duration. These lights may be exhibited only when the vessel is hampered by its fishing gear.`,id:`Isyarat kapal pukat cincin. Kapal yang menangkap ikan dengan pukat cincin boleh menunjukkan dua lampu kuning dalam satu garis tegak yang berkedip bergantian setiap detik dengan lama menyala dan padam yang sama. Lampu ini hanya boleh ditunjukkan bila kapal terhalang oleh alat tangkapnya.`,ex:`Pukat cincin (purse seine) banyak dipakai di perairan Indonesia. Dua kuning bergantian = jangan mendekat.`}
],
q:[
[`Kapal pukat ≥20 m yang sedang menarik jaring menunjukkan…`,[`Putih di atas merah`,`Dua putih`,`Dua merah`,`Dua kuning bergantian`],`Annex II 2(a)(ii).`],
[`Dua lampu kuning yang berkedip bergantian menandakan…`,[`Kapal pukat cincin yang terhalang alat tangkapnya`,`Hovercraft`,`Kapal tunda`,`Kapal pandu`],`Annex II 3.`],
[`Lampu sorot ke arah kapal lain pada malam hari dipakai oleh…`,[`Kapal pukat berpasangan`,`Kapal pandu`,`Kapal kandas`,`Kapal RAM`],`Annex II 2(b)(i).`]
]});

AX({n:'A3',lbl:`Annex III`,short:`III`,enl:`Annex III`,pre:`Annex III `,t:`Detail teknis alat isyarat suara`,en:`Technical Details of Sound Signal Appliances`,
sum:`Frekuensi dasar suling 70–700 Hz: makin besar kapal makin rendah nadanya. Jarak dengar 2 mil (≥200 m), 1,5 mil (75–200 m), 1 mil (20–75 m), 0,5 mil (<20 m). Bel dan gong ≥110 dB pada 1 m; mulut bel ≥300 mm untuk kapal ≥20 m.`,
mn:`"Kapal besar bersuara rendah dan jauh: 2; 1,5; 1; 0,5 mil."`,
rel:[32,33,35],
subs:[
{k:'1a',l:`1(a)`,en:`Whistles. Frequencies and range of audibility. The fundamental frequency of the signal shall lie within the range 70–700 Hz. The range of audibility of the signal from a whistle shall be determined by those frequencies, which may include the fundamental and/or one or more higher frequencies, which lie within the range 180–700 Hz (±1%) for a vessel of 20 metres or more in length, or 180–2100 Hz (±1%) for a vessel of less than 20 metres in length and which provide the sound pressure levels specified in paragraph 1(c) below.`,id:`Suling. Frekuensi dan jarak dengar. Frekuensi dasar isyarat berada dalam rentang 70–700 Hz. Jarak dengar ditentukan oleh frekuensi, termasuk frekuensi dasar dan/atau frekuensi lebih tinggi, dalam rentang 180–700 Hz (±1%) untuk kapal 20 meter atau lebih, atau 180–2100 Hz (±1%) untuk kapal kurang dari 20 meter, yang menghasilkan tingkat tekanan suara pada paragraf 1(c).`,ex:`Rentang frekuensi dasar seluruh suling: 70–700 Hz.`},
{k:'1b',l:`1(b)`,en:`Limits of fundamental frequencies. To ensure a wide variety of whistle characteristics, the fundamental frequency of a whistle shall be between the following limits:
(i) 70–200 Hz, for a vessel 200 metres or more in length;
(ii) 130–350 Hz, for a vessel 75 metres but less than 200 metres in length;
(iii) 250–700 Hz, for a vessel less than 75 metres in length.`,id:`Batas frekuensi dasar. Agar karakter suling beragam, frekuensi dasar suling berada dalam batas:
(i) 70–200 Hz untuk kapal 200 meter atau lebih;
(ii) 130–350 Hz untuk kapal 75 meter tetapi kurang dari 200 meter;
(iii) 250–700 Hz untuk kapal kurang dari 75 meter.`,ex:`Nada suling memberi petunjuk ukuran kapal: nada berat = kapal besar.`},
{k:'1c',l:`1(c)`,en:`Sound signal intensity and range of audibility. A whistle fitted in a vessel shall provide, in the direction of maximum intensity of the whistle and at a distance of 1 metre from it, a sound pressure level in at least one 1/3-octave band within the range of frequencies 180–700 Hz (±1%) for a vessel of 20 metres or more in length, or 180–2100 Hz (±1%) for a vessel of less than 20 metres in length, of not less than the appropriate figure given in the table below.
– 200 m or more: 143 dB, audibility range 2 miles;
– 75 m but less than 200 m: 138 dB, 1.5 miles;
– 20 m but less than 75 m: 130 dB, 1 mile;
– less than 20 m: 120 dB (180–450 Hz), 115 dB (450–800 Hz), 111 dB (800–2100 Hz), 0.5 mile.`,
id:`Kekuatan isyarat suara dan jarak dengar. Suling harus menghasilkan, pada arah intensitas maksimum dan jarak 1 meter, tingkat tekanan suara pada sekurang-kurangnya satu pita 1/3 oktaf dalam rentang 180–700 Hz (kapal ≥20 m) atau 180–2100 Hz (kapal <20 m) tidak kurang dari angka berikut:
– 200 m atau lebih: 143 dB, jarak dengar 2 mil;
– 75 m tetapi kurang dari 200 m: 138 dB, 1,5 mil;
– 20 m tetapi kurang dari 75 m: 130 dB, 1 mil;
– kurang dari 20 m: 120 dB (180–450 Hz), 115 dB (450–800 Hz), 111 dB (800–2100 Hz), 0,5 mil.`,
ex:`Tabel di dokumen sumber rusak pada baris 20–75 m; nilai yang benar 130 dB dan 1 mil.`,uj:`Jarak dengar: 2; 1,5; 1; 0,5 mil. Jarak dengar ini dalam kondisi tenang; angin dan bising bisa sangat menguranginya.`},
{k:'1d',l:`1(d)`,en:`Directional properties. The sound pressure level of a directional whistle shall be not more than 4 dB below the prescribed sound pressure level on the axis at any direction in the horizontal plane within ±45 degrees of the axis. The sound pressure level at any other direction in the horizontal plane shall be not more than 10 dB below the prescribed sound pressure level on the axis, so that the range in any direction will be at least half the range on the forward axis. The sound pressure level shall be measured in that 1/3-octave band which determines the audibility range.`,id:`Sifat arah. Tingkat tekanan suara suling berarah tidak boleh lebih dari 4 dB di bawah tingkat yang ditentukan pada sumbu, ke arah mana pun dalam bidang mendatar dalam ±45 derajat dari sumbu. Ke arah lain dalam bidang mendatar tidak boleh lebih dari 10 dB di bawahnya, sehingga jarak dengar ke segala arah sekurang-kurangnya setengah jarak dengar ke depan. Diukur pada pita 1/3 oktaf yang menentukan jarak dengar.`,ex:`Suling terdengar paling jauh ke depan, minimal separuhnya ke arah lain.`},
{k:'1e',l:`1(e)`,en:`Positioning of whistles. When a directional whistle is to be used as the only whistle on a vessel, it shall be installed with its maximum intensity directed straight ahead. A whistle shall be placed as high as practicable on a vessel, in order to reduce interception of the emitted sound by obstructions and also to minimize hearing damage risk to personnel. The sound pressure level of the vessel's own signal at listening posts shall not exceed 110 dB(A) and so far as practicable should not exceed 100 dB(A).`,id:`Penempatan suling. Suling berarah yang menjadi satu-satunya suling dipasang dengan intensitas maksimum mengarah lurus ke depan. Suling ditempatkan setinggi mungkin agar suaranya tidak terhalang dan risiko kerusakan pendengaran awak berkurang. Tingkat suara suling sendiri di pos dengar tidak boleh melebihi 110 dB(A) dan sedapat mungkin tidak melebihi 100 dB(A).`,ex:`Pos dengar di anjungan harus bisa mendengar isyarat kapal lain, jadi suling sendiri tidak boleh memekakkan.`},
