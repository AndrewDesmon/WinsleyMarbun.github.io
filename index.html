/* ================= SIMULASI: antarmuka ================= */
const rnd = (a, b) => a + Math.random()*(b - a);
const pick = a => a[Math.random()*a.length | 0];
const vec = (brg, d) => ({x:Math.sin(brg*D2R)*d, y:Math.cos(brg*D2R)*d});
let sm = null, jg = null, rd = null;
function simHalt(){
  if(sm){ sm.playing = false; cancelAnimationFrame(sm.raf); }
  if(jg && jg.iv){ clearInterval(jg.iv); jg.iv = null; }
  if(rd && rd.raf){ cancelAnimationFrame(rd.raf); rd.raf = null; }
}
const SMSPD = [[.5,'½×'],[1,'1×'],[2,'2×'],[4,'4×']];
const SMCOND = [['siang','Siang'],['malam','Malam'],['kabut','Kabut']];
function smNew(def, vk, opt){
  const vr = def.vars.find(v => v.k === vk) || def.vars[0];
  const pf = S.get('simpref', {});
  const keep = sm && sm.def === def;
  sm = {def, vr, b:smBuild(vr, def.vars), t:0, playing:false, raf:0, last:0,
    speed:pf.speed || 1, auto:pf.auto !== false, snd:pf.snd !== false, path:!!pf.path,
    view:keep ? sm.view : 'top', cond:keep ? sm.cond : (def.cond || 'siang'), obs:(vr.obs || ['A'])[0], look:0, ghost:false,
    opt:opt || (keep ? sm.opt : {}), si:-2, li:-1};
}
function smPref(){ S.set('simpref', {speed:sm.speed, auto:sm.auto, snd:sm.snd, path:sm.path}); }
const PLAYI = '<svg width="14" height="14" viewBox="0 0 16 16" aria-hidden="true"><path d="M4 2l10 6-10 6z" fill="currentColor"/></svg>';
const PAUSEI = '<svg width="14" height="14" viewBox="0 0 16 16" aria-hidden="true"><path d="M3 2h4v12H3zM9 2h4v12H9z" fill="currentColor"/></svg>';
function smHTML(){
  const {def, vr} = sm, lk = sm.opt.locked || [];
  return `<div class="smgrid"><div class="smL">${def.vars.length > 1 ? `<div class="rel smvar" role="group" aria-label="Pilih situasi">${def.vars.map(v => `<button class="chip" data-smvar="${v.k}" aria-pressed="${v === vr}" ${lk.includes(v.k) ? 'disabled' : ''}>${esc(v.l)}${lk.includes(v.k) ? ' (jawab dulu)' : ''}</button>`).join('')}</div>` : ''}
  <div class="smstage" id="smstage"><div class="smv" id="smv"></div><div class="smr" id="smr" hidden></div></div>
  <div class="smctl">
    <button class="btn smplay" id="smplay"></button>
    <button class="btn ghost" id="smre">Ulang</button>
    <span class="smtime" id="smtime"></span>
    <div class="seg" role="group" aria-label="Kecepatan putar">${SMSPD.map(([v,l]) => `<button data-smspd="${v}" aria-label="Kecepatan ${l}">${l}</button>`).join('')}</div>
  </div>
  <input type="range" class="range" id="smseek" min="0" max="${vr.dur}" step="0.05" value="0" aria-label="Waktu simulasi, menit">
  <div class="smopts">
    <div class="seg" role="group" aria-label="Sudut pandang"><button data-smview="top">Dari atas</button><button data-smview="bridge">Dari anjungan</button></div>
    <div class="seg" role="group" aria-label="Kondisi" id="smcondg">${SMCOND.map(([k,l]) => `<button data-smcond="${k}">${l}</button>`).join('')}</div>
  </div>
  <div class="smopts" id="smbopts"></div>
  <div class="smchk"><label><input type="checkbox" id="smauto"> Jeda di momen penting</label><label><input type="checkbox" id="smsnd"> Bunyikan isyarat</label><label><input type="checkbox" id="smpath"> Tampilkan jalur</label></div>
  <p class="fine" id="smseen"></p></div><div class="smR">
  <div class="callout smcap" id="smcap" aria-live="polite"></div>
  <div id="smlog"></div>
  <h2 class="sec">Langkah demi langkah</h2>
  <p class="fine" style="margin-top:-4px">Ketuk satu langkah untuk melompat ke saat itu.</p>
  <ol class="smsteps" id="smsteps">${vr.steps.map((st, i) => `<li><button data-smstep="${i}"><span class="smt">${mmss(st.t)}</span><span>${esc(smText(sm.b, st))}${st.snd ? ` <span class="pat smpat">${patHTML(st.snd)}</span>` : ''}</span></button></li>`).join('')}</ol></div></div>`;
}
function smInit(){
  const root = $('#smroot'); if(!root || !sm) return;
  root.innerHTML = smHTML();
  root.onclick = e => {
    const b = e.target.closest('button'); if(!b || b.disabled) return;
    const d = b.dataset;
    if(d.smvar){ smPause(); smNew(sm.def, d.smvar); if(sm.def.r) history.replaceState(null, '', `#/simulasi/${sm.def.id}/${d.smvar}`); smInit(); return; }
    if(b.id === 'smplay'){ smToggle(); return; }
    if(b.id === 'smre'){ smPause(); smSeek(0); return; }
    if(d.smspd){ sm.speed = +d.smspd; smPref(); smUI(); return; }
    if(d.smview){ sm.view = d.smview; smDraw(true); return; }
    if(d.smcond){ sm.cond = d.smcond; smDraw(true); return; }
    if(d.smobs){ sm.obs = d.smobs; smDraw(true); return; }
    if(d.smlook !== undefined){ sm.look = +d.smlook; smDraw(true); return; }
    if(d.smstep !== undefined){ smPause(); smSeek(sm.vr.steps[+d.smstep].t); reveal('#smstage'); return; }
  };
  $('#smseek').oninput = e => { smPause(); smSeek(+e.target.value); };
  $('#smauto').checked = sm.auto; $('#smauto').onchange = e => { sm.auto = e.target.checked; smPref(); };
  $('#smsnd').checked = sm.snd; $('#smsnd').onchange = e => { sm.snd = e.target.checked; if(!sm.snd) stopSnd(); smPref(); };
  $('#smpath').checked = sm.path; $('#smpath').onchange = e => { sm.path = e.target.checked; smPref(); smDraw(); };
  smDraw(true);
}
function smPause(){ if(!sm) return; sm.playing = false; cancelAnimationFrame(sm.raf); smUI(); }
function smSeek(t){ sm.t = clamp(t, 0, sm.vr.dur); smDraw(); }
function smToggle(){
  if(sm.playing){ smPause(); return; }
  if(sm.t >= sm.vr.dur - 1e-6) sm.t = 0;
  if(sm.snd){ try{ actx(); }catch(e){} }
  sm.playing = true; sm.last = 0; smUI();
  sm.raf = requestAnimationFrame(smLoop);
}
function smLoop(ts){
  if(!sm || !sm.playing) return;
  if(!document.getElementById('smv')){ sm.playing = false; return; }
  const dt = sm.last ? Math.min(.1, (ts - sm.last)/1000) : 0; sm.last = ts;
  const vr = sm.vr; let nt = sm.t + dt*vr.dur/40*sm.speed;
  for(const st of vr.steps){
    if(st.t > sm.t + 1e-9 && st.t <= nt){
      if(st.snd && sm.snd) playPat(st.snd);
      if(st.stop && sm.auto){ nt = st.t; sm.playing = false; break; }
    }
  }
  if(nt >= vr.dur){ nt = vr.dur; sm.playing = false; smDone(); }
  sm.t = nt; smDraw();
  if(sm.playing) sm.raf = requestAnimationFrame(smLoop); else smUI();
}
function smDone(){
  if(sm.def.r){ const s = new Set(S.get('simdone', [])); s.add(sm.def.id); S.set('simdone', [...s]); }
  if(sm.opt.onEnd) sm.opt.onEnd();
}
function smUI(){
  const p = $('#smplay'); if(!p) return;

function rdStart(){

function rdGeom(P0, cpa, tc){
  const R0 = Math.hypot(P0.x, P0.y), ux = -P0.x/R0, uy = -P0.y/R0, al = Math.asin(Math.min(cpa/R0, .99))*(Math.random() < .5 ? 1 : -1);
  const dx = ux*Math.cos(al) - uy*Math.sin(al), dy = ux*Math.sin(al) + uy*Math.cos(al), sp = R0*Math.cos(al)/tc;
  return {x:dx*sp, y:dy*sp};
}
/* ---- baringan kompas ---- */
function rdbGen(){
  const type = pick(['tetap','tetap','berubah','tunda','besar']);
  for(let k = 0; k < 600; k++){
    const H = (Math.random()*72 | 0)*5, Vo = vec(H, .2);
    const rb = (Math.random() < .5 ? 1 : -1)*rnd(25, 65);
    const R0 = type === 'besar' ? rnd(2.6, 3.1) : type === 'tunda' ? rnd(3.8, 4.5) : rnd(5, 6.5);
    const tc = type === 'besar' ? rnd(11, 14) : type === 'tunda' ? rnd(16, 20) : rnd(17, 24);
    const cpa = type === 'berubah' ? rnd(2.2, 3) : type === 'besar' ? rnd(.22, .35) : rnd(0, .04);
    const P0 = vec(H + rb, R0), Vr = rdGeom(P0, cpa, tc), Vt = {x:Vr.x + Vo.x, y:Vr.y + Vo.y};
    const kt = Math.hypot(Vt.x, Vt.y)*60, ct = a360(Math.atan2(Vt.x, Vt.y)/D2R);
    if(kt < (type === 'tunda' ? 5 : 7) || kt > (type === 'tunda' ? 10 : 20)) continue;
    const iv = type === 'besar' ? 2 : 3;
    const own = t => ({x:Vo.x*t, y:Vo.y*t}), tgt = t => ({x:P0.x + Vt.x*t, y:P0.y + Vt.y*t});
    const tug = t => { const p = tgt(t), f = .6/(kt/60); return {x:p.x + Vt.x*f, y:p.y + Vt.y*f}; };
    const meas = type === 'tunda' ? tug : tgt;
    const brg = t => brgTo(own(t), meas(t));
    const ch = Math.abs(Math.round(brg(2*iv)) - Math.round(brg(0)));
    if(type === 'tetap' && ch > 0) continue;
    if(type === 'berubah' && ch < 4) continue;
    if((type === 'tunda' || type === 'besar') && ch < 3) continue;
    const asp = a360(brgTo(tgt(0), own(0)) - ct);
    if(asp > 100 && asp < 260) continue;
    return {type, H, Vt, kt, ct, P0, tc, cpa, iv, own, tgt, tug, meas, rb};
  }
  return rdbGen();
}
function rdbScene(g, t){
  const o = g.own(t), p = g.tgt(t), ships = {A:{sp:{id:'A'}, pts:[{x:o.x, y:o.y, h:g.H, s:12}]}}, order = ['A'];
  if(g.type === 'tunda'){ const q = g.tug(t); ships.B = {sp:{id:'B', v:'tow200', L:40, k:'tug'}, pts:[{x:q.x, y:q.y, h:g.ct, s:g.kt}]}; ships.C = {sp:{id:'C', v:'barge', L:110, k:'barge', tow:'B'}, pts:[{x:p.x, y:p.y, h:g.ct, s:g.kt}]}; order.push('B', 'C'); }
  else { ships.B = {sp:{id:'B', v:'pwr50', L:g.type === 'besar' ? 330 : 150, k:'pwr'}, pts:[{x:p.x, y:p.y, h:g.ct, s:g.kt}]}; order.push('B'); }
  return {ships, order, own:'A'};
}

function rdpGen(){
  for(let k = 0; k < 800; k++){
    const H = (Math.random()*72 | 0)*5, Vo = vec(H, .2);
    const risky = Math.random() < .72, fwd = Math.random() < .7;
    const cpa = risky ? rnd(0, 1.3) : rnd(2.6, 3.6);
    const rb = (Math.random() < .5 ? 1 : -1)*(fwd ? rnd(5, 70) : rnd(110, 155));
    const R0 = rnd(7, 10.5), tcp = rnd(10, 22), tc = 6 + tcp;
    const P0 = vec(H + rb, R0), Vr = rdGeom(P0, cpa, tc), Vt = {x:Vr.x + Vo.x, y:Vr.y + Vo.y};
    const kt = Math.hypot(Vt.x, Vt.y)*60, ct = a360(Math.atan2(Vt.x, Vt.y)/D2R);
    if(kt < 6 || kt > 22) continue;
    const P = t => ({x:P0.x + Vr.x*t, y:P0.y + Vr.y*t}), P6 = P(6), R6 = Math.hypot(P6.x, P6.y), rb6 = a180(Math.atan2(P6.x, P6.y)/D2R - H);
    if(R6 < 3.5 || R6 > 11) continue;
    if(Math.abs(Math.abs(rb6) - 90) < 15) continue;
    if(fwd !== Math.abs(rb6) < 90) continue;
    if(Math.abs(rb6) < 90 && Math.abs(a180(ct - H)) < 40) continue;
    return {H, Vo, Vt, Vr, kt, ct, P0, P, cpa, tc, tcp, rb6, risky};
  }
  return rdpGen();
}

function ttsNorm(t, en){

  t = t.replace(/\b(Annex|Seksi|Section|Lampiran|Bagian|Articles?|Pasal)\s+(VIII|VII|VI|IV|IX|III|II|I|V|X)\b/g, (m, w, r) => `${w} ${ROMU[r]}`);
  t = t.replace(/(^|\n)\s*\(([ivx]{1,4})\)\s*/g, (m, a, r) => ROMN[r] ? `${a}${en ? 'Item' : 'Butir'} ${ROMN[r]}. ` : m);
  t = t.replace(/(^|\n)\s*\(([a-z])\)\s*/g, (m, a, l) => `${a}${en ? 'Paragraph' : 'Huruf'} ${l}. `);
  t = t.replace(/(\d+)((?:\([a-z0-9]{1,4}\))+)/g, (m, n, rest) => n + ' ' + [...rest.matchAll(/\(([a-z0-9]{1,4})\)/g)].map((x, j) => j === 0 ? (en ? x[1] : `ayat ${x[1]}`) : ROMN[x[1]] ? (en ? `${ROMN[x[1]]}` : `butir ${ROMN[x[1]]}`) : x[1]).join(' '));
  t = t.replace(/\b(paragraphs?|sub-paragraphs?|subparagraphs?|sub-paragraf|subparagraf|paragraf|ketentuan|ayat|huruf|butir|Rule|Aturan|atau|or|and|dan)\s+\(([a-z])\)((?:\([ivx]{1,4}\))*)/gi, (m, w, l, rest) => `${w} ${l}` + [...rest.matchAll(/\(([ivx]{1,4})\)/g)].map(x => en ? ` ${ROMN[x[1]]}` : ` butir ${ROMN[x[1]]}`).join(''));
  t = t.replace(/(^|[\s(])\(([ivx]{1,4})\)(?=[\s,.;:)]|$)/g, (m, a, r) => ROMN[r] ? `${a}${en ? 'item' : 'butir'} ${ROMN[r]}` : m);
  t = t.replace(/(^|\s)\(([a-z])\)(?=[\s,.;:]|$)/g, (m, a, l) => `${a}${en ? 'item' : 'huruf'} ${l}`);
  t = t.replace(/\b(0\d\d)\s?°/g, (m, d) => d.split('').map(x => (en ? DIGEN : DIGID)[x]).join(' ') + (en ? ' degrees' : ' derajat'));
  t = t.replace(/(\d+(?:[.,]\d+)?)\s?°/g, `$1 ${en ? 'degrees' : 'derajat'}`).replace(/°/g, en ? ' degrees' : ' derajat');
  t = t.replace(/(\d)\s?[–—]\s?(\d)/g, `$1 ${en ? 'to' : 'sampai'} $2`);
  t = t.replace(/(\d)\s?(cm|km|kn|kHz|Hz|dB|m)\b/g, (m, d, u) => `${d} ${(en ? {cm:'centimetres', km:'kilometres', kn:'knots', kHz:'kilohertz', Hz:'hertz', dB:'decibels', m:'metres'} : {cm:'sentimeter', km:'kilometer', kn:'knot', kHz:'kilohertz', Hz:'hertz', dB:'desibel', m:'meter'})[u]}`);
  t = t.replace(/×/g, en ? ' times ' : ' kali ').replace(/%/g, en ? ' percent' : ' persen').replace(/&/g, en ? ' and ' : ' dan ');
  if(!en) t = t.replace(/([A-Za-z])\/([A-Za-z])/g, '$1 atau $2');

}
function ttsIsEn(q){
  if(/[^\x00-\x7F]/.test(q.replace(/[–—]/g, ''))) return false;
  const w = q.toLowerCase().match(/[a-z']+/g) || [];
  if(!w.length || w.some(x => IDW.has(x))) return false;
  const e = w.filter(x => ENW.has(x) || (x.length >= 5 && /(ing|ly|tion|tions|ance|ances|ence|ness|ity|ive|ment|ous|ful|ial|ble|ed)$/.test(x))).length;
  return e >= 1 && e/w.length >= .3;
}
function ttsParts(text, lang){
  if(lang === 'en') return [{t:text, l:'en'}];
  const out = []; let last = 0;
  String(text).replace(/"([^"]{3,})"/g, (m, q, i) => { if(ttsIsEn(q)){ if(i > last) out.push({t:text.slice(last, i), l:'id'}); out.push({t:q, l:'en'}); last = i + m.length; } return m; });
  if(last < text.length) out.push({t:text.slice(last), l:'id'});
  return out.filter(p => p.t.replace(/[\s.,:;()"']/g, '').length);
}
function ttsChunks(text, max = 180){
  const out = [];
  String(text).split(/\n+/).forEach(line => {
    line = line.trim(); if(!line) return;
    let cur = '';
    const push = s => { if(cur && (cur + ' ' + s).length > max){ out.push(cur); cur = ''; } cur = cur ? cur + ' ' + s : s; };
    for(const s of line.split(/(?<=[.!?;:])\s+/)){
      if(s.length <= max){ push(s); continue; }
      for(const p of s.split(/(?<=,)\s+/)){
        if(p.length <= max){ push(p); continue; }
        const ws = p.split(' '); let b = '';
        for(const w of ws){ if(b && (b + ' ' + w).length > max){ push(b); b = ''; } b = b ? b + ' ' + w : w; }
        if(b) push(b);
      }
    }
    if(cur) out.push(cur);
  });
  return out;
}
const ttsLbl = r => typeof r.n === 'number' ? `Aturan ${r.n}` : r.lbl;

}

const LSCOPE = [['all','Semua materi'],['B','Olah gerak (Bagian B)'],['C','Lampu dan sosok'],['D','Isyarat'],['AEF','Umum, pengecualian, verifikasi'],['done','Yang sudah saya pahami']];
let ls = null;
function lsPool(k){
  const all = RULES.flatMap(r => r.subs.map(s => ({r, s, id:subId(r, s)}))).filter(x => typeof x.r.n === 'number');
  if(k === 'B') return all.filter(x => /^B/.test(x.r.p));
  if(k === 'C') return all.filter(x => x.r.p === 'C');
  if(k === 'D') return all.filter(x => x.r.p === 'D');
  if(k === 'AEF') return all.filter(x => ['A','E','F'].includes(x.r.p));
  if(k === 'done') return all.filter(x => done.has(x.id));
  return all;
}

async function lsStart(scope){

  const pick = shuffle(Object.values(byRule)).slice(0, 5).map(g => g.find(x => x.s.uj) || g[0]);
  while(pick.length < 5 && pool.length > pick.length){ const x = pick.length < pool.length ? shuffle(pool).find(y => !pick.includes(y)) : null; if(!x) break; pick.push(x); }
  ls = {scope, items:pick.map(x => ({...x, q:'', a:'', g:null})), i:0};
  box.innerHTML = `<div class="panel"><p class="muted" style="margin:0">Penguji sedang menyiapkan pertanyaan…</p></div>`;
  t4Ctl = new AbortController();

    const prompt = `Kamu penguji ujian lisan COLREGs (Peraturan Internasional Pencegahan Tubrukan di Laut 1972, edisi konsolidasi 2018) untuk calon perwira kapal niaga di Indonesia. Untuk setiap ketentuan di bawah, tulis SATU pertanyaan lisan dalam bahasa Indonesia yang wajar diajukan penguji: minta peserta menjelaskan isi ketentuan dengan kata-kata sendiri, atau menerapkannya pada situasi singkat di laut. Jangan menyebut nomor aturan di dalam pertanyaan bila itu memberi jawaban. Maksimal 40 kata per pertanyaan.\n\n${ls.items.map((x, k) => `[${k + 1}] ${fl(x.r, x.s)} (${x.r.t})\nTeks asli: ${x.s.en}\nTerjemahan: ${x.s.id}`).join('\n\n')}\n\nBalas hanya JSON: {"pertanyaan": ["...", "...", "...", "...", "..."]} dengan urutan yang sama.`;
    const res = await AI.json(prompt, {signal:t4Ctl.signal, modelTier:'quick'});
    const arr = res && Array.isArray(res.pertanyaan) ? res.pertanyaan : [];
    ls.items.forEach((x, k) => { x.q = typeof arr[k] === 'string' && arr[k].trim() ? arr[k].trim() : ''; });
  }catch(e){
    if(e && e.code === 'cancelled') return;
    if(e && FATAL.includes(e.code)){ aiOff = true; lsMenu(); return; }
    if(e && e.code === 'rate_limited'){ box.innerHTML = `<div class="callout"><strong>${errMsg('rate_limited')}</strong></div>`; return; }

}

/* ---------- ekspor, impor, dan versi offline ---------- */
function exportData(){
  const data = {};
  try{ for(let i = 0; i < localStorage.length; i++){ const k = localStorage.key(i); if(k && k.startsWith('cj2:') && k !== 'cj2:__seed') data[k.slice(4)] = localStorage.getItem(k); } }catch(e){}
  return {app:'colregs-jaga-anjungan', v:1, at:new Date().toISOString(), data};
}
function importData(txt){
  let o; try{ o = JSON.parse(txt); }catch(e){ return 'File atau kode ini bukan data progres yang valid.'; }
  if(!o || o.app !== 'colregs-jaga-anjungan' || !o.data || typeof o.data !== 'object') return 'Data ini bukan ekspor dari aplikasi COLREGs: Jaga Anjungan.';
  const ent = Object.entries(o.data).filter(([k, v]) => typeof k === 'string' && typeof v === 'string' && /^[\w:-]{1,40}$/.test(k));
  for(const [, v] of ent){ try{ JSON.parse(v); }catch(e){ return 'Sebagian data rusak. Impor dibatalkan.'; } }
  if(!confirm(`Ganti progres di perangkat ini dengan data ekspor tanggal ${String(o.at || '').slice(0, 10)}? Progres yang ada sekarang akan ditimpa.`)) return '';
  try{
    Object.keys(localStorage).filter(k => k.startsWith('cj2:') && k !== 'cj2:__seed').forEach(k => localStorage.removeItem(k));
    ent.forEach(([k, v]) => localStorage.setItem('cj2:' + k, v));
  }catch(e){ return 'Penyimpanan browser penuh atau diblokir. Impor gagal.'; }
  done = new Set(S.get('done', [])); notes = S.get('notes', {}); qres = S.get('qres', {}); lang = S.get('lang', 'both'); best = S.get('best', null);
  applyMode(); S.set('rank', rankOf(points().total)); render();
  toast('<span><strong>Progres berhasil diimpor.</strong></span>');
  return '';
}
function offlineHTML(){
  const seed = JSON.stringify({at:Date.now(), data:exportData().data}).replace(/</g, '\\u003c');

}

}

function renderAI(id){

  $$('[data-sugg]', box).forEach(b => b.onclick = () => send(id, b.dataset.sugg));
  $('#stopbtn').onclick = () => aiCtl && aiCtl.abort();
  $$('[data-save]', box).forEach(b => b.onclick = () => {
    const t = turns[+b.dataset.save]; addNote(id, t.content, 'ai');
    b.textContent = 'Tersimpan di catatan'; b.disabled = true;

function setBusyUI(){
  const a = $('#askbtn'), st = $('#stopbtn');
  if(a){ a.disabled = aiBusy; a.textContent = aiBusy ? 'Menjawab…' : 'Kirim'; }
  if(st) st.hidden = !aiBusy;
}
async function send(id, q){
  q = (q || '').trim(); if(!q || aiBusy || !AI) return;
  const { r, s } = findSub(id); const turns = chats[id];
  turns.push({ role:'user', content:q });
  renderAI(id);
  const log = $('#chatlog');
  const pending = document.createElement('div'); pending.className = 'b a'; pending.innerHTML = '<p class="muted">Sedang berpikir…</p>';
  log.appendChild(pending); pending.scrollIntoView({block:'nearest'});
  aiBusy = true; setBusyUI();
  aiCtl = new AbortController();
  const history = turns.filter(t => !t.err).slice(-12).map(t => ({ role:t.role, content:t.content }));
  try{
    const res = await AI([{ role:'user', content:instr(r,s) }, ...history], {
      cache:false, signal:aiCtl.signal,
      onText: ({ text }) => { pending.innerHTML = fmt(text); }
    });
    turns.push({ role:'assistant', content: res.text + (res.truncated ? '\n\n(Jawaban terpotong. Minta bagian lanjutannya bila perlu.)' : '') });
  }catch(e){
    const code = e && e.code;
    if(e && e.text) turns.push({ role:'assistant', content:e.text });
    if(code !== 'cancelled') turns.push({ role:'assistant', content:errMsg(code), err:true });
    if(FATAL.includes(code)) aiOff = true;
  }finally{
    aiBusy = false;
    if(helpState && helpState.id === id && helpState.tab === 'ai') renderAI(id); else setBusyUI();
  }
}

function routeSVG(){
  const per = 9, dx = 38, dy = 62, x0 = 26, y0 = 34, R = dy/2;
  const pos = NUMR.map((r,i) => { const row = Math.floor(i/per), c = i % per; return [row % 2 ? x0 + (per-1-c)*dx : x0 + c*dx, y0 + row*dy]; });
  const rows = Math.ceil(NUMR.length/per), xr = x0 + (per-1)*dx;
  let d = `M${x0} ${y0}`;
  for(let r=0;r<rows;r++){
    const y = y0 + r*dy, last = r === rows-1, n = last ? NUMR.length - r*per : per;
    const xe = r % 2 ? x0 + (per-n)*dx : x0 + (n-1)*dx;
    d += ` H${xe}`;
    if(!last) d += r % 2 ? ` A${R} ${R} 0 0 0 ${x0} ${y+dy}` : ` A${R} ${R} 0 0 1 ${xr} ${y+dy}`;
  }
  const dots = NUMR.map((r,i) => {
    const dn = ruleDone(r), cls = dn === r.subs.length ? 'full' : dn ? 'part' : '';
    const [x,y] = pos[i];
    return `<a href="#/aturan/${r.n}" class="${cls}" aria-label="Aturan ${r.n}, ${esc(r.t)}, ${dn} dari ${r.subs.length} dipahami"><circle cx="${x}" cy="${y}" r="14"/><text x="${x}" y="${y}">${r.n}</text></a>`;
  }).join('');
  return `<svg class="route" viewBox="${x0-R-8} ${y0-20} ${xr-x0+2*R+16} ${(rows-1)*dy+40}" role="group" aria-label="Rute belajar Aturan 1 sampai ${NUMR.length}"><path class="trk" d="${d}"/>${dots}</svg>`;
}

  const answered = Object.keys(qres).length, correct = Object.values(qres).filter(v => v === 1).length;
  return `<h1 class="pg">Latihan</h1>
  <p class="lead">Bank soal berisi ${ALLQ.length} soal dari seluruh materi. Soal yang salah tersimpan untuk diulang.</p>
  <div id="qz"></div>
  <div id="qmenu">
    ${dailyCard()}
    ${(AI !== null && !aiOff) || PWA ? `<div class="panel"><div class="row"><div><strong>Ujian lisan dengan penguji AI</strong><div class="muted" style="font-size:15px">5 pertanyaan, jawab dengan kata-kata sendiri, dinilai 0 sampai 10${(() => { const h = S.get('lisan', {hist:[]}).hist || []; return h.length ? `. Terakhir: ${nf(h[h.length - 1].avg)}/10` : ''; })()}</div></div>${PWA && !AI ? `<a class="btn ghost" href="${AI_URL}" target="_blank" rel="noopener">Buka di claude.ai</a>` : `<a class="btn" href="#/latihan/lisan">Mulai</a>`}</div></div>` : ''}
    <div class="panel"><div class="row"><div><strong>Kuis acak 10 soal</strong><div class="muted" style="font-size:15px">Dari semua aturan yang sudah tersedia${best !== null ? `. Skor terbaik: ${best}/10` : ''}</div></div><button class="btn" data-quiz="all">Mulai</button></div></div>
    <div class="panel"><div class="row"><div><strong>Buku kesalahan</strong><div class="muted" style="font-size:15px">${wrong.length ? `${wrong.length} soal menunggu diulang` : 'Belum ada soal yang salah'}</div></div><div class="dbtns"><a class="btn ghost" href="#/latihan/kesalahan">Buka</a><button class="btn ${wrong.length ? '' : 'ghost'}" data-quiz="wrong" ${wrong.length ? '' : 'disabled'}>Ulangi</button></div></div></div>
    <div class="panel"><strong>Per bagian</strong><div class="rel" style="margin-top:10px">${Object.keys(PARTS).map(p => `<button class="chip" data-quiz="${p}">${esc(PARTS[p].t.replace('Bagian ','').replace(/:.*/,''))}</button>`).join('')}</div></div>
    <p class="fine">Soal dijawab: ${answered} dari ${ALLQ.length}, benar ${correct}.</p>
    ${[...new Set(Object.values(TOOLS).map(x => x.g))].map(g => `<h2 class="sec">${g}</h2>` + Object.entries(TOOLS).filter(([,x]) => x.g === g).map(([k,x]) => `<a class="rrow" href="#/latihan/${k}" style="grid-template-columns:1fr auto"><span class="tt">${x.t}<small>${x.d}</small></span><span class="pc">Buka</span></a>`).join('')).join('')}
  </div>`;
}
function startQuiz(kind){
  let pool = kind === 'all' ? ALLQ : kind === 'wrong' ? ALLQ.filter(q => qres[q.qid] === 0) : ALLQ.filter(q => q.p === kind);
  const qs = shuffle(pool).slice(0, 10).map(q => ({ ...q, o:shuffle(q.a) }));
  if(!qs.length) return;
  $('#qmenu').hidden = true;
  const el = $('#qz'); let i = 0, ok = 0; const miss = [];
  const show = () => {
    const x = qs[i];
    el.innerHTML = `<div class="panel"><div class="row"><span class="muted">Soal ${i+1} dari ${qs.length}</span><span class="score">${ok} benar</span></div>
      <div class="prog"><i style="width:${i/qs.length*100}%"></i></div><p class="qtext">${esc(x.q)}</p>
      <div class="opts">${x.o.map(o => `<button class="opt" data-o="${esc(o)}">${esc(o)}</button>`).join('')}</div><div class="fb"></div></div>`;
    $$('.opt', el).forEach(b => b.onclick = () => {
      const right = b.dataset.o === x.a[0]; record(x.qid, right);
      if(right) ok++; else miss.push(x);
      $$('.opt', el).forEach(o => { o.disabled = true; if(o.dataset.o === x.a[0]) o.classList.add('right'); });
      if(!right) b.classList.add('wrong');
      $('.score', el).textContent = `${ok} benar`;
      const last = i === qs.length - 1;
      $('.fb', el).innerHTML = `<p><strong>${right ? 'Benar.' : 'Belum tepat.'}</strong> ${esc(x.e)} <a href="#/aturan/${x.n}">Buka ${nm(x.n)}</a></p><button class="btn" id="qn">${last ? 'Lihat hasil' : 'Soal berikutnya'}</button>`;
      $('#qn').onclick = () => { if(last) end(); else { i++; show(); } };
      reveal('#qn');
    });
  };
  const end = () => {
    let note = '';
    if(kind === 'all' && qs.length === 10 && (best === null || ok > best)){ best = ok; S.set('best', best); note = ' Ini skor terbaik baru Anda.'; }
    el.innerHTML = `<div class="panel"><div class="big">${ok}/${qs.length}</div><p>${ok === qs.length ? 'Sempurna.' : ok >= qs.length*0.7 ? 'Bagus. Pelajari lagi soal yang terlewat.' : 'Buka lagi aturan yang terlewat, lalu coba ulang.'}${note}</p>
      ${miss.length ? `<div class="review"><strong>Perlu dipelajari lagi</strong>${miss.map(m => `<div>${esc(m.q)}<br><span class="x">${esc(m.a[0])}</span> <a href="#/aturan/${m.n}">${nm(m.n)}</a></div>`).join('')}</div>` : ''}
      <div class="actions" style="margin-top:14px"><button class="btn" id="qagain">Kuis baru</button><button class="btn ghost" id="qback">Kembali ke menu latihan</button></div></div>`;
    $('#qagain').onclick = () => startQuiz(kind === 'wrong' && !ALLQ.some(q => qres[q.qid] === 0) ? 'all' : kind);
    $('#qback').onclick = render;
  };
  show();
  window.scrollTo(0,0);
}
function simStatLine(){
  const sd = S.get('simdone', []).length, kn = Object.keys(S.get('kasus', {})).length, jb = S.get('jaga', {}), rs = S.get('radar', {n:0, ok:0});
  const j = ['siang','malam','kabut'].filter(m => jb[m]).map(m => `${m} ${jb[m].b}/16`).join(', ');
  return `Simulasi: ${sd} dari ${SIMORD.length} animasi ditonton sampai selesai, ${kn} dari ${KASUS.length} kasus dianalisis${j ? `, jaga anjungan terbaik ${j}` : ''}${rs.n ? `, latihan radar ${rs.ok}/${rs.n} benar` : ''}.`;
}
function vProfil(){
  const notesN = Object.values(notes).reduce((a,l) => a + l.length, 0);
  const answered = Object.keys(qres).length, correct = Object.values(qres).filter(v => v === 1).length;
  const aiState = AI === undefined ? 'Memeriksa…' : AI && !aiOff ? 'Tersedia (online)' : 'Tidak tersedia di tampilan ini';
  setTimeout(() => { dataMount(); aboutMount(); }, 0);
  const noteList = Object.entries(notes).map(([id, l]) => { const { r, s } = findSub(id); if(!s) return ''; return `<a class="hit" href="#/aturan/${r.n}${s.k ? '/' + s.k.replace(/-/g,'/') : ''}"><b>${fl(r,s)}: ${esc(r.t)}</b><span>${l.length} catatan. ${esc(l[l.length-1].x.slice(0,90))}${l[l.length-1].x.length > 90 ? '…' : ''}</span></a>`; }).join('');
  return `<h1 class="pg">Profil${OFFLINE ? '<span class="offl">Versi offline</span>' : ''}</h1>
  ${rankCard(true)}
  <div class="panel">
    <div class="row"><div><div class="big">${Math.round(done.size/TOTAL*100)}%</div><div class="muted">${done.size} dari ${TOTAL} sub-bagian dipahami</div></div>
    <div><div class="big">${answered ? Math.round(correct/answered*100) + '%' : '–'}</div><div class="muted">jawaban benar (${correct}/${answered})</div></div></div>
    <p class="fine">${simStatLine()}</p>
  </div>
  ${dailyCard()}
  <h2 class="sec">Statistik per bagian</h2>
  ${statsHTML()}
  <h2 class="sec">Catatan saya (${notesN})</h2>
  ${noteList || `<p class="muted">Belum ada catatan. Tekan tombol "Catatan" di bawah setiap sub-bagian${OFFLINE ? "" : ", atau simpan jawaban dari Tanya AI"}.</p>`}
  <h2 class="sec">Pengaturan</h2>
  <div class="panel">
    <div class="toggle"><span>Bahasa teks aturan</span><div class="seg">${[['both','Keduanya'],['id','Indonesia'],['en','English']].map(([k,l]) => `<button data-lang="${k}" aria-pressed="${lang===k}">${l}</button>`).join('')}</div></div>
    <div class="toggle"><span>Mode malam anjungan<br><span class="muted" style="font-size:14px">Tampilan merah untuk menjaga adaptasi mata saat jaga malam</span></span><button class="btn ghost" id="pmode">${S.get('mode','') === 'bridge' ? 'Matikan' : 'Nyalakan'}</button></div>
    ${OFFLINE ? '' : PWA && !AI ? `<div class="toggle"><span>Tanya AI dan ujian lisan<br><span class="muted" style="font-size:14px">Tersedia di versi claude.ai, butuh internet</span></span><a class="btn ghost" href="${AI_URL}" target="_blank" rel="noopener">Buka</a></div>` : `<div class="toggle"><span>Tanya AI dan ujian lisan</span><span class="muted">${aiState}</span></div>`}
    <div class="toggle"><span>Hapus semua progres dan catatan<br><span class="muted" style="font-size:14px">Tidak bisa dibatalkan</span></span><button class="btn ghost" id="preset">Hapus</button></div>
  </div>
  <h2 class="sec">Data dan versi offline</h2>
  ${pwaInstallHTML(false)}
  ${dataHTML()}
  <p class="fine">Progres dan catatan tersimpan di perangkat dan browser ini. Gunakan Ekspor untuk cadangan atau untuk memindahkannya ke perangkat lain.</p>
  ${aboutHTML()}`;
}

/* ---------- event binding ---------- */
function bind(view){
  const mqEl = $('#mq', view);
  if(mqEl) mqEl.oninput = () => { mq = mqEl.value; $('#mlist').innerHTML = materiList(); };
  const gq = $('#gq', view);
  if(gq) gq.oninput = () => { $('#glist').innerHTML = glossList(gq.value); };
  const pm = $('#pmode', view); if(pm) pm.onclick = () => modeBtn.click();
  const pr = $('#preset', view);
  if(pr) pr.onclick = () => {
    if(!confirm('Hapus semua progres, hasil latihan, dan catatan di perangkat ini?')) return;
    done = new Set(); notes = {}; qres = {}; best = null;
    ['done','notes','qres','best','last','box','simdone','jaga','kasus','radar','daily','lisan','rank'].forEach(k => { try{ localStorage.removeItem('cj2:'+k); }catch(e){} });
    render();
  };
}
document.addEventListener('click', e => {
  const t = e.target;
  const term = t.closest('.term'); if(term){ openTerm(+term.dataset.g); return; }
  const spk = t.closest('[data-speak]'); if(spk){ ttsSub(spk.dataset.speak); return; }
  const help = t.closest('[data-help]'); if(help){ openHelp(help.dataset.help); return; }
  const note = t.closest('[data-note]'); if(note){ openNotes(note.dataset.note); return; }
  const showen = t.closest('.showen'); if(showen){ showen.closest('.en').classList.remove('collapsed'); showen.remove(); return; }
  const lb = t.closest('[data-lang]');
  if(lb){ lang = lb.dataset.lang; S.set('lang', lang); const y = window.scrollY; render(); window.scrollTo(0, y); return; }
  const qz = t.closest('[data-quiz]'); if(qz && !qz.disabled){ startQuiz(qz.dataset.quiz); return; }
  const mk = t.closest('[data-mark]');
  if(mk){
    const id = mk.dataset.mark; const on = !done.has(id);
    on ? done.add(id) : done.delete(id); saveDone();
    mk.setAttribute('aria-pressed', on); mk.textContent = on ? '✓ Sudah paham' : 'Tandai paham';
    mk.closest('.sub').classList.toggle('done', on);
    const r = RMAP[route.n]; if(r){ const d = ruleDone(r); $('#rprog').textContent = `${d} dari ${r.subs.length} dipahami`; $('#rbar').style.width = `${d/r.subs.length*100}%`; }
    return;
  }
  const opt = t.closest('.chk .opt');
  if(opt && !opt.disabled){
    const box = opt.closest('.chk'); const qid = box.dataset.q; const q = ALLQ.find(x => x.qid === qid);
    const right = opt.dataset.o === q.a[0]; record(qid, right);
    $$('.opt', box).forEach(o => { o.disabled = true; if(o.dataset.o === q.a[0]) o.classList.add('right'); });
    if(!right) opt.classList.add('wrong');
    $('.fb', box).innerHTML = `<p><strong>${right ? 'Benar.' : 'Belum tepat.'}</strong> ${esc(q.e)}</p>`;
    $('.fb', box).scrollIntoView({block:'nearest'});
  }
});

if(!location.hash) history.replaceState(null, '', '#/');
render();

</script>
</body>
