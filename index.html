ex:`Malam hari sulit melihat sisi layar kapal lain. Jika Anda port tack dan ragu, anggap Anda yang menyingkir.`},
{k:'b',en:`For the purposes of this Rule the windward side shall be deemed to be the side opposite to that on which the mainsail is carried or, in the case of a square-rigged vessel, the side opposite to that on which the largest fore-and-aft sail is carried.`,
id:`Untuk keperluan aturan ini, sisi atas angin dianggap sebagai sisi yang berlawanan dengan sisi tempat layar utama dibentangkan, atau untuk kapal berlayar persegi (square-rigged), sisi yang berlawanan dengan sisi tempat layar memanjang (fore-and-aft) terbesar dibentangkan.`,
ex:`Sisi atas angin ditentukan dari posisi layar utama, bukan dari arah angin sebenarnya. Ini memudahkan penilaian dari kapal lain, terutama saat angin datang dari belakang.`,
uj:`Aturan 12 hanya untuk dua kapal layar. Kapal layar dengan kapal tenaga diatur oleh Aturan 18, kecuali dalam situasi menyusul (Aturan 13).`}
],
q:[
[`Dua kapal layar, angin dari sisi berbeda. Siapa yang menyingkir?`,[`Kapal yang menerima angin di sisi kiri`,`Kapal yang menerima angin di sisi kanan`,`Kapal yang lebih besar`,`Kapal yang lebih cepat`],`Aturan 12(a)(i).`],
[`Dua kapal layar, angin dari sisi yang sama. Siapa yang menyingkir?`,[`Kapal di atas angin (windward)`,`Kapal di bawah angin (leeward)`,`Kapal yang berada di sisi kanan`,`Kapal yang lebih kecil`],`Aturan 12(a)(ii).`],
[`Sisi atas angin ditentukan berdasarkan…`,[`Sisi yang berlawanan dengan sisi layar utama dibentangkan`,`Arah bendera di tiang`,`Arah arus`,`Arah haluan kapal`],`Aturan 12(b).`]
]});

rule({n:13,p:'B2',t:`Menyusul`,en:`Overtaking`,
sum:`Kapal yang menyusul selalu menyingkir, apa pun jenisnya. Menyusul berarti datang dari lebih dari 22,5° di belakang arah melintang (sektor lampu buritan). Jika ragu, anggap menyusul, dan status ini tidak berubah sampai lewat dan bebas.`,
mn:`"Yang dari belakang selalu mengalah, sampai benar-benar lewat."`,
rel:[9,18,21],
subs:[
{k:'a',en:`Notwithstanding anything contained in the Rules of Part B, Sections I and II, any vessel overtaking any other shall keep out of the way of the vessel being overtaken.`,
id:`Walaupun ada ketentuan apa pun dalam aturan-aturan Bagian B Seksi I dan II, setiap kapal yang menyusul kapal lain harus menyingkir dari kapal yang disusul.`,
ex:`Aturan menyusul "mengalahkan" hierarki Aturan 18. Kapal layar yang menyusul kapal tenaga tetap wajib menyingkir.`,
pm:`Seperti di jalan raya: kendaraan dari belakang yang bertanggung jawab menjaga jarak, apa pun jenis kendaraannya.`,
uj:`"Notwithstanding" berarti "walaupun". Berlaku untuk semua jenis kapal di Seksi I dan II. Dalam tampak terbatas tanpa saling melihat, yang dipakai Aturan 19.`},
{k:'b',en:`A vessel shall be deemed to be overtaking when coming up with another vessel from a direction more than 22.5 degrees abaft her beam, that is, in such a position with reference to the vessel she is overtaking, that at night she would be able to see only the sternlight of that vessel but neither of her sidelights.`,
id:`Kapal dianggap menyusul jika mendekati kapal lain dari arah lebih dari 22,5 derajat di belakang arah melintangnya, yaitu dalam posisi sedemikian rupa terhadap kapal yang disusul sehingga pada malam hari ia hanya dapat melihat lampu buritan kapal itu tetapi tidak satu pun lampu lambungnya.`,
ex:`Sektor menyusul sama dengan sektor lampu buritan (135°). Jika Anda hanya melihat lampu buritan putih kapal lain dan jaraknya makin dekat, Anda sedang menyusul.`,
eg:`Siang hari: jika Anda melihat buritan kapal lain dan hampir tidak melihat sisi lambungnya, kemungkinan besar Anda berada di sektor menyusul.`},
{k:'c',en:`When a vessel is in any doubt as to whether she is overtaking another, she shall assume that this is the case and act accordingly.`,
id:`Jika kapal ragu apakah ia sedang menyusul kapal lain, ia harus menganggap demikian dan bertindak sesuai dengan itu.`,
ex:`Di sekitar batas 22,5°, kadang yang terlihat lampu buritan dan kadang lampu lambung. Dalam keadaan ragu, anggap Anda menyusul.`},
{k:'d',en:`Any subsequent alteration of the bearing between the two vessels shall not make the overtaking vessel a crossing vessel within the meaning of these Rules or relieve her of the duty of keeping clear of the overtaken vessel until she is finally past and clear.`,
id:`Setiap perubahan baringan berikutnya antara kedua kapal tidak menjadikan kapal yang menyusul sebagai kapal yang bersilangan menurut aturan-aturan ini, dan tidak membebaskannya dari kewajiban menyingkir dari kapal yang disusul sampai ia akhirnya lewat dan bebas.`,
ex:`Sekali menyusul, tetap menyusul. Walaupun saat Anda sudah di samping kapal lain situasinya tampak seperti bersilangan, kewajiban Anda tidak berubah.`,
uj:`"Finally past and clear": kewajiban berakhir hanya setelah benar-benar lewat dan bebas.`}
],
q:[
[`Kapal dianggap menyusul jika datang dari arah lebih dari … di belakang arah melintang kapal lain.`,[`22,5°`,`10°`,`45°`,`90°`],`Aturan 13(b).`],
[`Kapal layar menyusul kapal tenaga. Siapa yang menyingkir?`,[`Kapal layar`,`Kapal tenaga`,`Keduanya`,`Tidak ada`],`Aturan 13(a) mendahului Aturan 18.`],
[`Saat menyusul, baringan berubah sehingga tampak seperti situasi bersilangan. Status Anda?`,[`Tetap kapal yang menyusul sampai lewat dan bebas`,`Menjadi kapal yang bersilangan`,`Menjadi kapal stand-on`,`Bebas dari kewajiban`],`Aturan 13(d).`]
]});

rule({n:14,p:'B2',t:`Situasi berhadapan`,en:`Head-on Situation`,
sum:`Dua kapal tenaga berhadapan lurus atau hampir lurus: keduanya berbelok ke kanan dan berpapasan sisi kiri dengan sisi kiri. Jika ragu, anggap situasi berhadapan.`,
mn:`"Merah dan hijau terlihat di depan? Belok kanan."`,
rel:[8,15,34],
subs:[
{k:'a',en:`When two power-driven vessels are meeting on reciprocal or nearly reciprocal courses so as to involve risk of collision each shall alter her course to starboard so that each shall pass on the port side of the other.`,
id:`Jika dua kapal tenaga bertemu dengan haluan yang berlawanan atau hampir berlawanan sehingga menimbulkan risiko tubrukan, masing-masing harus mengubah haluannya ke kanan sehingga masing-masing lewat di sisi kiri kapal lainnya.`,
ex:`Tidak ada kapal stand-on dalam situasi berhadapan: keduanya wajib berbelok ke kanan, sehingga berpapasan kiri dengan kiri.`,
uj:`Hanya untuk dua kapal TENAGA. Kapal tenaga yang berhadapan dengan kapal layar memakai Aturan 18.`},
{k:'b',en:`Such a situation shall be deemed to exist when a vessel sees the other ahead or nearly ahead and by night she could see the masthead lights of the other in a line or nearly in a line and/or both sidelights and by day she observes the corresponding aspect of the other vessel.`,
id:`Situasi tersebut dianggap ada jika sebuah kapal melihat kapal lain di depan atau hampir di depannya, dan pada malam hari ia dapat melihat lampu-lampu tiang kapal lain segaris atau hampir segaris dan/atau kedua lampu lambungnya, dan pada siang hari ia melihat kenampakan yang sesuai dari kapal lain itu.`,
ex:`Malam hari: lampu tiang terlihat segaris, dan lampu merah serta hijau terlihat bersamaan. Siang hari: kapal lain terlihat dari depan dengan kedua sisinya tampak seimbang.`},
{k:'c',en:`When a vessel is in any doubt as to whether such a situation exists she shall assume that it does exist and act accordingly.`,
id:`Jika kapal ragu apakah situasi tersebut ada, ia harus menganggap situasi itu ada dan bertindak sesuai dengan itu.`,
ex:`Ragu antara berhadapan atau bersilangan tipis? Anggap berhadapan dan berbelok ke kanan.`}
],
q:[
[`Dua kapal tenaga berhadapan lurus dengan risiko tubrukan. Tindakannya?`,[`Keduanya berbelok ke kanan`,`Keduanya berbelok ke kiri`,`Kapal yang lebih kecil menyingkir`,`Keduanya mempertahankan haluan`],`Aturan 14(a).`],
[`Malam hari, tanda situasi berhadapan adalah…`,[`Lampu tiang segaris dan kedua lampu lambung terlihat`,`Hanya lampu buritan yang terlihat`,`Hanya lampu hijau yang terlihat`,`Hanya lampu merah yang terlihat`],`Aturan 14(b).`],
[`Jika ragu apakah situasi berhadapan…`,[`Anggap situasi berhadapan dan bertindak`,`Anggap situasi bersilangan`,`Tunggu sampai jelas`,`Berbelok ke kiri`],`Aturan 14(c).`]
]});

rule({n:15,p:'B2',t:`Situasi bersilangan`,en:`Crossing Situation`,
sum:`Dua kapal tenaga bersilangan: kapal yang melihat kapal lain di sisi kanannya wajib menyingkir dan sebaiknya tidak memotong di depan haluannya.`,
mn:`"Lihat merah, Anda mengalah. Lihat hijau, Anda bertahan dengan waspada."`,
rel:[16,17,8],
subs:[
{k:'',en:`When two power-driven vessels are crossing so as to involve risk of collision, the vessel which has the other on her own starboard side shall keep out of the way and shall, if the circumstances of the case admit, avoid crossing ahead of the other vessel.`,
id:`Jika dua kapal tenaga bersilangan sehingga menimbulkan risiko tubrukan, kapal yang melihat kapal lain di sisi kanannya harus menyingkir dan, jika keadaan memungkinkan, harus menghindari memotong di depan kapal lain itu.`,
ex:`Kapal lain di sisi kanan Anda berarti Anda give-way. Cara terbaik biasanya berbelok ke kanan dengan tegas dan lewat di belakang buritannya, atau mengurangi kecepatan. Hindari memotong di depan haluannya.`,
pm:`Malam hari: jika Anda melihat lampu merah (sisi kiri) kapal lain, Anda yang menyingkir. Jika Anda melihat lampu hijaunya, kapal itulah yang menyingkir.`,
eg:`Anda berhaluan 000°. Kapal tenaga lain terlihat di baringan 045°, lampu merahnya tampak, dan baringannya tetap. Anda give-way: berbelok ke kanan dengan tegas atau kurangi kecepatan.`,
uj:`"Avoid crossing ahead" berlaku "if the circumstances of the case admit". Aturan ini hanya untuk dua kapal tenaga.`}
],
q:[
[`Dua kapal tenaga bersilangan, kapal lain berada di sisi kanan Anda. Anda adalah…`,[`Kapal yang menyingkir (give-way)`,`Kapal yang bertahan (stand-on)`,`Keduanya sama-sama menyingkir`,`Tergantung ukuran kapal`],`Aturan 15.`],
[`Malam hari Anda melihat lampu merah kapal tenaga yang bersilangan dengan Anda. Artinya…`,[`Anda yang menyingkir`,`Kapal itu yang menyingkir`,`Keduanya menyingkir`,`Tidak ada kewajiban`],`Lampu merah = sisi kiri kapal itu, berarti Anda berada di sisi kirinya dan ia ada di sisi kanan Anda.`],
[`Kapal give-way dalam situasi bersilangan sebaiknya…`,[`Menghindari memotong di depan kapal lain`,`Memotong di depan agar cepat lewat`,`Berbelok ke kiri`,`Menambah kecepatan`],`Aturan 15: "avoid crossing ahead".`]
]});

rule({n:16,p:'B2',t:`Tindakan kapal yang menyingkir`,en:`Action by Give-way Vessel`,
sum:`Kapal yang wajib menyingkir harus bertindak sedini mungkin dan secara nyata agar benar-benar menjauh.`,
mn:`"Dini dan nyata, jangan adu nyali."`,
rel:[8,17],
subs:[
{k:'',en:`Every vessel which is directed to keep out of the way of another vessel shall, so far as possible, take early and substantial action to keep well clear.`,
id:`Setiap kapal yang diharuskan menyingkir dari kapal lain, sedapat mungkin, harus mengambil tindakan sedini mungkin dan secara nyata untuk benar-benar menjauh.`,
ex:`Dua kata kunci: early (sedini mungkin) dan substantial (cukup besar). Tujuannya "keep well clear", bukan sekadar lolos tipis.`,
pm:`Jangan "adu nyali". Semakin dini Anda bertindak, semakin kecil perubahan yang dibutuhkan dan semakin jelas maksud Anda bagi kapal lain.`,
uj:`Kaitkan dengan Aturan 8(a) dan 8(b): tindakan harus tegas, tepat waktu, dan cukup besar.`}
],
q:[
[`Tindakan kapal give-way harus…`,[`Sedini mungkin dan nyata`,`Perlahan dan kecil`,`Menunggu kapal lain bertindak`,`Hanya berupa isyarat suling`],`Aturan 16: "early and substantial action".`],
[`Tujuan tindakan kapal give-way menurut Aturan 16 adalah…`,[`Benar-benar menjauh (keep well clear)`,`Lewat sedekat mungkin`,`Mempertahankan haluan`,`Membuat kapal lain menyingkir`],`"To keep well clear".`],
[`Aturan 16 berlaku untuk…`,[`Setiap kapal yang diharuskan menyingkir`,`Hanya kapal tenaga`,`Hanya kapal layar`,`Hanya kapal di dalam kabut`],`"Every vessel which is directed to keep out of the way".`]
]});

rule({n:17,p:'B2',t:`Tindakan kapal yang bertahan`,en:`Action by Stand-on Vessel`,
sum:`Kapal stand-on punya tiga tahap: wajib bertahan, boleh bertindak bila kapal give-way jelas tidak bertindak, dan wajib bertindak bila tubrukan tak bisa dihindari oleh kapal give-way saja. Dalam situasi bersilangan, jangan berbelok ke kiri untuk kapal di sisi kiri.`,
mn:`"Bertahan, Boleh, Wajib."`,
rel:[15,16,34,2],
subs:[
{k:'a-i',en:`Where one of two vessels is to keep out of the way the other shall keep her course and speed.`,
id:`Jika salah satu dari dua kapal harus menyingkir, kapal yang lain harus mempertahankan haluan dan kecepatannya.`,
ex:`Kewajiban pertama kapal stand-on adalah bertahan, agar kapal give-way bisa memperkirakan gerakannya. Bertahan berarti tidak berubah tanpa alasan.`},
{k:'a-ii',en:`The latter vessel may however take action to avoid collision by her manoeuvre alone, as soon as it becomes apparent to her that the vessel required to keep out of the way is not taking appropriate action in compliance with these Rules.`,
id:`Namun, kapal yang disebut terakhir itu boleh mengambil tindakan untuk menghindari tubrukan dengan olah geraknya sendiri, segera setelah jelas baginya bahwa kapal yang diharuskan menyingkir tidak mengambil tindakan yang tepat sesuai aturan-aturan ini.`,
ex:`Ini tahap "boleh" (may). Sebelum bertindak, biasanya bunyikan isyarat ragu, yaitu sedikitnya lima tiupan pendek dan cepat (Aturan 34(d)).`},
{k:'b',en:`When, from any cause, the vessel required to keep her course and speed finds herself so close that collision cannot be avoided by the action of the give-way vessel alone, she shall take such action as will best aid to avoid collision.`,
id:`Jika karena sebab apa pun kapal yang diharuskan mempertahankan haluan dan kecepatannya mendapati dirinya begitu dekat sehingga tubrukan tidak dapat dihindari dengan tindakan kapal give-way saja, ia harus mengambil tindakan yang paling membantu untuk menghindari tubrukan.`,
ex:`Ini tahap "wajib" (shall). Pada titik ini kapal stand-on harus melakukan apa pun yang terbaik untuk menghindari tubrukan.`},
{k:'c',en:`A power-driven vessel which takes action in a crossing situation in accordance with sub-paragraph (a)(ii) of this Rule to avoid collision with another power-driven vessel shall, if the circumstances of the case admit, not alter course to port for a vessel on her own port side.`,
id:`Kapal tenaga yang mengambil tindakan dalam situasi bersilangan sesuai sub-paragraf (a)(ii) aturan ini untuk menghindari tubrukan dengan kapal tenaga lain, jika keadaan memungkinkan, tidak boleh mengubah haluan ke kiri untuk kapal yang berada di sisi kirinya.`,
ex:`Kapal give-way (yang berada di sisi kiri Anda) kemungkinan akan berbelok ke kanan. Jika Anda berbelok ke kiri, Anda justru berbelok ke arahnya, dan kedua kapal bisa bertubrukan.`,
pm:`Bayangkan dua orang di lorong yang sama-sama menghindar ke sisi yang sama. Aturan ini mencegah hal itu.`},
{k:'d',en:`This Rule does not relieve the give-way vessel of her obligation to keep out of the way.`,
id:`Aturan ini tidak membebaskan kapal give-way dari kewajibannya untuk menyingkir.`,
ex:`Walaupun kapal stand-on sudah bertindak, kapal give-way tetap wajib menyingkir.`,
uj:`Tiga tahap kapal stand-on: (1) WAJIB bertahan, (2) BOLEH bertindak bila give-way jelas tidak bertindak, (3) WAJIB bertindak bila tubrukan tak bisa dihindari oleh give-way saja.`}
],
q:[
[`Kewajiban pertama kapal stand-on adalah…`,[`Mempertahankan haluan dan kecepatan`,`Segera berbelok ke kanan`,`Mengurangi kecepatan`,`Membunyikan satu tiupan pendek`],`Aturan 17(a)(i).`],
[`Kapan kapal stand-on WAJIB bertindak?`,[`Saat tubrukan tidak dapat dihindari oleh tindakan kapal give-way saja`,`Segera setelah melihat kapal lain`,`Tidak pernah`,`Saat kapal lain membunyikan suling`],`Aturan 17(b).`],
[`Dalam situasi bersilangan, kapal stand-on yang bertindak menurut (a)(ii) sebaiknya tidak…`,[`Berbelok ke kiri untuk kapal di sisi kirinya`,`Berbelok ke kanan`,`Mengurangi kecepatan`,`Membunyikan isyarat`],`Aturan 17(c).`]
]});

rule({n:18,p:'B2',t:`Tanggung jawab antar kapal`,en:`Responsibilities between Vessels`,
lead:{en:`Except where Rules 9, 10 and 13 otherwise require:`,id:`Kecuali jika Aturan 9, 10, dan 13 menentukan lain:`},
sum:`Hierarki hak jalan: NUC, RAM, (CBD), kapal ikan, kapal layar, kapal tenaga. Kapal yang lebih rendah menyingkir dari yang lebih tinggi. Pengecualian: alur sempit, TSS, dan situasi menyusul.`,
mn:`Urutan NUC, RAM, CBD, Ikan, Layar, Tenaga: "Nanti Rasakan Cobaan, Ikuti Laut Tenang".`,
rel:[3,9,10,13,8],
subs:[
{k:'a',en:`A power-driven vessel underway shall keep out of the way of:
(i) a vessel not under command;
(ii) a vessel restricted in her ability to manoeuvre;
(iii) a vessel engaged in fishing;
(iv) a sailing vessel.`,
id:`Kapal tenaga yang sedang berlayar harus menyingkir dari:
(i) kapal yang tidak dapat diolah gerak (NUC);
(ii) kapal yang terbatas kemampuan olah geraknya (RAM);
(iii) kapal yang sedang menangkap ikan;
(iv) kapal layar.`,
ex:`Kapal tenaga paling leluasa bermanuver, jadi ia menyingkir dari hampir semua jenis kapal lain.`,
eg:`Kapal layar menyusul kapal tenaga dari belakang: kapal layar yang menyingkir, karena Aturan 13 didahulukan.`,
uj:`Ingat kalimat pembuka: kecuali Aturan 9 (alur sempit), 10 (TSS), dan 13 (menyusul) menentukan lain.`},
{k:'b',en:`A sailing vessel underway shall keep out of the way of:
(i) a vessel not under command;
(ii) a vessel restricted in her ability to manoeuvre;
(iii) a vessel engaged in fishing.`,
id:`Kapal layar yang sedang berlayar harus menyingkir dari:
(i) kapal yang tidak dapat diolah gerak (NUC);
(ii) kapal yang terbatas kemampuan olah geraknya (RAM);
(iii) kapal yang sedang menangkap ikan.`,
ex:`Kapal layar lebih tinggi hak jalannya daripada kapal tenaga, tetapi tetap di bawah kapal ikan, RAM, dan NUC.`},
{k:'c',en:`A vessel engaged in fishing when underway shall, so far as possible, keep out of the way of:
(i) a vessel not under command;
(ii) a vessel restricted in her ability to manoeuvre.`,
id:`Kapal yang sedang menangkap ikan, saat sedang berlayar, sedapat mungkin harus menyingkir dari:
(i) kapal yang tidak dapat diolah gerak (NUC);
(ii) kapal yang terbatas kemampuan olah geraknya (RAM).`,
ex:`"So far as possible": kapal ikan yang alat tangkapnya terpasang mungkin sulit bermanuver, jadi kewajibannya sejauh yang bisa dilakukan.`},
{k:'d',en:`(i) Any vessel other than a vessel not under command or a vessel restricted in her ability to manoeuvre shall, if the circumstances of the case admit, avoid impeding the safe passage of a vessel constrained by her draught, exhibiting the signals in Rule 28.
(ii) A vessel constrained by her draught shall navigate with particular caution having full regard to her special condition.`,
id:`(i) Setiap kapal selain kapal NUC atau kapal RAM, jika keadaan memungkinkan, harus menghindari menghalangi lintasan aman kapal yang terkendala oleh saratnya yang menunjukkan isyarat dalam Aturan 28.
(ii) Kapal yang terkendala oleh saratnya harus berlayar dengan kehati-hatian khusus dengan memperhatikan sepenuhnya kondisi khususnya.`,
ex:`Untuk CBD, kata yang dipakai "avoid impeding" (tidak menghalangi), bukan "keep out of the way". Ini hanya berlaku jika CBD memasang isyarat Aturan 28 (tiga lampu merah keliling atau satu silinder).`,
uj:`NUC dan RAM tidak terikat kewajiban terhadap CBD. CBD sendiri tetap wajib sangat berhati-hati.`},
{k:'e',en:`A seaplane on the water shall, in general, keep well clear of all vessels and avoid impeding their navigation. In circumstances, however, where risk of collision exists, she shall comply with the Rules of this Part.`,
id:`Pesawat laut di atas air, pada umumnya, harus menjauhi semua kapal dan menghindari menghalangi navigasi mereka. Namun dalam keadaan di mana ada risiko tubrukan, ia harus mematuhi aturan-aturan dalam Bagian ini.`,
ex:`Pesawat laut umumnya menjauh dari semua kapal. Jika risiko tubrukan sudah terjadi, ia mengikuti aturan Bagian B seperti kapal lain.`},
{k:'f',en:`(i) A WIG craft shall, when taking off, landing and in flight near the surface, keep well clear of all other vessels and avoid impeding their navigation;
(ii) a WIG craft operating on the water surface shall comply with the Rules of this Part as a power-driven vessel.`,
id:`(i) Wahana WIG, saat lepas landas, mendarat, dan terbang dekat permukaan, harus menjauhi semua kapal lain dan menghindari menghalangi navigasi mereka;
(ii) wahana WIG yang beroperasi di permukaan air harus mematuhi aturan-aturan dalam Bagian ini sebagai kapal tenaga.`,
ex:`Saat terbang rendah, WIG harus menjauhi semua kapal. Saat bergerak di permukaan air seperti kapal, ia diperlakukan sebagai kapal tenaga.`}
],
q:[
[`Kapal tenaga yang sedang berlayar wajib menyingkir dari…`,[`Kapal yang sedang menangkap ikan`,`Kapal tenaga lain yang sedang menyusulnya`,`Pesawat laut yang sedang terbang`,`Tidak ada kapal`],`Aturan 18(a)(iii). Kapal yang menyusul justru wajib menyingkir dari Anda (Aturan 13).`],
[`Kapal layar yang sedang berlayar wajib menyingkir dari…`,[`Kapal NUC`,`Kapal tenaga`,`Pesawat laut di atas air`,`WIG yang bergerak di permukaan air`],`Aturan 18(b)(i).`],
[`Terhadap kapal CBD yang memasang isyarat Aturan 28, kapal lain (selain NUC dan RAM) wajib…`,[`Menghindari menghalangi lintasan amannya`,`Selalu berhenti`,`Menyusul dari sisi kiri`,`Tidak punya kewajiban apa pun`],`Aturan 18(d)(i).`]
]});

rule({n:19,p:'B3',t:`Tindakan kapal dalam tampak terbatas`,en:`Conduct of Vessels in Restricted Visibility`,
sum:`Dalam tampak terbatas tanpa saling melihat, semua kapal wajib bertindak (tidak ada stand-on). Kecepatan aman, mesin siaga. Kapal di depan arah melintang: jangan belok kiri (kecuali yang disusul). Kapal di samping atau belakang: jangan belok ke arahnya. Mendengar isyarat kabut di depan: kurangi kecepatan ke minimum.`,
mn:`"Di kabut semua bertindak. Depan: kanan. Samping/belakang: menjauh. Dengar suling di depan: pelan."`,
rel:[3,6,7,8,11,35],
subs:[
{k:'a',en:`This Rule applies to vessels not in sight of one another when navigating in or near an area of restricted visibility.`,
id:`Aturan ini berlaku bagi kapal-kapal yang tidak saling melihat saat berlayar di dalam atau dekat area tampak terbatas.`,
ex:`Dua syarat: tidak saling melihat, dan berada di dalam atau dekat area tampak terbatas. Termasuk saat Anda di area cerah tetapi ada kapal di dalam gumpalan kabut di dekat Anda.`},
{k:'b',en:`Every vessel shall proceed at a safe speed adapted to the prevailing circumstances and conditions of restricted visibility. A power-driven vessel shall have her engines ready for immediate manoeuvre.`,
id:`Setiap kapal harus bergerak dengan kecepatan aman yang disesuaikan dengan keadaan dan kondisi tampak terbatas yang ada. Kapal tenaga harus menyiapkan mesinnya untuk olah gerak segera.`,
ex:`"Engines ready for immediate manoeuvre" berarti kamar mesin dalam kondisi siaga (standby), siap mengubah putaran kapan saja.`},
{k:'c',en:`Every vessel shall have due regard to the prevailing circumstances and conditions of restricted visibility when complying with the Rules of Section I of this Part.`,
id:`Setiap kapal harus memperhatikan dengan saksama keadaan dan kondisi tampak terbatas yang ada saat mematuhi aturan-aturan dalam Seksi I Bagian ini.`,
ex:`Aturan 4 sampai 10 (pengamatan, kecepatan aman, risiko tubrukan, tindakan menghindar) tetap berlaku, dan harus diterapkan dengan lebih hati-hati.`},
{k:'d',en:`A vessel which detects by radar alone the presence of another vessel shall determine if a close-quarters situation is developing and/or risk of collision exists. If so, she shall take avoiding action in ample time, provided that when such action consists of an alteration of course, so far as possible the following shall be avoided:
(i) an alteration of course to port for a vessel forward of the beam, other than for a vessel being overtaken;
(ii) an alteration of course towards a vessel abeam or abaft the beam.`,
id:`Kapal yang mendeteksi keberadaan kapal lain hanya dengan radar harus menentukan apakah situasi berdekatan sedang berkembang dan/atau ada risiko tubrukan. Jika demikian, ia harus mengambil tindakan menghindar dalam waktu yang cukup lapang, dengan ketentuan bahwa jika tindakan itu berupa perubahan haluan, sedapat mungkin dihindari:
(i) perubahan haluan ke kiri untuk kapal yang berada di depan arah melintang, selain kapal yang sedang disusul;
(ii) perubahan haluan ke arah kapal yang berada di arah melintang atau di belakang arah melintang.`,
ex:`Dalam kabut, SEMUA kapal wajib bertindak, tidak ada kapal stand-on. Pedoman praktisnya: untuk kapal di depan arah melintang (selain yang Anda susul), berbeloklah ke kanan; untuk kapal di arah melintang atau di belakangnya, berbeloklah menjauhinya.`,
pm:`Ringkasnya: kapal di depan, belok kanan (kecuali Anda sedang menyusulnya). Kapal di samping atau belakang, belok menjauh darinya.`,
eg:`Radar menunjukkan kapal di haluan kiri depan 20°, jarak 4 mil, baringan tetap: berbelok ke kanan dengan tegas. Jika kapal itu berada tepat di lambung kanan (abeam), jangan berbelok ke kanan; berbelok ke kiri atau kurangi kecepatan.`,
uj:`Ingat pengecualian di (i): untuk kapal yang Anda susul, berbelok ke kiri diperbolehkan.`},
{k:'e',en:`Except where it has been determined that a risk of collision does not exist, every vessel which hears apparently forward of her beam the fog signal of another vessel, or which cannot avoid a close-quarters situation with another vessel forward of her beam, shall reduce her speed to the minimum at which she can be kept on her course. She shall if necessary take all her way off and in any event navigate with extreme caution until danger of collision is over.`,
id:`Kecuali telah dipastikan bahwa tidak ada risiko tubrukan, setiap kapal yang mendengar isyarat kabut kapal lain yang tampaknya berada di depan arah melintangnya, atau yang tidak dapat menghindari situasi berdekatan dengan kapal lain di depan arah melintangnya, harus mengurangi kecepatannya sampai minimum yang masih memungkinkan kapal dikemudikan pada haluannya. Jika perlu, ia harus menghentikan seluruh lajunya, dan dalam hal apa pun harus berlayar dengan sangat hati-hati sampai bahaya tubrukan berlalu.`,
ex:`Mendengar isyarat kabut di depan arah melintang berarti kurangi kecepatan ke minimum yang masih bisa dikemudikan (steerage way). Bila perlu, hentikan kapal.`,
uj:`Kata kunci: "reduce her speed to the minimum at which she can be kept on her course" dan "extreme caution".`}
],
q:[
[`Dalam kabut, kapal di depan arah melintang (bukan yang Anda susul) hanya terdeteksi radar dengan risiko tubrukan. Yang harus dihindari…`,[`Berbelok ke kiri`,`Berbelok ke kanan`,`Mengurangi kecepatan`,`Membunyikan isyarat kabut`],`Aturan 19(d)(i).`],
[`Anda mendengar isyarat kabut kapal lain di depan arah melintang. Tindakan Anda?`,[`Kurangi kecepatan ke minimum yang masih bisa dikemudikan`,`Tambah kecepatan agar cepat lewat`,`Berbelok tajam ke kiri`,`Pertahankan haluan dan kecepatan`],`Aturan 19(e).`],
[`Dalam tampak terbatas tanpa saling melihat, siapa kapal stand-on?`,[`Tidak ada; semua kapal wajib bertindak`,`Kapal yang berada di sisi kanan`,`Kapal yang lebih besar`,`Kapal yang disusul`],`Seksi II (stand-on/give-way) hanya berlaku bagi kapal yang saling melihat.`]
]});

const PARTS = {
 A:{t:`Bagian A: Umum`,d:`Aturan 1–3: penerapan, tanggung jawab, dan definisi.`},
 B1:{t:`Bagian B, Seksi I: Semua kondisi penglihatan`,d:`Aturan 4–10: pengamatan, kecepatan aman, risiko tubrukan, tindakan menghindar, alur sempit, TSS.`},
 B2:{t:`Bagian B, Seksi II: Kapal saling melihat`,d:`Aturan 11–18: kapal layar, menyusul, berhadapan, bersilangan, give-way, stand-on, hierarki.`},
 B3:{t:`Bagian B, Seksi III: Tampak terbatas`,d:`Aturan 19: tindakan kapal dalam kabut dan hujan lebat.`},
 C:{t:`Bagian C: Lampu dan sosok`,d:`Aturan 20–31: definisi, jarak tampak, dan lampu serta sosok tiap jenis kapal.`},
 D:{t:`Bagian D: Isyarat suara dan cahaya`,d:`Aturan 32–37: suling, bel, gong, isyarat olah gerak, isyarat kabut, isyarat bahaya.`},
 E:{t:`Bagian E: Pengecualian`,d:`Aturan 38: ketentuan peralihan bagi kapal lama.`},

const SOON = [];

const GLOSS = [
 {t:`Underway (sedang berlayar)`,m:[`underway`],d:`Kapal tidak berlabuh jangkar, tidak terikat ke darat, dan tidak kandas (Aturan 3(i)). Kapal yang hanyut dengan mesin mati tetap underway.`},
 {t:`Making way (laju)`,m:[`making way`,`take all way off`,`take all her way off`],d:`Kapal bergerak di air karena tenaga penggeraknya sendiri. Kapal bisa underway tetapi tidak making way, misalnya saat berhenti dan hanyut. "Take all way off" berarti menghentikan seluruh laju kapal.`},
 {t:`Power-driven vessel (kapal tenaga)`,m:[`power-driven vessel`,`power-driven vessels`,`kapal tenaga`],d:`Kapal yang digerakkan mesin (Aturan 3(b)), termasuk kapal layar yang sedang memakai mesinnya.`},
 {t:`Sailing vessel (kapal layar)`,m:[`sailing vessel`,`sailing vessels`,`kapal layar`],d:`Kapal yang berlayar dengan layar dan tidak sedang memakai mesin penggeraknya (Aturan 3(c)).`},
 {t:`Vessel engaged in fishing (kapal yang sedang menangkap ikan)`,m:[`vessel engaged in fishing`,`vessels engaged in fishing`,`kapal yang sedang menangkap ikan`],d:`Kapal yang alat tangkapnya membatasi olah gerak. Pancing tonda tidak termasuk (Aturan 3(d)).`},
 {t:`NUC: Not under command`,m:[`not under command`,`NUC`],d:`Kapal yang tidak dapat diolah gerak karena keadaan luar biasa, misalnya mesin atau kemudi rusak (Aturan 3(f)).`},
 {t:`RAM: Restricted in ability to manoeuvre`,m:[`restricted in her ability to manoeuvre`,`restricted in their ability to manoeuvre`,`RAM`],d:`Kapal yang terbatas olah geraknya karena sifat pekerjaannya, misalnya mengeruk atau memasang kabel (Aturan 3(g)).`},
 {t:`CBD: Constrained by her draught`,m:[`constrained by her draught`,`CBD`],d:`Kapal tenaga yang sangat terbatas untuk menyimpang dari haluannya karena saratnya dibandingkan kedalaman dan lebar perairan (Aturan 3(h)).`},
 {t:`Starboard (kanan)`,m:[`starboard`],d:`Sisi kanan kapal bila menghadap ke haluan. Lampu lambung kanan berwarna hijau.`},
 {t:`Port (kiri)`,m:[`port side`,`to port`,`wind on the port side`],d:`Sisi kiri kapal bila menghadap ke haluan. Lampu lambung kiri berwarna merah. Dalam konteks lain "port" juga berarti pelabuhan.`},
 {t:`Beam, abeam, abaft the beam (arah melintang)`,m:[`abaft the beam`,`abaft her beam`,`forward of the beam`,`forward of her beam`,`abeam`,`arah melintang`],d:`Beam adalah arah tegak lurus terhadap garis haluan-buritan kapal (90° dari haluan). Abeam: tepat di arah melintang. Abaft the beam: di belakang arah melintang. Forward of the beam: di depan arah melintang.`},
 {t:`Windward dan leeward (atas angin dan bawah angin)`,m:[`windward`,`leeward`,`atas angin`,`bawah angin`],d:`Windward: sisi atau posisi dari arah datangnya angin. Leeward: sisi atau posisi ke arah perginya angin. Dalam Aturan 12, sisi atas angin ditentukan dari sisi layar utama.`},
 {t:`Mainsail (layar utama)`,m:[`mainsail`,`layar utama`],d:`Layar terbesar pada tiang utama. Posisinya dipakai untuk menentukan sisi atas angin (Aturan 12(b)).`},
 {t:`Narrow channel dan fairway (alur sempit dan alur masuk)`,m:[`narrow channel`,`fairway`,`alur pelayaran sempit`],d:`Perairan yang lebar layaknya terbatas sehingga kapal besar hanya bisa berlayar aman di dalamnya. Fairway adalah alur yang biasa dilalui kapal, misalnya alur masuk pelabuhan (Aturan 9).`},
 {t:`TSS: Traffic separation scheme`,m:[`traffic separation scheme`,`traffic separation schemes`,`TSS`,`bagan pemisah lalu lintas`],d:`Bagan pemisah lalu lintas yang ditetapkan IMO, berisi jalur lalu lintas satu arah yang dipisahkan garis atau zona pemisah (Aturan 10).`},
 {t:`Separation zone/line (zona/garis pemisah)`,m:[`separation zone`,`separation line`,`traffic separation line`,`zona pemisah`,`garis pemisah`],d:`Zona atau garis yang memisahkan jalur lalu lintas berlawanan arah di TSS, seperti median jalan tol.`},
 {t:`Inshore traffic zone (zona lalu lintas pedalaman)`,m:[`inshore traffic zone`,`zona lalu lintas pedalaman`],d:`Area antara batas TSS dan pantai, untuk lalu lintas lokal dan kapal kecil (Aturan 10(d)).`},
 {t:`Close-quarters situation (situasi berdekatan)`,m:[`close-quarters situation`,`close quarters situation`,`situasi berdekatan`],d:`Situasi ketika kapal sudah begitu dekat sehingga tindakan satu kapal saja mungkin tidak cukup untuk menghindari tubrukan.`},
 {t:`Bearing (baringan)`,m:[`compass bearing`,`bearing`,`baringan`],d:`Arah suatu objek dari kapal Anda, diukur dalam derajat. Baringan yang tidak berubah sementara jarak berkurang menandakan risiko tubrukan (Aturan 7(d)).`},
 {t:`Radar plotting, CPA, dan TCPA`,m:[`radar plotting`,`plotting`],d:`Pencatatan posisi target radar secara berkala untuk menghitung arah, kecepatan, CPA (jarak terdekat yang akan terjadi), dan TCPA (waktu menuju jarak terdekat). ARPA melakukannya secara otomatis.`},
 {t:`Give-way vessel (kapal yang menyingkir)`,m:[`give-way vessel`,`keep out of the way`,`menyingkir`],d:`Kapal yang menurut aturan wajib menyingkir dari kapal lain (Aturan 16).`},
 {t:`Stand-on vessel (kapal yang bertahan)`,m:[`stand-on vessel`,`keep her course and speed`],d:`Kapal yang menurut aturan wajib mempertahankan haluan dan kecepatannya (Aturan 17).`},
 {t:`Impede (menghalangi)`,m:[`not impede`,`impede`,`impeding`,`menghalangi`],d:`Kewajiban "tidak menghalangi" berarti bertindak sejak awal agar kapal lain punya ruang lewat yang aman. Berbeda dari "menyingkir" yang baru muncul saat ada risiko tubrukan (Aturan 8(f)).`},
 {t:`Overtaking (menyusul)`,m:[`overtaking`,`overtake`,`menyusul`],d:`Mendekati kapal lain dari arah lebih dari 22,5° di belakang arah melintangnya (Aturan 13(b)).`},
 {t:`Restricted visibility (tampak terbatas)`,m:[`restricted visibility`,`tampak terbatas`],d:`Jarak penglihatan terbatas karena kabut, hujan lebat, salju, badai pasir, atau sebab serupa (Aturan 3(l)).`},
 {t:`In sight (saling melihat)`,m:[`in sight of one another`,`saling melihat`],d:`Satu kapal dapat diamati secara visual dari kapal lain (Aturan 3(k)). Kontak radar saja tidak termasuk.`},
 {t:`Fog signal (isyarat kabut)`,m:[`fog signal`,`isyarat kabut`],d:`Isyarat suara yang dibunyikan dalam tampak terbatas, diatur di Aturan 35.`},
 {t:`Good seamanship (praktik pelaut yang baik)`,m:[`good seamanship`,`ordinary practice of seamen`,`kebiasaan pelaut yang baik`],d:`Tindakan yang akan dilakukan pelaut yang cakap dan berhati-hati dalam keadaan yang sama, walaupun tidak tertulis di aturan (Aturan 2 dan 8).`},
 {t:`Sea room (ruang laut)`,m:[`sea room`,`ruang laut`],d:`Ruang perairan yang cukup untuk bermanuver dengan aman.`},
 {t:`Heading (haluan)`,m:[`heading`],d:`Arah yang ditunjuk oleh haluan kapal. Berbeda dengan lintasan di atas dasar laut (course over ground) yang dipengaruhi arus.`},
 {t:`Steerage way`,m:[`kept on her course`,`dikemudikan pada haluannya`],d:`Kecepatan minimum agar kapal masih bisa dikemudikan. Di bawah kecepatan ini, kemudi tidak lagi efektif.`},
 {t:`Sternlight dan sidelights`,m:[`sternlight`,`sidelights`,`lampu buritan`,`lampu lambung`],d:`Lampu buritan: putih, busur 135° ke belakang. Lampu lambung: hijau di kanan dan merah di kiri, masing-masing 112,5°. Rinciannya di Aturan 21.`},
 {t:`Masthead light (lampu tiang)`,m:[`masthead lights`,`masthead light`,`lampu tiang`],d:`Lampu putih di garis tengah kapal dengan busur 225° ke depan (Aturan 21(a)).`},
 {t:`Tow (tundaan)`,m:[`a tow`,`towing operation`,`tundaan`],d:`Kapal atau benda yang ditarik oleh kapal penunda, termasuk tali tundanya.`},
 {t:`WIG craft`,m:[`WIG craft`,`WIG`],d:`Wing-In-Ground: wahana yang terbang sangat dekat permukaan air memanfaatkan efek permukaan (Aturan 3(m)).`},
 {t:`Seaplane (pesawat laut)`,m:[`seaplane`,`pesawat laut`],d:`Pesawat udara yang dirancang untuk berolah gerak di atas air (Aturan 3(e)).`},
 {t:`Non-displacement craft`,m:[`non-displacement craft`],d:`Wahana yang saat melaju tidak ditopang daya apung lambungnya, misalnya hovercraft.`},
 {t:`Roadstead`,m:[`roadsteads`,`roadstead`],d:`Area berlabuh di perairan terbuka dekat pelabuhan yang tidak terlindung seperti di dalam kolam pelabuhan.`},
 {t:`Trolling lines (pancing tonda)`,m:[`trolling lines`,`pancing tonda`],d:`Tali pancing yang ditarik di belakang perahu yang bergerak. Tidak membatasi olah gerak, sehingga tidak termasuk "engaged in fishing".`},
 {t:`The Organization (IMO)`,m:[`the Organization`,`IMO`],d:`International Maritime Organization, badan PBB untuk urusan maritim. Dalam teks konvensi disebut "the Organization".`},
 {t:`Length overall (LOA)`,m:[`length overall`],d:`Panjang keseluruhan kapal dari ujung terdepan sampai ujung terbelakang (Aturan 3(j)).`},
 {t:`All-round light (lampu keliling)`,m:[`all-round light`,`all-round lights`,`lampu keliling`],d:`Lampu yang terlihat dari segala arah, 360° (Aturan 21(e)).`},
 {t:`Towing light (lampu tunda)`,m:[`towing light`,`lampu tunda`],d:`Lampu kuning 135° ke belakang, di atas lampu buritan kapal penunda (Aturan 21(d)).`},
 {t:`Flashing light (lampu kedip)`,m:[`flashing light`,`lampu kedip`],d:`Lampu yang berkedip 120 kali atau lebih per menit (Aturan 21(f)).`},
 {t:`Sosok (shape)`,m:[`ball`,`balls`,`diamond`,`cone`,`cylinder`,`conical shape`,`sosok`],d:`Benda hitam yang dipasang siang hari: bola, kerucut, belah ketupat (dua kerucut beralas sama), dan silinder. Ukurannya diatur Annex I bagian 6.`},
 {t:`Composite unit (unit gabungan)`,m:[`composite unit`,`unit gabungan`],d:`Kapal pendorong dan kapal yang didorong yang terhubung kaku, diperlakukan sebagai satu kapal tenaga (Aturan 24(b)).`},
 {t:`Dracone`,m:[`dracones`,`dracone`],d:`Kantong panjang lentur yang mengapung, dipakai untuk menunda cairan seperti minyak atau air tawar.`},
 {t:`Short dan prolonged blast (tiupan pendek dan panjang)`,m:[`short blast`,`short blasts`,`prolonged blast`,`prolonged blasts`,`tiupan pendek`,`tiupan panjang`],d:`Tiupan pendek sekitar 1 detik; tiupan panjang 4 sampai 6 detik (Aturan 32).`},
 {t:`Whistle, bell, gong (suling, bel, gong)`,m:[`whistle`,`bell`,`gong`],d:`Alat isyarat suara. Suling wajib mulai 12 m, bel mulai 20 m, gong mulai 100 m (Aturan 33).`},
 {t:`Air-cushion vessel (hovercraft)`,m:[`air-cushion vessel`,`hovercraft`],d:`Kapal bantalan udara yang dalam mode tanpa benaman melayang di atas air.`},
 {t:`Distress (bahaya)`,m:[`in distress`,`distress`],d:`Keadaan bahaya serius yang membutuhkan pertolongan. Isyaratnya di Annex IV (Aturan 37).`},
 {t:`Fore yard (andang-andang depan)`,m:[`fore yard`,`andang-andang`],d:`Palang melintang pada tiang depan. Kapal penyapu ranjau memasang lampu hijau di kedua ujungnya.`},
 {t:`Inconspicuous (sulit terlihat)`,m:[`inconspicuous`],d:`Kapal atau benda yang sukar terlihat, misalnya sebagian terendam (Aturan 24(g)).`},
 {t:`EPIRB`,m:[`EPIRB`,`emergency position-indicating radio beacons`],d:`Emergency Position-Indicating Radio Beacon: rambu radio darurat yang memancarkan posisi kapal ke satelit SAR (Annex IV 1(n)).`},
 {t:`DSC (Digital Selective Calling)`,m:[`DSC`,`digital selective calling`],d:`Panggilan selektif digital lewat radio. Tombol distress DSC mengirim peringatan bahaya otomatis, misalnya di VHF kanal 70 (Annex IV 1(l)).`},
 {t:`SART`,m:[`SART`,`survival craft radar transponders`],d:`Transponder radar sekoci: saat terkena sinyal radar, muncul deretan 12 titik di layar radar kapal penolong (Annex IV 1(o)).`},
 {t:`Purse seine (pukat cincin)`,m:[`purse seine`,`purse seiners`,`pukat cincin`],d:`Jaring yang dilingkarkan mengelilingi gerombolan ikan lalu bagian bawahnya dikerutkan (Annex II 3).`},
 {t:`Gunwale`,m:[`gunwale`],d:`Pinggir atas lambung atau geladak kapal kecil, dipakai sebagai titik ukur tinggi lampu pada kapal <20 m.`},
 {t:`Squat`,m:[`squat`],d:`Bertambahnya sarat kapal saat melaju di perairan dangkal, sehingga ruang bebas di bawah lunas berkurang.`},
 {t:`Echo-sounder (perum gema)`,m:[`echo-sounder`,`soundings`],d:`Alat pengukur kedalaman air dengan gelombang suara.`},
 {t:`Candela`,m:[`candelas`,`kandela`],d:`Satuan kekuatan cahaya. Lampu dengan jarak tampak 6 mil butuh sekitar 94 kandela (Annex I bagian 8).`}
];

rule({n:20,p:'C',t:`Penerapan`,en:`Application`,tool:[['360','Kapal 360°'],['tebak','Tebak lampu dan sosok']],
sum:`Aturan lampu berlaku dari matahari terbenam sampai terbit dan saat tampak terbatas; aturan sosok berlaku siang hari. Lampu lain yang membingungkan dilarang.`,
mn:`"Malam: lampu. Siang: sosok. Kabut siang: lampu juga."`,
rel:[21,22,19],
subs:[
{k:'a',en:`Rules in this Part shall be complied with in all weathers.`,id:`Aturan-aturan dalam Bagian ini harus dipatuhi dalam segala cuaca.`,ex:`Hujan, badai, atau laut tenang tidak mengubah kewajiban menunjukkan lampu dan sosok.`},
{k:'b',en:`The Rules concerning lights shall be complied with from sunset to sunrise, and during such times no other lights shall be exhibited, except such lights as cannot be mistaken for the lights specified in these Rules or do not impair their visibility or distinctive character, or interfere with the keeping of a proper look-out.`,
id:`Aturan mengenai lampu harus dipatuhi dari matahari terbenam sampai matahari terbit, dan selama waktu itu tidak boleh ditunjukkan lampu lain, kecuali lampu yang tidak dapat dikira sebagai lampu yang ditentukan aturan-aturan ini, atau yang tidak mengurangi daya tampak atau ciri khasnya, atau tidak mengganggu pengamatan yang layak.`,
ex:`Lampu geladak yang terlalu terang, lampu hias, atau lampu sorot nelayan bisa menyamarkan lampu navigasi dan mengganggu pengamatan. Itu dilarang.`,
uj:`Patokannya matahari terbenam sampai terbit (sunset to sunrise), bukan "saat gelap".`},
{k:'c',en:`The lights prescribed by these Rules shall, if carried, also be exhibited from sunrise to sunset in restricted visibility and may be exhibited in all other circumstances when it is deemed necessary.`,
id:`Lampu yang ditentukan aturan-aturan ini, jika dibawa, juga harus dinyalakan dari matahari terbit sampai terbenam dalam tampak terbatas, dan boleh dinyalakan dalam semua keadaan lain bila dianggap perlu.`,
ex:`Saat kabut atau hujan lebat di siang hari, nyalakan lampu navigasi. Di luar itu boleh dinyalakan siang hari bila dianggap membantu.`},
{k:'d',en:`The Rules concerning shapes shall be complied with by day.`,id:`Aturan mengenai sosok harus dipatuhi pada siang hari.`,ex:`Sosok (bola, kerucut, belah ketupat, silinder) berwarna hitam dan dipasang siang hari.`},
{k:'e',en:`The lights and shapes specified in these Rules shall comply with the provisions of Annex I to these Regulations.`,id:`Lampu dan sosok yang ditentukan aturan-aturan ini harus memenuhi ketentuan Annex I peraturan ini.`,ex:`Ukuran sosok, posisi, warna, dan kekuatan lampu diatur rinci di Annex I.`}
],
q:[
[`Lampu navigasi wajib dinyalakan…`,[`Dari matahari terbenam sampai terbit, dan saat tampak terbatas`,`Hanya saat langit benar-benar gelap`,`Hanya di dalam alur pelayaran`,`Hanya jika ada kapal lain di dekatnya`],`Aturan 20(b) dan (c).`],
[`Sosok (day shapes) dipasang…`,[`Pada siang hari`,`Pada malam hari`,`Hanya saat kabut`,`Hanya saat berlabuh`],`Aturan 20(d).`],
[`Siang hari terjadi kabut tebal. Lampu navigasi…`,[`Harus dinyalakan`,`Tidak perlu dinyalakan`,`Hanya lampu buritan yang dinyalakan`,`Diganti dengan sosok`],`Aturan 20(c).`]
]});

rule({n:21,p:'C',t:`Definisi lampu`,en:`Definitions`,tool:[['360','Kapal 360°']],
sum:`Lampu tiang putih 225°, lampu lambung hijau (kanan) dan merah (kiri) masing-masing 112,5°, lampu buritan putih 135°, lampu tunda kuning 135°, lampu keliling 360°, lampu kedip ≥120 kali per menit.`,
mn:`"225 + 135 = 360": lampu tiang dan lampu buritan bersama-sama menutup seluruh lingkaran. "Port wine is red": kiri merah.`,
rel:[13,22,23],
subs:[
{k:'a',en:`"Masthead light" means a white light placed over the fore and aft centreline of the vessel showing an unbroken light over an arc of the horizon of 225 degrees and so fixed as to show the light from right ahead to 22.5 degrees abaft the beam on either side of the vessel.`,
id:`"Lampu tiang" berarti lampu putih yang ditempatkan di atas garis tengah membujur kapal, memancarkan cahaya tanpa terputus pada busur cakrawala 225 derajat, dipasang sedemikian rupa sehingga cahayanya tampak dari arah tepat di depan sampai 22,5 derajat di belakang arah melintang di kedua sisi kapal.`,
ex:`112,5° ke kanan + 112,5° ke kiri = 225°. Dari belakang (sektor 135°), lampu tiang tidak terlihat.`,
pm:`Bayangkan senter yang menyinari bagian depan kapal dan sedikit ke belakang dari samping, tetapi tidak ke arah buritan.`},
{k:'b',en:`"Sidelights" means a green light on the starboard side and a red light on the port side each showing an unbroken light over an arc of the horizon of 112.5 degrees and so fixed as to show the light from right ahead to 22.5 degrees abaft the beam on its respective side. In a vessel of less than 20 metres in length the sidelights may be combined in one lantern carried on the fore and aft centreline of the vessel.`,
id:`"Lampu lambung" berarti lampu hijau di sisi kanan dan lampu merah di sisi kiri, masing-masing memancarkan cahaya tanpa terputus pada busur 112,5 derajat, dipasang sehingga cahayanya tampak dari arah tepat di depan sampai 22,5 derajat di belakang arah melintang pada sisinya masing-masing. Pada kapal dengan panjang kurang dari 20 meter, kedua lampu lambung boleh digabung dalam satu lentera di garis tengah membujur kapal.`,
ex:`Hijau = kanan (starboard), merah = kiri (port). Dari tepat di depan, keduanya terlihat bersamaan.`,
uj:`Batas belakang lampu lambung (22,5° di belakang arah melintang) sama dengan batas sektor menyusul di Aturan 13(b).`},
{k:'c',en:`"Sternlight" means a white light placed as nearly as practicable at the stern showing an unbroken light over an arc of the horizon of 135 degrees and so fixed as to show the light 67.5 degrees from right aft on each side of the vessel.`,
id:`"Lampu buritan" berarti lampu putih yang ditempatkan sedekat mungkin di buritan, memancarkan cahaya tanpa terputus pada busur 135 derajat, dipasang sehingga cahayanya tampak 67,5 derajat dari arah tepat di belakang ke masing-masing sisi kapal.`,
ex:`67,5° + 67,5° = 135°. Sektor ini persis sektor "menyusul".`},
{k:'d',en:`"Towing light" means a yellow light having the same characteristics as the "sternlight" defined in paragraph (c) of this Rule.`,id:`"Lampu tunda" berarti lampu kuning yang memiliki karakteristik yang sama dengan "lampu buritan" pada paragraf (c) aturan ini.`,ex:`Kuning, 135°, ke arah belakang. Dipasang di atas lampu buritan kapal penunda.`},
{k:'e',en:`"All-round light" means a light showing an unbroken light over an arc of the horizon of 360 degrees.`,id:`"Lampu keliling" berarti lampu yang memancarkan cahaya tanpa terputus pada busur cakrawala 360 derajat.`,ex:`Terlihat dari segala arah. Dipakai untuk isyarat status kapal, seperti NUC, RAM, kapal ikan, dan lampu jangkar.`},
{k:'f',en:`"Flashing light" means a light flashing at regular intervals at a frequency of 120 flashes or more per minute.`,id:`"Lampu kedip" berarti lampu yang berkedip dengan selang teratur pada frekuensi 120 kedipan atau lebih per menit.`,ex:`Minimal dua kedipan per detik. Contohnya lampu kuning kedip hovercraft (Aturan 23(b)).`}
],
q:[
[`Busur penyinaran lampu tiang adalah…`,[`225°`,`135°`,`112,5°`,`360°`],`Aturan 21(a).`],
[`Lampu buritan tampak sampai berapa derajat dari arah tepat di belakang ke tiap sisi?`,[`67,5°`,`22,5°`,`112,5°`,`90°`],`Aturan 21(c): 67,5° ke tiap sisi, total 135°.`],
[`Lampu tunda berwarna…`,[`Kuning`,`Putih`,`Merah`,`Biru`],`Aturan 21(d).`]
]});

rule({n:22,p:'C',t:`Jarak tampak lampu`,en:`Visibility of Lights`,
lead:{en:`The lights prescribed in these Rules shall have an intensity as specified in Section 8 of Annex I to these Regulations so as to be visible at the following minimum ranges:`,id:`Lampu yang ditentukan aturan-aturan ini harus memiliki kekuatan cahaya sesuai Bagian 8 Annex I sehingga tampak pada jarak minimum berikut:`},
sum:`Kapal ≥50 m: tiang 6 mil, lainnya 3 mil. Kapal 12–50 m: tiang 5 mil (3 mil bila <20 m), lainnya 2 mil. Kapal <12 m: tiang 2 mil, lambung 1 mil, lainnya 2 mil. Benda tertunda yang hampir tenggelam: putih keliling 3 mil.`,
mn:`"6-3, 5-2, 2-1": tiang dan lambung untuk ≥50 m, 12–50 m, dan <12 m.`,
rel:[21,23],
subs:[
{k:'a',en:`In vessels of 50 metres or more in length:
– a masthead light, 6 miles;
– a sidelight, 3 miles;
– a sternlight, 3 miles;
– a towing light, 3 miles;
– a white, red, green or yellow all-round light, 3 miles.`,
id:`Pada kapal dengan panjang 50 meter atau lebih:
– lampu tiang, 6 mil;
– lampu lambung, 3 mil;
– lampu buritan, 3 mil;
– lampu tunda, 3 mil;
– lampu keliling putih, merah, hijau, atau kuning, 3 mil.`,
ex:`Kapal besar: lampu tiang 6 mil, semua lampu lain 3 mil.`},
{k:'b',en:`In vessels of 12 metres or more in length but less than 50 metres in length:
– a masthead light, 5 miles; except that where the length of the vessel is less than 20 metres, 3 miles;
– a sidelight, 2 miles;
– a sternlight, 2 miles;
– a towing light, 2 miles;
– a white, red, green or yellow all-round light, 2 miles.`,
id:`Pada kapal dengan panjang 12 meter atau lebih tetapi kurang dari 50 meter:
– lampu tiang, 5 mil; kecuali bila panjang kapal kurang dari 20 meter, 3 mil;
– lampu lambung, 2 mil;
– lampu buritan, 2 mil;
– lampu tunda, 2 mil;
– lampu keliling putih, merah, hijau, atau kuning, 2 mil.`,
ex:`Kapal menengah: lampu tiang 5 mil (3 mil bila di bawah 20 m), lainnya 2 mil.`},
{k:'c',en:`In vessels of less than 12 metres in length:
– a masthead light, 2 miles;
– a sidelight, 1 mile;
– a sternlight, 2 miles;
– a towing light, 2 miles;
– a white, red, green or yellow all-round light, 2 miles.`,
id:`Pada kapal dengan panjang kurang dari 12 meter:
– lampu tiang, 2 mil;
– lampu lambung, 1 mil;
– lampu buritan, 2 mil;
– lampu tunda, 2 mil;
– lampu keliling putih, merah, hijau, atau kuning, 2 mil.`,
ex:`Kapal kecil: hanya lampu lambung yang 1 mil, lainnya 2 mil.`,
uj:`Lampu lambung kapal <12 m hanya 1 mil: perahu kecil bisa sangat terlambat terlihat.`},
{k:'d',en:`In inconspicuous, partly submerged vessels or objects being towed:
– a white all-round light, 3 miles.`,id:`Pada kapal atau benda yang sulit terlihat dan sebagian terendam yang sedang ditunda:
– lampu keliling putih, 3 mil.`,ex:`Contohnya dracone (kantong apung berisi minyak/air) atau rakit kayu yang ditarik. Lihat Aturan 24(g).`}
],
q:[
[`Jarak tampak minimum lampu tiang kapal ≥50 m adalah…`,[`6 mil`,`3 mil`,`5 mil`,`2 mil`],`Aturan 22(a).`],
[`Jarak tampak minimum lampu lambung kapal <12 m adalah…`,[`1 mil`,`2 mil`,`3 mil`,`0,5 mil`],`Aturan 22(c).`],
[`Lampu tiang kapal 15 m harus tampak minimal…`,[`3 mil`,`5 mil`,`6 mil`,`2 mil`],`Aturan 22(b): 12–50 m 5 mil, kecuali <20 m 3 mil.`]
]});

rule({n:23,p:'C',t:`Kapal tenaga yang sedang berlayar`,en:`Power-driven Vessels underway`,tool:[['360','Kapal 360°'],['pasang','Pasang lampu']],
sum:`Kapal tenaga: lampu tiang depan, lampu tiang kedua lebih tinggi di belakang (wajib ≥50 m), lampu lambung, lampu buritan. Hovercraft + kuning kedip; WIG saat lepas landas/mendarat/terbang rendah + merah kedip intensitas tinggi. Kapal kecil boleh lampu putih keliling.`,
mn:`"Dua lampu tiang, yang belakang lebih tinggi, menunjuk arah haluan."`,
rel:[21,22,24],
subs:[
{k:'a',en:`A power-driven vessel underway shall exhibit:
(i) a masthead light forward;
(ii) a second masthead light abaft of and higher than the forward one; except that a vessel of less than 50 metres in length shall not be obliged to exhibit such light but may do so;
(iii) sidelights;
(iv) a sternlight.`,
id:`Kapal tenaga yang sedang berlayar harus menunjukkan:
(i) lampu tiang di depan;
(ii) lampu tiang kedua di belakang dan lebih tinggi dari yang depan; kecuali kapal dengan panjang kurang dari 50 meter tidak wajib menunjukkannya tetapi boleh;
(iii) lampu lambung;
(iv) lampu buritan.`,
ex:`Dua lampu tiang (depan rendah, belakang tinggi) membentuk "garis bidik" yang menunjukkan arah haluan kapal: jika keduanya segaris, kapal itu menghadap Anda.`,
uj:`Kapal <50 m boleh hanya satu lampu tiang. Kapal ≥50 m wajib dua.`},
{k:'b',en:`An air-cushion vessel when operating in the non-displacement mode shall, in addition to the lights prescribed in paragraph (a) of this Rule, exhibit an all-round flashing yellow light.`,id:`Kapal bantalan udara (hovercraft) yang beroperasi dalam mode tanpa benaman, selain lampu pada paragraf (a), harus menunjukkan lampu keliling kuning yang berkedip.`,ex:`Hovercraft bisa sangat cepat dan bergerak menyamping, jadi diberi tanda khusus kuning kedip.`},
{k:'c',en:`A WIG craft only when taking off, landing and in flight near the surface shall, in addition to the lights prescribed in paragraph (a) of this Rule, exhibit a high intensity all-round flashing red light.`,id:`Wahana WIG, hanya saat lepas landas, mendarat, dan terbang dekat permukaan, selain lampu pada paragraf (a), harus menunjukkan lampu keliling merah berkedip berintensitas tinggi.`,ex:`Merah kedip terang menandakan WIG sedang terbang rendah: jauhi.`},
{k:'d',en:`(i) A power-driven vessel of less than 12 metres in length may in lieu of the lights prescribed in paragraph (a) of this Rule exhibit an all-round white light and sidelights;
(ii) a power-driven vessel of less than 7 metres in length whose maximum speed does not exceed 7 knots may in lieu of the lights prescribed in paragraph (a) of this Rule exhibit an all-round white light and shall, if practicable, also exhibit sidelights;
(iii) the masthead light or all-round white light on a power-driven vessel of less than 12 metres in length may be displaced from the fore and aft centreline of the vessel if centreline fitting is not practicable, provided that the sidelights are combined in one lantern which shall be carried on the fore and aft centreline of the vessel or located as nearly as practicable in the same fore and aft line as the masthead light or the all-round white light.`,
id:`(i) Kapal tenaga dengan panjang kurang dari 12 meter, sebagai ganti lampu pada paragraf (a), boleh menunjukkan satu lampu keliling putih dan lampu lambung;
(ii) kapal tenaga dengan panjang kurang dari 7 meter yang kecepatan maksimumnya tidak lebih dari 7 knot, sebagai ganti lampu pada paragraf (a), boleh menunjukkan satu lampu keliling putih dan, bila memungkinkan, juga lampu lambung;
(iii) lampu tiang atau lampu keliling putih pada kapal tenaga <12 m boleh dipasang di luar garis tengah membujur jika pemasangan di garis tengah tidak memungkinkan, asalkan lampu lambung digabung dalam satu lentera di garis tengah atau sedekat mungkin segaris membujur dengan lampu tiang atau lampu keliling putih itu.`,
ex:`Keringanan untuk perahu motor kecil, misalnya speedboat atau perahu nelayan bermotor tempel.`,
uj:`<12 m: putih keliling + lambung. <7 m dan ≤7 knot: cukup putih keliling (lambung bila mungkin).`}
],
q:[
[`Kapal tenaga ≥50 m yang sedang berlayar wajib menunjukkan…`,[`Dua lampu tiang, lampu lambung, dan lampu buritan`,`Satu lampu tiang dan lampu buritan`,`Dua lampu merah keliling`,`Lampu keliling putih saja`],`Aturan 23(a).`],
[`Hovercraft dalam mode non-displacement menambahkan…`,[`Lampu keliling kuning berkedip`,`Lampu keliling merah`,`Lampu tunda`,`Dua lampu hijau`],`Aturan 23(b).`],
[`Kapal tenaga 6 m dengan kecepatan maksimum 6 knot boleh menunjukkan…`,[`Satu lampu keliling putih (dan lampu lambung bila mungkin)`,`Tidak perlu lampu`,`Lampu lambung saja`,`Lampu kuning berkedip`],`Aturan 23(d)(ii).`]
]});

rule({n:24,p:'C',t:`Menunda dan mendorong`,en:`Towing and Pushing`,tool:[['360','Kapal 360°'],['pasang','Pasang lampu']],
sum:`Kapal penunda: dua lampu tiang vertikal (tiga bila tundaan >200 m), lambung, buritan, dan lampu tunda kuning di atas lampu buritan; belah ketupat bila >200 m. Mendorong kaku = satu kapal tenaga. Benda tertunda yang sulit terlihat diberi lampu putih keliling dan belah ketupat.`,
mn:`"Tundaan panjang, tiga lampu dan belah ketupat."`,
rel:[23,27,35],
subs:[
{k:'a',en:`A power-driven vessel when towing shall exhibit:
(i) instead of the light prescribed in Rule 23(a)(i) or (a)(ii), two masthead lights in a vertical line. When the length of the tow, measuring from the stern of the towing vessel to the after end of the tow exceeds 200 metres, three such lights in a vertical line;
(ii) sidelights;
(iii) a sternlight;
(iv) a towing light in a vertical line above the sternlight;
(v) when the length of the tow exceeds 200 metres, a diamond shape where it can best be seen.`,
id:`Kapal tenaga yang sedang menunda harus menunjukkan:
(i) sebagai ganti lampu pada Aturan 23(a)(i) atau (a)(ii), dua lampu tiang dalam satu garis tegak. Bila panjang tundaan, diukur dari buritan kapal penunda sampai ujung belakang tundaan, melebihi 200 meter, tiga lampu tersebut dalam satu garis tegak;
(ii) lampu lambung;
(iii) lampu buritan;
(iv) lampu tunda dalam satu garis tegak di atas lampu buritan;
(v) bila panjang tundaan melebihi 200 meter, sosok belah ketupat di tempat yang paling mudah terlihat.`,
ex:`Lampu tiang vertikal (2 atau 3) menggantikan lampu tiang depan ATAU belakang. Jika kapal penunda ≥50 m, ia tetap menunjukkan lampu tiang lainnya (lihat 24(d)).`,
uj:`Panjang tundaan diukur dari buritan kapal penunda sampai ujung belakang tundaan, bukan panjang tali saja.`},
{k:'b',en:`When a pushing vessel and a vessel being pushed ahead are rigidly connected in a composite unit they shall be regarded as a power-driven vessel and exhibit the lights prescribed in Rule 23.`,id:`Jika kapal pendorong dan kapal yang didorong di depannya terhubung kaku sebagai satu unit gabungan, keduanya dianggap sebagai satu kapal tenaga dan menunjukkan lampu menurut Aturan 23.`,ex:`Contoh: kapal pendorong yang "terkunci" ke tongkang (ITB). Dari luar terlihat seperti satu kapal tenaga biasa.`},
{k:'c',en:`A power-driven vessel when pushing ahead or towing alongside, except in the case of a composite unit, shall exhibit:
(i) instead of the light prescribed in Rule 23(a)(i) or (a)(ii), two masthead lights in a vertical line;
(ii) sidelights;
(iii) a sternlight.`,
id:`Kapal tenaga yang sedang mendorong di depan atau menunda di samping, kecuali sebagai unit gabungan, harus menunjukkan:
(i) sebagai ganti lampu pada Aturan 23(a)(i) atau (a)(ii), dua lampu tiang dalam satu garis tegak;
(ii) lampu lambung;
(iii) lampu buritan.`,
ex:`Tanpa lampu tunda kuning, karena tidak ada tundaan di belakangnya.`},
{k:'d',en:`A power-driven vessel to which paragraph (a) or (c) of this Rule applies shall also comply with Rule 23(a)(ii).`,id:`Kapal tenaga yang dikenai paragraf (a) atau (c) aturan ini juga harus mematuhi Aturan 23(a)(ii).`,ex:`Kapal penunda ≥50 m tetap wajib lampu tiang kedua; kapal <50 m boleh.`},
{k:'e',en:`A vessel or object being towed, other than those mentioned in paragraph (g) of this Rule, shall exhibit:
(i) sidelights;
(ii) a sternlight;
(iii) when the length of the tow exceeds 200 metres, a diamond shape where it can best be seen.`,
id:`Kapal atau benda yang ditunda, selain yang disebut dalam paragraf (g), harus menunjukkan:
(i) lampu lambung;
(ii) lampu buritan;
(iii) bila panjang tundaan melebihi 200 meter, sosok belah ketupat di tempat yang paling mudah terlihat.`,
ex:`Kapal yang ditunda tidak memakai lampu tiang.`},
{k:'f',en:`Provided that any number of vessels being towed alongside or pushed in a group shall be lighted as one vessel:
(i) a vessel being pushed ahead, not being part of a composite unit, shall exhibit at the forward end, sidelights;
(ii) a vessel being towed alongside shall exhibit a sternlight and at the forward end, sidelights.`,
id:`Dengan ketentuan bahwa berapa pun banyaknya kapal yang ditunda di samping atau didorong dalam satu kelompok harus diberi lampu sebagai satu kapal:
(i) kapal yang didorong di depan, bukan bagian unit gabungan, harus menunjukkan lampu lambung di ujung depan;
(ii) kapal yang ditunda di samping harus menunjukkan lampu buritan dan lampu lambung di ujung depan.`,
ex:`Rombongan tongkang yang didorong diberi lampu seolah satu kapal panjang.`},
{k:'g',en:`An inconspicuous, partly submerged vessel or object, or combination of such vessels or objects being towed, shall exhibit:
(i) if it is less than 25 metres in breadth, one all-round white light at or near the forward end and one at or near the after end except that dracones need not exhibit a light at or near the forward end;
(ii) if it is 25 metres or more in breadth, two additional all-round white lights at or near the extremities of its breadth;
(iii) if it exceeds 100 metres in length, additional all-round white lights between the lights prescribed in sub-paragraphs (i) and (ii) so that the distance between the lights shall not exceed 100 metres;
(iv) a diamond shape at or near the aftermost extremity of the last vessel or object being towed and if the length of the tow exceeds 200 metres an additional diamond shape where it can best be seen and located as far forward as is practicable.`,
id:`Kapal atau benda yang sulit terlihat dan sebagian terendam, atau gabungannya, yang sedang ditunda, harus menunjukkan:
(i) bila lebarnya kurang dari 25 meter, satu lampu keliling putih di atau dekat ujung depan dan satu di atau dekat ujung belakang, kecuali dracone tidak perlu lampu di ujung depan;
(ii) bila lebarnya 25 meter atau lebih, dua lampu keliling putih tambahan di atau dekat ujung-ujung lebarnya;
(iii) bila panjangnya melebihi 100 meter, lampu keliling putih tambahan di antara lampu-lampu (i) dan (ii) sehingga jarak antar lampu tidak lebih dari 100 meter;
(iv) sosok belah ketupat di atau dekat ujung paling belakang dari kapal atau benda terakhir yang ditunda, dan bila panjang tundaan melebihi 200 meter, satu belah ketupat tambahan di tempat yang paling mudah terlihat dan sejauh mungkin ke depan.`,
ex:`Benda seperti rakit kayu atau dracone hampir tidak terlihat. Deretan lampu putih keliling menandai ukurannya.`},
{k:'h',en:`Where from any sufficient cause it is impracticable for a vessel or object being towed to exhibit the lights or shapes prescribed in paragraph (e) or (g) of this Rule, all possible measures shall be taken to light the vessel or object towed or at least to indicate the presence of such vessel or object.`,id:`Jika karena alasan yang cukup kapal atau benda yang ditunda tidak dapat menunjukkan lampu atau sosok menurut paragraf (e) atau (g), segala upaya harus dilakukan untuk meneranginya atau sekurang-kurangnya menandai keberadaannya.`,ex:`Misalnya kapal rusak yang lampunya mati: gunakan senter, lampu darurat, atau sorotan.`},
{k:'i',en:`Where from any sufficient cause it is impracticable for a vessel not normally engaged in towing operations to display the lights prescribed in paragraph (a) or (c) of this Rule, such vessel shall not be required to exhibit those lights when engaged in towing another vessel in distress or otherwise in need of assistance. All possible measures shall be taken to indicate the nature of the relationship between the towing vessel and the vessel being towed as authorized by Rule 36, in particular by illuminating the towline.`,id:`Jika karena alasan yang cukup kapal yang biasanya tidak melakukan penundaan tidak dapat menunjukkan lampu menurut paragraf (a) atau (c), kapal itu tidak diwajibkan menunjukkan lampu tersebut saat menunda kapal lain yang dalam bahaya atau butuh pertolongan. Segala upaya harus dilakukan untuk menunjukkan hubungan antara kapal penunda dan kapal yang ditunda sebagaimana diizinkan Aturan 36, terutama dengan menyinari tali tunda.`,ex:`Kapal kargo yang menolong kapal mogok tidak punya lampu tunda; cukup sinari tali tundanya agar kapal lain tahu ada tali di antara keduanya.`}
],
q:[
[`Kapal penunda dengan tundaan 300 m menunjukkan lampu tiang vertikal sebanyak…`,[`Tiga`,`Dua`,`Satu`,`Empat`],`Aturan 24(a)(i): lebih dari 200 m, tiga lampu.`],
[`Lampu tunda kuning dipasang…`,[`Tegak di atas lampu buritan`,`Di puncak tiang depan`,`Di samping lampu lambung`,`Di haluan`],`Aturan 24(a)(iv).`],
[`Sosok siang hari untuk tundaan lebih dari 200 m adalah…`,[`Belah ketupat`,`Silinder`,`Dua bola`,`Kerucut puncak ke bawah`],`Aturan 24(a)(v) dan (e)(iii).`]
]});

rule({n:25,p:'C',t:`Kapal layar dan kapal dayung`,en:`Sailing Vessels underway and Vessels under Oars`,tool:[['360','Kapal 360°'],['pasang','Pasang lampu']],
sum:`Kapal layar: lampu lambung dan buritan, tanpa lampu tiang. Opsional merah di atas hijau keliling (tidak bersama lentera gabungan). Kapal <7 m dan perahu dayung cukup senter putih. Kapal layar yang memakai mesin: kerucut puncak ke bawah.`,
mn:`"Red over green, sailing machine."`,
rel:[3,23,18],
subs:[
{k:'a',en:`A sailing vessel underway shall exhibit:
(i) sidelights;
(ii) a sternlight.`,id:`Kapal layar yang sedang berlayar harus menunjukkan:
(i) lampu lambung;
(ii) lampu buritan.`,ex:`Tidak ada lampu tiang putih. Jika Anda melihat merah dan hijau tanpa putih di atasnya, kemungkinan itu kapal layar.`},
{k:'b',en:`In a sailing vessel of less than 20 metres in length the lights prescribed in paragraph (a) of this Rule may be combined in one lantern carried at or near the top of the mast where it can best be seen.`,id:`Pada kapal layar dengan panjang kurang dari 20 meter, lampu pada paragraf (a) boleh digabung dalam satu lentera di atau dekat puncak tiang di tempat yang paling mudah terlihat.`,ex:`Lentera tiga warna (tricolour) di puncak tiang lebih mudah terlihat daripada lampu di dekat permukaan air.`},
{k:'c',en:`A sailing vessel underway may, in addition to the lights prescribed in paragraph (a) of this Rule, exhibit at or near the top of the mast, where they can best be seen, two all-round lights in a vertical line, the upper being red and the lower green, but these lights shall not be exhibited in conjunction with the combined lantern permitted by paragraph (b) of this Rule.`,id:`Kapal layar yang sedang berlayar, selain lampu pada paragraf (a), boleh menunjukkan di atau dekat puncak tiang dua lampu keliling dalam satu garis tegak, yang atas merah dan yang bawah hijau, tetapi lampu ini tidak boleh ditunjukkan bersamaan dengan lentera gabungan pada paragraf (b).`,ex:`Opsional, dan tidak boleh dipakai bersama lentera tricolour.`,uj:`Jebakan ujian: merah-di-atas-hijau tidak boleh dikombinasikan dengan lentera gabungan.`},
{k:'d',en:`(i) A sailing vessel of less than 7 metres in length shall, if practicable, exhibit the lights prescribed in paragraph (a) or (b) of this Rule, but if she does not, she shall have ready at hand an electric torch or lighted lantern showing a white light which shall be exhibited in sufficient time to prevent collision.
(ii) A vessel under oars may exhibit the lights prescribed in this Rule for sailing vessels, but if she does not, she shall have ready at hand an electric torch or lighted lantern showing a white light which shall be exhibited in sufficient time to prevent collision.`,
id:`(i) Kapal layar dengan panjang kurang dari 7 meter, bila memungkinkan, harus menunjukkan lampu pada paragraf (a) atau (b), tetapi bila tidak, ia harus menyiapkan senter listrik atau lentera menyala berwarna putih yang ditunjukkan cukup awal untuk mencegah tubrukan.
(ii) Kapal dayung boleh menunjukkan lampu untuk kapal layar menurut aturan ini, tetapi bila tidak, ia harus menyiapkan senter listrik atau lentera menyala berwarna putih yang ditunjukkan cukup awal untuk mencegah tubrukan.`,
ex:`Perahu dayung dan perahu layar kecil boleh hanya membawa senter putih, asal ditunjukkan tepat waktu.`},
{k:'e',en:`A vessel proceeding under sail when also being propelled by machinery shall exhibit forward where it can best be seen a conical shape, apex downwards.`,id:`Kapal yang berlayar dengan layar sekaligus digerakkan mesin harus menunjukkan di bagian depan, di tempat yang paling mudah terlihat, sosok kerucut dengan puncak ke bawah.`,ex:`Kerucut terbalik memberi tahu kapal lain: "Saya memakai mesin, jadi saya kapal tenaga."`}
],
q:[
[`Lampu opsional kapal layar di puncak tiang adalah…`,[`Merah di atas hijau keliling`,`Hijau di atas merah keliling`,`Putih di atas merah keliling`,`Dua merah keliling`],`Aturan 25(c).`],
[`Kapal layar yang juga memakai mesin di siang hari memasang…`,[`Kerucut puncak ke bawah`,`Kerucut puncak ke atas`,`Satu bola`,`Belah ketupat`],`Aturan 25(e).`],
[`Perahu dayung yang tidak memasang lampu kapal layar wajib…`,[`Menyiapkan senter atau lentera putih untuk ditunjukkan tepat waktu`,`Tidak berlayar malam`,`Memasang lampu merah keliling`,`Membunyikan suling terus-menerus`],`Aturan 25(d)(ii).`]
]});

rule({n:26,p:'C',t:`Kapal penangkap ikan`,en:`Fishing Vessels`,tool:[['tebak','Tebak lampu dan sosok'],['pasang','Pasang lampu']],
sum:`Pukat: hijau di atas putih (+ lampu tiang belakang bila ≥50 m). Penangkapan lain: merah di atas putih; alat >150 m: putih keliling atau kerucut puncak ke atas ke arah alat. Siang: dua kerucut puncak bertemu. Saat laju tambah lambung dan buritan.`,
mn:`"Green over white, trawling tonight. Red over white, fishing at night."`,
rel:[3,18,35],
subs:[
{k:'a',en:`A vessel engaged in fishing, whether underway or at anchor, shall exhibit only the lights and shapes prescribed in this Rule.`,id:`Kapal yang sedang menangkap ikan, baik sedang berlayar maupun berlabuh, hanya boleh menunjukkan lampu dan sosok menurut aturan ini.`,ex:`Kapal ikan yang sedang menangkap ikan dan berlabuh tidak memasang lampu jangkar; ia tetap memakai lampu kapal ikan.`},
{k:'b',en:`A vessel when engaged in trawling, by which is meant the dragging through the water of a dredge net or other apparatus used as a fishing appliance, shall exhibit:
(i) two all-round lights in a vertical line, the upper being green and the lower white, or a shape consisting of two cones with their apexes together in a vertical line one above the other;
(ii) a masthead light abaft of and higher than the all-round green light; a vessel of less than 50 metres in length shall not be obliged to exhibit such a light but may do so;
(iii) when making way through the water, in addition to the lights prescribed in this paragraph, sidelights and a sternlight.`,
id:`Kapal yang sedang memukat, yaitu menarik jaring keruk atau alat lain di dalam air sebagai alat penangkap ikan, harus menunjukkan:
(i) dua lampu keliling dalam satu garis tegak, yang atas hijau dan yang bawah putih, atau sosok berupa dua kerucut dengan puncak bertemu dalam satu garis tegak;
(ii) satu lampu tiang di belakang dan lebih tinggi dari lampu hijau keliling; kapal <50 m tidak wajib tetapi boleh;
(iii) saat laju di air, selain lampu di atas, lampu lambung dan lampu buritan.`,
ex:`Hijau di atas putih = pukat. Lampu tiang belakang membantu menunjukkan arah haluan kapal pukat besar.`},
{k:'c',en:`A vessel engaged in fishing, other than trawling, shall exhibit:
(i) two all-round lights in a vertical line, the upper being red and the lower white, or a shape consisting of two cones with apexes together in a vertical line one above the other;
(ii) when there is outlying gear extending more than 150 metres horizontally from the vessel, an all-round white light or a cone apex upwards in the direction of the gear;
(iii) when making way through the water, in addition to the lights prescribed in this paragraph, sidelights and a sternlight.`,
id:`Kapal yang sedang menangkap ikan selain memukat harus menunjukkan:
(i) dua lampu keliling dalam satu garis tegak, yang atas merah dan yang bawah putih, atau sosok dua kerucut dengan puncak bertemu dalam satu garis tegak;
(ii) bila alat tangkap terbentang lebih dari 150 meter mendatar dari kapal, satu lampu keliling putih atau kerucut puncak ke atas ke arah alat tangkap;
(iii) saat laju di air, selain lampu di atas, lampu lambung dan lampu buritan.`,
ex:`Merah di atas putih = rawai, jaring insang, pukat cincin, dan sejenisnya. Lampu putih atau kerucut tambahan menunjukkan sisi tempat alat tangkap terbentang: jangan lewat di sisi itu.`},
{k:'d',en:`The additional signals described in Annex II to these Regulations apply to a vessel engaged in fishing in close proximity to other vessels engaged in fishing.`,id:`Isyarat tambahan dalam Annex II berlaku bagi kapal yang menangkap ikan berdekatan dengan kapal-kapal lain yang menangkap ikan.`,ex:`Annex II mengatur lampu tambahan saat menebar atau menarik jaring (dibahas pada bagian Annex).`},
{k:'e',en:`A vessel when not engaged in fishing shall not exhibit the lights or shapes prescribed in this Rule, but only those prescribed for a vessel of her length.`,id:`Kapal yang tidak sedang menangkap ikan tidak boleh menunjukkan lampu atau sosok menurut aturan ini, tetapi hanya lampu atau sosok untuk kapal seukurannya.`,ex:`Kapal ikan yang sedang pulang ke pelabuhan memakai lampu kapal tenaga biasa.`}
],
q:[
[`Hijau di atas putih keliling menunjukkan kapal yang sedang…`,[`Memukat (trawling)`,`Menangkap ikan selain memukat`,`Memandu`,`Membersihkan ranjau`],`Aturan 26(b)(i).`],
[`Sosok siang kapal yang sedang menangkap ikan adalah…`,[`Dua kerucut dengan puncak bertemu`,`Dua bola`,`Satu silinder`,`Kerucut puncak ke bawah`],`Aturan 26(b)(i) dan (c)(i).`],
[`Alat tangkap terbentang lebih dari 150 m dari kapal ditandai dengan…`,[`Lampu putih keliling atau kerucut puncak ke atas ke arah alat`,`Lampu merah keliling ke arah alat`,`Belah ketupat`,`Lampu kuning kedip`],`Aturan 26(c)(ii).`]
]});

rule({n:27,p:'C',t:`Kapal NUC dan RAM`,en:`Vessels not under Command or Restricted in their Ability to Manoeuvre`,tool:[['tebak','Tebak lampu dan sosok'],['pasang','Pasang lampu']],
sum:`NUC: dua merah keliling / dua bola. RAM: merah-putih-merah / bola-belah ketupat-bola. Kapal keruk: dua merah atau dua bola di sisi terhalang, dua hijau atau dua belah ketupat di sisi aman. Penyapu ranjau: tiga hijau / tiga bola, jauhi 1000 m.`,
mn:`"Red over red, the captain is dead." Keruk: "Hijau aman dilewati, merah terhalang."`,
rel:[3,18,35],
subs:[
{k:'a',en:`A vessel not under command shall exhibit:
(i) two all-round red lights in a vertical line where they can best be seen;
(ii) two balls or similar shapes in a vertical line where they can best be seen;
(iii) when making way through the water, in addition to the lights prescribed in this paragraph, sidelights and a sternlight.`,
id:`Kapal yang tidak dapat diolah gerak harus menunjukkan:
(i) dua lampu merah keliling dalam satu garis tegak di tempat yang paling mudah terlihat;
(ii) dua bola atau sosok serupa dalam satu garis tegak di tempat yang paling mudah terlihat;
(iii) saat laju di air, selain lampu di atas, lampu lambung dan lampu buritan.`,
ex:`NUC tidak menunjukkan lampu tiang, karena lampu tiang menandakan kapal tenaga yang bisa bermanuver.`},
{k:'b',en:`A vessel restricted in her ability to manoeuvre, except a vessel engaged in mineclearance operations, shall exhibit:
(i) three all-round lights in a vertical line where they can best be seen. The highest and lowest of these lights shall be red and the middle light shall be white;
(ii) three shapes in a vertical line where they can best be seen. The highest and lowest of these shapes shall be balls and the middle one a diamond;
(iii) when making way through the water, a masthead light or lights, sidelights and a sternlight in addition to the lights prescribed in sub-paragraph (i);
(iv) when at anchor, in addition to the lights or shapes prescribed in sub-paragraphs (i) and (ii), the light, lights or shape prescribed in Rule 30.`,
id:`Kapal yang terbatas kemampuan olah geraknya, kecuali kapal pembersih ranjau, harus menunjukkan:
(i) tiga lampu keliling dalam satu garis tegak di tempat yang paling mudah terlihat; yang paling atas dan paling bawah merah, yang tengah putih;
(ii) tiga sosok dalam satu garis tegak; yang paling atas dan paling bawah bola, yang tengah belah ketupat;
(iii) saat laju di air, lampu tiang, lampu lambung, dan lampu buritan, selain lampu pada (i);
(iv) saat berlabuh, selain lampu atau sosok pada (i) dan (ii), lampu atau sosok menurut Aturan 30.`,
ex:`RAM tetap memakai lampu tiang saat laju, karena mesinnya berfungsi.`,
uj:`Tafsiran resmi IMO (MSC.1/Circ.1260): lampu merah NUC boleh dipakai sebagai bagian lampu RAM asalkan jarak tegak dan mendatarnya memenuhi aturan dan lampu putih RAM bisa dinyalakan terpisah.`},
{k:'c',en:`A power-driven vessel engaged in a towing operation such as severely restricts the towing vessel and her tow in their ability to deviate from their course shall, in addition to the lights or shapes prescribed in Rule 24(a), exhibit the lights or shapes prescribed in sub-paragraphs (b)(i) and (ii) of this Rule.`,id:`Kapal tenaga yang sedang menunda sedemikian rupa sehingga kapal penunda dan tundaannya sangat terbatas untuk menyimpang dari haluan, selain lampu atau sosok Aturan 24(a), harus menunjukkan lampu atau sosok pada sub-paragraf (b)(i) dan (ii) aturan ini.`,ex:`Lampu tunda biasa + merah-putih-merah.`},
{k:'d',en:`A vessel engaged in dredging or underwater operations, when restricted in her ability to manoeuvre, shall exhibit the lights and shapes prescribed in sub-paragraphs (b)(i), (ii) and (iii) of this Rule and shall in addition, when an obstruction exists, exhibit:
(i) two all-round red lights or two balls in a vertical line to indicate the side on which the obstruction exists;
(ii) two all-round green lights or two diamonds in a vertical line to indicate the side on which another vessel may pass;
(iii) when at anchor, the lights or shapes prescribed in this paragraph instead of the lights or shape prescribed in Rule 30.`,
id:`Kapal yang sedang mengeruk atau bekerja di bawah air, saat terbatas kemampuan olah geraknya, harus menunjukkan lampu dan sosok pada sub-paragraf (b)(i), (ii), dan (iii), dan bila ada rintangan, juga harus menunjukkan:
(i) dua lampu merah keliling atau dua bola dalam satu garis tegak untuk menandai sisi yang ada rintangannya;
(ii) dua lampu hijau keliling atau dua belah ketupat dalam satu garis tegak untuk menandai sisi yang boleh dilewati kapal lain;
(iii) saat berlabuh, lampu atau sosok pada paragraf ini sebagai ganti lampu atau sosok Aturan 30.`,
ex:`Hijau (atau belah ketupat) = lewat di sisi ini. Merah (atau bola) = jangan lewat, ada pipa atau kabel.`},
{k:'e',en:`Whenever the size of a vessel engaged in diving operations makes it impracticable to exhibit all lights and shapes prescribed in paragraph (d) of this Rule, the following shall be exhibited:
(i) three all-round lights in a vertical line where they can best be seen. The highest and lowest of these lights shall be red and the middle light shall be white;
(ii) a rigid replica of the International Code flag "A" not less than 1 metre in height. Measures shall be taken to ensure its all-round visibility.`,
id:`Bila ukuran kapal yang sedang mendukung penyelaman tidak memungkinkan menunjukkan semua lampu dan sosok pada paragraf (d), harus ditunjukkan:
(i) tiga lampu keliling dalam satu garis tegak; paling atas dan bawah merah, tengah putih;
(ii) tiruan kaku bendera Kode Internasional "A" setinggi sekurang-kurangnya 1 meter, yang harus terlihat dari segala arah.`,
ex:`Perahu selam kecil memasang bendera A (putih-biru): "Ada penyelam di bawah, menjauh dan pelan."`},
{k:'f',en:`A vessel engaged in mineclearance operations shall in addition to the lights prescribed for a power-driven vessel in Rule 23 or to the lights or shape prescribed for a vessel at anchor in Rule 30 as appropriate, exhibit three all-round green lights or three balls. One of these lights or shapes shall be exhibited near the foremast head and one at each end of the fore yard. These lights or shapes indicate that it is dangerous for another vessel to approach within 1000 metres of the mineclearance vessel.`,id:`Kapal yang sedang membersihkan ranjau, selain lampu kapal tenaga Aturan 23 atau lampu/sosok kapal berlabuh Aturan 30, harus menunjukkan tiga lampu hijau keliling atau tiga bola: satu di dekat puncak tiang depan dan satu di tiap ujung andang-andang depan. Lampu atau sosok ini menandakan berbahaya bagi kapal lain mendekat dalam jarak 1000 meter.`,ex:`Tiga hijau membentuk segitiga. Jauhi minimal 1000 m.`},
